function getPlayerStats(matches) {
  const stats = {};
  matches.forEach(m => {
    const inSquad = new Set(m.squad || []);
    inSquad.forEach(id => {
      if (!stats[id]) stats[id] = { id, goals: 0, assists: 0, played: 0, matches: [] };
      stats[id].played++;
    });
    (m.events || []).forEach(ev => {
      if (ev.type !== 'goal') return;
      if (ev.team === 'home' && !ev.ownGoal && ev.scorerId) {
        if (!stats[ev.scorerId]) stats[ev.scorerId] = { id: ev.scorerId, goals: 0, assists: 0, played: 0, matches: [] };
        stats[ev.scorerId].goals++;
        stats[ev.scorerId].matches.push(m.id);
      }
      if (ev.assistId) {
        if (!stats[ev.assistId]) stats[ev.assistId] = { id: ev.assistId, goals: 0, assists: 0, played: 0, matches: [] };
        stats[ev.assistId].assists++;
      }
    });
  });
  return stats;
}

function generateLastMatchInsights(matches) {
  const ins = [];
  if (!matches.length) return ins;
  const last = matches[matches.length - 1];
  const isWin = last.scoreHome > last.scoreAway;
  const isDraw = last.scoreHome === last.scoreAway;
  const isLoss = last.scoreHome < last.scoreAway;

  // --- Winning/losing/unbeaten streak ---
  let streak = 0, streakType = isWin ? 'win' : isDraw ? 'draw' : 'loss';
  for (let i = matches.length - 1; i >= 0; i--) {
    const m = matches[i];
    const w = m.scoreHome > m.scoreAway, d = m.scoreHome === m.scoreAway;
    if (streakType === 'win' && w) streak++;
    else if (streakType === 'loss' && !w && !d) streak++;
    else break;
  }
  let unbeatStreak = 0;
  for (let i = matches.length - 1; i >= 0; i--) {
    if (matches[i].scoreHome >= matches[i].scoreAway) unbeatStreak++;
    else break;
  }

  if (streak >= 2 && streakType === 'win') {
    ins.push({ tag: 'positive', tagText: 'Reeks',
      title: `${streak} wedstrijden op rij gewonnen`,
      body: `Joga Bonito is on fire! <span class="insight-stat">${streak} zeges</span> op rij.${streak >= 5 ? ' Wat een reeks!' : ''}`
    });
  } else if (streak >= 2 && streakType === 'loss') {
    ins.push({ tag: 'warning', tagText: 'Reeks',
      title: `${streak} nederlagen op rij`,
      body: `<span class="insight-stat">${streak} verliespartijen</span> achter elkaar. Tijd om het tij te keren.`
    });
  } else if (unbeatStreak >= 3) {
    ins.push({ tag: 'positive', tagText: 'Reeks',
      title: `${unbeatStreak} duels ongeslagen`,
      body: `Al <span class="insight-stat">${unbeatStreak} wedstrijden</span> geen nederlaag.`
    });
  }

  // --- Individual performances last match ---
  const homeGoals = (last.events || []).filter(e => e.type === 'goal' && e.team === 'home' && !e.ownGoal && e.scorerId);
  const scorerCount = {};
  const assistCount = {};
  homeGoals.forEach(e => {
    scorerCount[e.scorerId] = (scorerCount[e.scorerId] || 0) + 1;
    if (e.assistId) assistCount[e.assistId] = (assistCount[e.assistId] || 0) + 1;
  });

  Object.entries(scorerCount).sort((a,b) => b[1] - a[1]).forEach(([id, cnt]) => {
    if (cnt >= 3) {
      ins.push({ tag: 'positive', tagText: 'Hattrick',
        title: `${getPlayerName(id)}: ${cnt} goals tegen ${last.opponent}`,
        body: `<span class="insight-stat">${cnt} goals</span> in één wedstrijd! ${cnt >= 4 ? 'Niet te stoppen.' : 'Sterke prestatie.'}`
      });
    } else if (cnt === 2) {
      ins.push({ tag: 'positive', tagText: 'Dubbelslag',
        title: `${getPlayerName(id)}: 2 goals tegen ${last.opponent}`,
        body: `<span class="insight-stat">Twee treffers</span> in de ${isWin ? 'overwinning' : isDraw ? 'gelijkspel' : 'wedstrijd'} tegen ${last.opponent}.`
      });
    }
  });

  // --- Player scoring in consecutive matches ---
  if (matches.length >= 2) {
    const playerGoalsByMatch = {};
    matches.forEach(m => {
      (m.events || []).filter(e => e.type === 'goal' && e.team === 'home' && !e.ownGoal && e.scorerId).forEach(e => {
        if (!playerGoalsByMatch[e.scorerId]) playerGoalsByMatch[e.scorerId] = new Set();
        playerGoalsByMatch[e.scorerId].add(m.id);
      });
    });

    Object.entries(playerGoalsByMatch).forEach(([id, matchSet]) => {
      let consec = 0;
      for (let i = matches.length - 1; i >= 0; i--) {
        if (matchSet.has(matches[i].id)) consec++;
        else break;
      }
      if (consec >= 3) {
        ins.push({ tag: 'positive', tagText: 'Vorm',
          title: `${getPlayerName(id)} scoort in ${consec} duels op rij`,
          body: `Niet te stoppen: <span class="insight-stat">${consec} wedstrijden</span> achter elkaar raak.`
        });
      }
    });
  }

  // --- Clean sheet ---
  if (last.scoreAway === 0) {
    let csStreak = 0;
    for (let i = matches.length - 1; i >= 0; i--) {
      if (matches[i].scoreAway === 0) csStreak++;
      else break;
    }
    ins.push({ tag: 'positive', tagText: 'Clean sheet',
      title: csStreak > 1 ? `${csStreak} clean sheets op rij` : 'De nul gehouden',
      body: `Geen tegengoal tegen ${last.opponent} (${last.scoreHome}-0).${csStreak > 1 ? ` Al <span class="insight-stat">${csStreak} wedstrijden</span> de nul gehouden.` : ''}`
    });
  }

  // --- Big win ---
  const diff = last.scoreHome - last.scoreAway;
  if (diff >= 5) {
    ins.push({ tag: 'positive', tagText: 'Ruime zege',
      title: `${last.scoreHome}-${last.scoreAway} tegen ${last.opponent}`,
      body: `Overtuigende overwinning met <span class="insight-stat">${diff} goals verschil</span>.`
    });
  }

  return ins;
}

function generateSeasonInsights(matches) {
  const ins = [];
  if (matches.length < 2) return ins;

  const wins = matches.filter(m => m.scoreHome > m.scoreAway).length;
  const draws = matches.filter(m => m.scoreHome === m.scoreAway).length;
  const losses = matches.filter(m => m.scoreHome < m.scoreAway).length;
  const gf = matches.reduce((s, m) => s + m.scoreHome, 0);
  const ga = matches.reduce((s, m) => s + m.scoreAway, 0);
  const winPct = Math.round(wins / matches.length * 100);

  // --- Season record ---
  ins.push({
    tag: winPct >= 60 ? 'positive' : winPct <= 35 ? 'warning' : 'neutral', tagText: 'Seizoen',
    title: `${wins}W ${draws}G ${losses}V in ${matches.length} duels`,
    body: `Winstpercentage: <span class="insight-stat">${winPct}%</span>. Doelsaldo: <strong>${gf > ga ? '+' : ''}${gf - ga}</strong> (${gf} voor, ${ga} tegen). Gemiddeld <span class="insight-stat">${(gf / matches.length).toFixed(1)} goals</span> per wedstrijd.`
  });

  // --- Top scorers ---
  const stats = getPlayerStats(matches);
  const scorers = Object.values(stats).filter(s => s.goals > 0).sort((a, b) => b.goals - a.goals);
  if (scorers.length >= 2) {
    const p1 = scorers[0], p2 = scorers[1];
    ins.push({ tag: 'positive', tagText: 'Topscorer',
      title: `${getPlayerName(p1.id)}: ${p1.goals} goals`,
      body: `Topscorer dit seizoen met <span class="insight-stat">${p1.goals} goals</span> en <span class="insight-stat">${p1.assists} assists</span> in ${p1.played} wedstrijden. ${getPlayerName(p2.id)} volgt met <strong>${p2.goals} goals</strong>.`
    });
  }

  // --- Hot player: best last 5 matches ---
  if (matches.length >= 3) {
    const recentN = Math.min(5, matches.length);
    const recent = matches.slice(-recentN);
    const recentStats = getPlayerStats(recent);
    const hot = Object.values(recentStats)
      .filter(s => s.goals + s.assists >= 3 && s.played >= 2)
      .sort((a, b) => (b.goals + b.assists) - (a.goals + a.assists));
    if (hot.length > 0) {
      const p = hot[0];
      ins.push({ tag: 'positive', tagText: 'On fire',
        title: `${getPlayerName(p.id)}: ${p.goals}G ${p.assists}A in laatste ${recentN}`,
        body: `<span class="insight-stat">${p.goals} goals</span> en <span class="insight-stat">${p.assists} assists</span> in de laatste ${recentN} wedstrijden. Niet te stoppen.`
      });
    }
  }

  // --- Top-3 afhankelijkheid ---
  if (scorers.length >= 3 && gf > 0) {
    const top3 = scorers.slice(0, 3);
    const top3Goals = top3.reduce((s, p) => s + p.goals, 0);
    const pct = Math.round(top3Goals / gf * 100);
    if (pct >= 50) {
      ins.push({
        tag: 'positive', tagText: 'Kernspelers',
        title: `Top-3 scoort ${pct}% van alle goals`,
        body: `${top3.map(p => getPlayerName(p.id)).join(', ')} scoren samen <span class="insight-stat">${top3Goals} van ${gf} goals</span>. Sterke kern die het team draagt.`
      });
    }
  }

  // --- Biggest win ---
  const biggestWin = [...matches].filter(m => m.scoreHome > m.scoreAway)
    .sort((a, b) => (b.scoreHome - b.scoreAway) - (a.scoreHome - a.scoreAway))[0];
  if (biggestWin && (biggestWin.scoreHome - biggestWin.scoreAway) >= 4) {
    ins.push({ tag: 'positive', tagText: 'Record',
      title: `Grootste zege: ${biggestWin.scoreHome}-${biggestWin.scoreAway}`,
      body: `Tegen ${biggestWin.opponent} op ${formatDate(biggestWin.date)}. <span class="insight-stat">${biggestWin.scoreHome - biggestWin.scoreAway} goals verschil</span>.`
    });
  }

  return ins;
}

// Hoort de opgehaalde stand bij de poule waarin we nu spelen? Zo niet, dan is
// het de eindstand van vorig seizoen en zegt hij niets over de huidige vorm.
function srzaStandVanDitSeizoen(srza) {
  const programma = srza?.programma || [];
  const standen = srza?.standen || [];
  if (!programma.length || !standen.length) return true;
  const kaal = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const inStand = naam => standen.some(r => {
    const a = kaal(r.team), b = kaal(naam);
    return a && b && (a.includes(b) || b.includes(a));
  });
  const tegenstanders = [...new Set(programma.map(p => p.opp))];
  const herkend = tegenstanders.filter(inStand).length;
  return herkend >= tegenstanders.length / 2;
}

function generateCompetitieInsights() {
  const ins = [];
  const srza = srzaData;
  const hist = HISTORY['2025/26'];
  const prev = HISTORY['2024/25'];
  const all = HISTORY['all'];

  const results = srza?.uitslagen || hist?.results || [];
  // srza publiceert de stand van een nieuwe poule pas als de competitie begint.
  // Tot die tijd staat er de eindstand van vorig seizoen, die daar soms nog
  // herzien wordt. Dan houden we onze eigen vastgelegde eindstand aan.
  const standActueel = srzaStandVanDitSeizoen(srza);
  const standen = (standActueel && srza?.standen?.length) ? srza.standen : (hist?.standings || []);
  const players = hist?.players || [];
  const allPlayers = all?.players || [];

  const jb = standen.find(t => t.team.toUpperCase().includes('JOGA'));

  if (jb && standen.length >= 3) {
    const leader = standen[0];
    const gap = leader.p - jb.p;
    if (jb.pos === 1) {
      const second = standen[1];
      ins.push({ tag: 'positive', tagText: 'Koploper',
        title: 'Bovenaan de ranglijst',
        body: `Joga Bonito staat op <span class="insight-stat">plek 1</span> met <span class="insight-stat">${jb.p} punten</span> uit ${jb.g} wedstrijden. ${jb.p - second.p} punten voorsprong op ${second.team}.`
      });
    } else {
      const slot = standActueel ? '' : ' Dit is de eindstand van 2025/26; de nieuwe poule is nog niet gepubliceerd.';
      ins.push({
        tag: jb.pos <= 3 ? 'neutral' : 'warning', tagText: `#${jb.pos}`,
        title: standActueel
          ? (jb.pos <= 3 ? `Podiumplaats: ${jb.pos}e` : `Positie ${jb.pos} in de stand`)
          : `Vorig seizoen geëindigd als ${jb.pos}e`,
        body: `<span class="insight-stat">${jb.pos}e</span> met <span class="insight-stat">${jb.p} punten</span> uit ${jb.g} wedstrijden (${jb.w}W ${jb.gl}G ${jb.v}V). <span class="insight-stat">${gap} punten</span> achter koploper ${leader.team}. Doelsaldo: <strong>${jb.ds > 0 ? '+' : ''}${jb.ds}</strong> (${jb.dv} voor, ${jb.dt} tegen).${slot}`
      });
    }
  }

  if (results.length >= 6) {
    const home = results.filter(r => r.home);
    const away = results.filter(r => !r.home);
    if (home.length >= 3 && away.length >= 3) {
      const hw = home.filter(r => r.jb > r.opp_s).length;
      const aw = away.filter(r => r.jb > r.opp_s).length;
      const hgf = home.reduce((s, r) => s + r.jb, 0);
      const agf = away.reduce((s, r) => s + r.jb, 0);
      const hPct = Math.round(hw / home.length * 100);
      const aPct = Math.round(aw / away.length * 100);
      ins.push({
        tag: Math.abs(hPct - aPct) > 25 ? 'neutral' : 'positive', tagText: 'Thuis/Uit',
        title: hPct > aPct + 25 ? 'Thuismacht' : aPct > hPct + 25 ? 'Sterker op verplaatsing' : 'Overal gevaarlijk',
        body: `Thuis: <span class="insight-stat">${hw}/${home.length} winst</span> (${hPct}%), ${(hgf / home.length).toFixed(1)} goals/wed. Uit: <span class="insight-stat">${aw}/${away.length} winst</span> (${aPct}%), ${(agf / away.length).toFixed(1)} goals/wed.`
      });
    }
  }

  if (jb && standen.length >= 3 && results.length >= 4) {
    const topTeams = standen.filter(t => t.pos <= 3 && !t.team.toUpperCase().includes('JOGA')).map(t => t.team.toUpperCase());
    const vsTop = results.filter(r => topTeams.some(t => t.includes(r.opp.toUpperCase()) || r.opp.toUpperCase().includes(t)));
    if (vsTop.length >= 2) {
      const tw = vsTop.filter(r => r.jb > r.opp_s).length;
      const td = vsTop.filter(r => r.jb === r.opp_s).length;
      const tl = vsTop.filter(r => r.jb < r.opp_s).length;
      const topNames = [...new Set(vsTop.map(r => r.opp))].join(' en ');
      ins.push({
        tag: tw > tl ? 'positive' : 'warning', tagText: tw > tl ? 'Sterk' : 'Zwakte',
        title: tw > tl ? 'Dominant tegen de top' : 'Moeite met de top',
        body: `Tegen ${topNames}: <span class="insight-stat">${tw}W ${td}G ${tl}V</span>. ${tw > tl ? 'Joga Bonito kan meespelen met de besten.' : `De directe confrontaties kosten punten.${tl > tw + td ? ' Dit is het verschil met de titelkandidaten.' : ''}`}`
      });
    }
  }

  if (players.length >= 4) {
    const topScorer = [...players].sort((a, b) => b.goals - a.goals)[0];
    const xFactor = players
      .filter(p => p.played >= 5 && p.name !== topScorer.name && (p.goals + p.assists) / p.played >= 2)
      .sort((a, b) => (b.goals + b.assists) / b.played - (a.goals + a.assists) / a.played)[0];
    if (xFactor) {
      const ratio = ((xFactor.goals + xFactor.assists) / xFactor.played).toFixed(1);
      ins.push({ tag: 'positive', tagText: 'X-Factor',
        title: `${xFactor.name}: verborgen kracht`,
        body: `<span class="insight-stat">${xFactor.goals} goals</span> en <span class="insight-stat">${xFactor.assists} assists</span> in ${xFactor.played} wedstrijden — ratio <strong>${ratio} per wedstrijd</strong>.`
      });
    }
  }

  if (hist?.totalGoals && prev?.totalGoals) {
    const gGrowth = Math.round((hist.totalGoals - prev.totalGoals) / prev.totalGoals * 100);
    const aGrowth = hist.totalAssists && prev.totalAssists ? Math.round((hist.totalAssists - prev.totalAssists) / prev.totalAssists * 100) : null;
    if (Math.abs(gGrowth) >= 5) {
      ins.push({
        tag: gGrowth > 0 ? 'positive' : 'warning', tagText: 'Groei',
        title: gGrowth > 0 ? 'Aanvalskracht groeit' : 'Minder productief',
        body: `Van <span class="insight-stat">${prev.totalGoals} goals</span> (2024/25) naar <span class="insight-stat">${hist.totalGoals} goals</span> (2025/26): <strong>${gGrowth > 0 ? '+' : ''}${gGrowth}%</strong>.${aGrowth !== null ? ` Assists: ${prev.totalAssists} → ${hist.totalAssists} (${aGrowth > 0 ? '+' : ''}${aGrowth}%).` : ''}`
      });
    }
  }

  const bekerResults = results.filter(r => r.comp === 'BK' || r.comp === 'beker');
  if (bekerResults.length >= 2) {
    const bw = bekerResults.filter(r => r.jb > r.opp_s).length;
    const bl = bekerResults.filter(r => r.jb < r.opp_s).length;
    const bgf = bekerResults.reduce((s, r) => s + r.jb, 0);
    const bga = bekerResults.reduce((s, r) => s + r.opp_s, 0);
    ins.push({
      tag: bw > bl ? 'positive' : 'neutral', tagText: 'Beker',
      title: `Beker: ${bw} winst in ${bekerResults.length} duels`,
      body: `Bekerprestaties: <span class="insight-stat">${bw}W ${bl}V</span>, <strong>${bgf} goals voor, ${bga} tegen</strong>.${bgf / bekerResults.length > 5 ? ' Grote scores in de beker.' : ''}`
    });
  }

  // --- All-time top scorers ---
  if (allPlayers.length >= 3) {
    const top = [...allPlayers].sort((a, b) => b.goals - a.goals).slice(0, 3);
    ins.push({ tag: 'neutral', tagText: 'All-time',
      title: `All-time topscorers`,
      body: top.map((p, i) => `${i + 1}. ${p.name}: <span class="insight-stat">${p.goals} goals</span>, ${p.assists} assists (${p.played} wed.)`).join('<br>')
    });
  }

  return ins;
}

function renderInsightSection(h, title, insights, shareKey) {
  if (!insights.length) return h;
  h += `<div class="insight-section"><div class="insight-section-title" style="display:flex;justify-content:space-between;align-items:center">${title}
    <button class="share-btn-sm" onclick="shareInsights('${shareKey}')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      Delen</button>
  </div></div>`;
  insights.forEach(ins => {
    h += `<div class="insight-card">
      <span class="insight-tag ${ins.tag}">${ins.tagText}</span>
      <div class="insight-title">${ins.title}</div>
      <div class="insight-body">${ins.body}</div>
    </div>`;
  });
  return h;
}

function renderAnalysePage() {
  const c = document.getElementById('analyseContent');
  // Alleen het lopende seizoen: anders presenteert de app een reeks van vorig
  // seizoen als actuele vorm. De competitie-inzichten gaan wél over de
  // historie en staan onder hun eigen kopje.
  const finished = seasonMatches(DB.season).sort((a, b) => new Date(a.date) - new Date(b.date));

  const lastMatch = generateLastMatchInsights(finished);
  const season = generateSeasonInsights(finished);
  const comp = generateCompetitieInsights();

  const hasAny = lastMatch.length || season.length || comp.length;

  let h = `<div class="analyse-header">
    <h2>AI Analyse</h2>
    <p>${finished.length
      ? `${finished.length} ${finished.length === 1 ? 'wedstrijd' : 'wedstrijden'} in ${DB.season} geanalyseerd`
      : `Nog geen wedstrijden in ${DB.season} — inzichten verschijnen na je eerste wedstrijd`}</p>
  </div>`;

  if (!hasAny) {
    h += `<div class="empty-state" style="padding:30px 0"><p style="color:var(--text-muted)">Nog niet genoeg data voor analyse. Speel je eerste wedstrijd!</p></div>`;
  } else {
    h = renderInsightSection(h, 'Laatste wedstrijd', lastMatch, 'last');
    h = renderInsightSection(h, `Seizoen ${DB.season}`, season, 'season');
    h = renderInsightSection(h, 'Competitie & All-time', comp, 'comp');
  }

  c.innerHTML = h;
}

async function shareMatchCard(matchId) {
  const m = DB.matches.find(x => x.id === matchId);
  if (!m) return;

  const W = 390, PAD = 24;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  const goals = (m.events || []).filter(e => e.type === 'goal' && e.team === 'home' && !e.ownGoal);
  const awayGoals = (m.events || []).filter(e => e.type === 'goal' && (e.team === 'away' || e.ownGoal));
  const goalLines = goals.map(g => {
    let t = g.scorerId ? getPlayerName(g.scorerId) : '';
    if (g.assistId) t += ` (${getPlayerName(g.assistId)})`;
    return t;
  }).filter(Boolean);

  const lineupPlayers = (m.lineup || []).map(id => getPlayer(id)).filter(Boolean);
  const keeperPlayer = m.keeper ? getPlayer(m.keeper) : null;
  const fieldLineup = lineupPlayers.filter(p => p.id !== m.keeper);
  const hasLineup = keeperPlayer && fieldLineup.length > 0;

  const lineH = 24;
  const goalsH = goalLines.length ? goalLines.length * lineH + 36 : 0;
  const motmH = m.motm ? 44 : 0;
  const lineupH = hasLineup ? 50 : 0;
  const H = 240 + goalsH + motmH + lineupH + 50;
  canvas.width = W;
  canvas.height = H;

  // Background
  ctx.fillStyle = '#0A0A0A';
  ctx.fillRect(0, 0, W, H);

  // Header gradient
  const grad = ctx.createLinearGradient(0, 0, W, 90);
  grad.addColorStop(0, '#C4922E');
  grad.addColorStop(1, '#D4A843');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 90);

  // Logo text
  ctx.fillStyle = '#0A0A0A';
  ctx.font = '700 24px "Pirata One", serif';
  ctx.textAlign = 'center';
  ctx.fillText('Joga Bonito', W / 2, 38);

  // Date + location
  ctx.font = '400 11px "Nunito", sans-serif';
  ctx.fillStyle = 'rgba(10,10,10,0.5)';
  const dateTxt = formatDate(m.date) + (m.sporthal ? ' · ' + m.sporthal : '');
  ctx.fillText(dateTxt, W / 2, 58);

  // Match type
  if (m.comp) {
    const typeMap = { comp: 'Competitie', beker: 'Beker', friendly: 'Vriendschappelijk' };
    ctx.font = '600 10px "Montserrat", sans-serif';
    ctx.fillStyle = 'rgba(10,10,10,0.4)';
    ctx.fillText(typeMap[m.comp] || m.comp, W / 2, 78);
  }

  // Score section
  let y = 135;
  ctx.fillStyle = '#E8E4DE';
  ctx.font = '800 44px "Montserrat", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${m.scoreHome} – ${m.scoreAway}`, W / 2, y);

  // Team names
  y += 28;
  ctx.font = '600 13px "Montserrat", sans-serif';
  ctx.fillStyle = '#E8E4DE';
  ctx.textAlign = 'right';
  ctx.fillText(DB.teamName, W / 2 - 40, y);
  ctx.fillStyle = '#888888';
  ctx.textAlign = 'left';
  ctx.fillText(m.opponent || 'Tegenstander', W / 2 + 40, y);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#888888';
  ctx.font = '400 11px "Nunito", sans-serif';
  ctx.fillText('vs', W / 2, y);

  // Divider
  y += 20;
  if (goalLines.length > 0) {
    ctx.strokeStyle = '#2A2A2A';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PAD, y);
    ctx.lineTo(W - PAD, y);
    ctx.stroke();

    y += 24;
    ctx.font = '600 12px "Nunito", sans-serif';
    ctx.fillStyle = '#E8E4DE';
    ctx.textAlign = 'left';
    goalLines.forEach(line => {
      ctx.fillText('⚽  ' + line, PAD + 8, y);
      y += lineH;
    });
  }

  // Starting lineup
  if (hasLineup) {
    y += 4;
    ctx.strokeStyle = '#2A2A2A';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PAD, y);
    ctx.lineTo(W - PAD, y);
    ctx.stroke();
    y += 20;
    ctx.textAlign = 'left';
    ctx.font = '700 10px "Montserrat", sans-serif';
    ctx.fillStyle = '#888888';
    ctx.fillText('OPSTELLING', PAD + 8, y);
    y += 18;
    ctx.font = '500 11px "Nunito", sans-serif';
    ctx.fillStyle = '#E8E4DE';
    const lineupStr = (keeperPlayer ? keeperPlayer.name + ' (GK)' : '') +
      (fieldLineup.length ? ' · ' + fieldLineup.map(p => p.name).join(' · ') : '');
    ctx.fillText(lineupStr, PAD + 8, y);
  }

  // MOTM
  if (m.motm) {
    y += 4;
    ctx.strokeStyle = '#2A2A2A';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PAD, y + 8);
    ctx.lineTo(W - PAD, y + 8);
    ctx.stroke();

    y += 30;
    ctx.textAlign = 'center';
    ctx.font = '600 12px "Nunito", sans-serif';
    ctx.fillStyle = '#F59E0B';
    ctx.fillText('⭐ Man of the Match: ' + getPlayerName(m.motm), W / 2, y);
  }

  // Footer
  y = H - 20;
  ctx.font = '400 10px "Nunito", sans-serif';
  ctx.fillStyle = '#888888';
  ctx.textAlign = 'center';
  ctx.fillText('Joga Bonito · ' + DB.season, W / 2, y);

  // Share
  try {
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const file = new File([blob], `joga-bonito-${m.opponent?.replace(/\s+/g, '-').toLowerCase() || 'wedstrijd'}.png`, { type: 'image/png' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        title: `${DB.teamName} ${m.scoreHome} – ${m.scoreAway} ${m.opponent}`,
        files: [file]
      });
    } else {
      const link = document.createElement('a');
      link.download = file.name;
      link.href = URL.createObjectURL(blob);
      link.click();
      URL.revokeObjectURL(link.href);
      showToast('Afbeelding gedownload');
    }
  } catch (e) {
    if (e.name !== 'AbortError') showToast('Delen niet gelukt');
  }
}

function createShareCanvas(W) {
  const canvas = document.createElement('canvas');
  canvas.width = W;
  const ctx = canvas.getContext('2d');
  return { canvas, ctx };
}

function drawCardHeader(ctx, W, subtitle) {
  const grad = ctx.createLinearGradient(0, 0, W, 100);
  grad.addColorStop(0, '#C4922E');
  grad.addColorStop(1, '#D4A843');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 100);
  ctx.fillStyle = '#0A0A0A';
  ctx.font = '700 28px "Pirata One", serif';
  ctx.textAlign = 'center';
  ctx.fillText('Joga Bonito', W / 2, 42);
  ctx.font = '400 12px "Nunito", sans-serif';
  ctx.fillStyle = 'rgba(10,10,10,0.5)';
  ctx.fillText(subtitle, W / 2, 70);
}

function drawCardFooter(ctx, W, H) {
  ctx.font = '400 11px "Nunito", sans-serif';
  ctx.fillStyle = '#888888';
  ctx.textAlign = 'center';
  ctx.fillText('Joga Bonito · ' + DB.season, W / 2, H - 18);
}

function stripHTML(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent;
}

async function doShare(canvas, filename) {
  try {
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const file = new File([blob], filename + '.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ title: 'Joga Bonito', files: [file] });
    } else {
      const link = document.createElement('a');
      link.download = file.name;
      link.href = URL.createObjectURL(blob);
      link.click();
      URL.revokeObjectURL(link.href);
      showToast('Afbeelding gedownload');
    }
  } catch (e) {
    if (e.name !== 'AbortError') showToast('Delen niet gelukt');
  }
}

async function shareInsights(key) {
  const finished = DB.matches.filter(m => m.status === 'finished').sort((a, b) => new Date(a.date) - new Date(b.date));
  let insights, title;
  if (key === 'last') { insights = generateLastMatchInsights(finished); title = 'Laatste wedstrijd'; }
  else if (key === 'season') { insights = generateSeasonInsights(finished); title = 'Seizoen ' + DB.season; }
  else { insights = generateCompetitieInsights(); title = 'Competitie & All-time'; }
  if (!insights.length) return;

  const W = 390, PAD = 24, lineH = 20;
  const items = insights.map(ins => ({
    tag: ins.tagText, title: ins.title,
    lines: wrapText(stripHTML(ins.body), W - PAD * 2 - 20, '400 11px "Nunito", sans-serif')
  }));
  let totalH = 110;
  items.forEach(it => { totalH += 44 + it.lines.length * lineH + 16; });
  totalH += 30;

  const { canvas, ctx } = createShareCanvas(W);
  canvas.height = totalH;
  ctx.fillStyle = '#0A0A0A';
  ctx.fillRect(0, 0, W, totalH);
  drawCardHeader(ctx, W, title);

  let y = 95;
  items.forEach(it => {
    ctx.fillStyle = '#1A1A1A';
    const cardH = 36 + it.lines.length * lineH + 12;
    ctx.beginPath();
    ctx.roundRect(PAD, y, W - PAD * 2, cardH, 8);
    ctx.fill();

    ctx.font = '700 9px "Montserrat", sans-serif';
    ctx.fillStyle = '#059669';
    ctx.textAlign = 'left';
    ctx.fillText(it.tag.toUpperCase(), PAD + 12, y + 16);

    ctx.font = '700 12px "Montserrat", sans-serif';
    ctx.fillStyle = '#E8E4DE';
    ctx.fillText(it.title, PAD + 12, y + 32);

    ctx.font = '400 11px "Nunito", sans-serif';
    ctx.fillStyle = '#888888';
    it.lines.forEach((line, i) => {
      ctx.fillText(line, PAD + 12, y + 48 + i * lineH);
    });

    y += cardH + 10;
  });

  drawCardFooter(ctx, W, totalH);
  await doShare(canvas, 'joga-bonito-analyse-' + key);
}

function wrapText(text, maxWidth, font) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = font;
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(word => {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  });
  if (line) lines.push(line);
  return lines;
}

async function shareStatsCard() {
  let scorers = [];
  let subtitle = 'Statistieken ' + DB.season;

  if (selectedStatsSeason === 'current') {
    const finished = DB.matches.filter(m => m.status === 'finished');
    const stats = getPlayerStats(finished);
    scorers = Object.values(stats).filter(s => s.goals > 0 || s.assists > 0 || s.played > 0)
      .sort((a, b) => b.goals - a.goals || b.assists - a.assists)
      .map(s => ({ name: getPlayerName(s.id), played: s.played, goals: s.goals, assists: s.assists }));
  } else {
    const key = selectedStatsSeason === 'all' ? 'all' : selectedStatsSeason;
    const hist = HISTORY[key];
    if (hist?.players) {
      scorers = hist.players.map(p => ({ name: p.name, played: p.played, goals: p.goals, assists: p.assists }));
    }
    subtitle = key === 'all' ? 'All-time statistieken' : 'Statistieken ' + key;
  }
  if (!scorers.length) return showToast('Geen stats om te delen');

  const W = 390, PAD = 24, rowH = 26;
  const H = 130 + scorers.length * rowH + 40;
  const { canvas, ctx } = createShareCanvas(W);
  canvas.height = H;
  ctx.fillStyle = '#0A0A0A';
  ctx.fillRect(0, 0, W, H);
  drawCardHeader(ctx, W, subtitle);

  let y = 100;
  ctx.font = '700 9px "Montserrat", sans-serif';
  ctx.fillStyle = '#888888';
  ctx.textAlign = 'left';
  ctx.fillText('SPELER', PAD + 30, y);
  ctx.textAlign = 'center';
  ctx.fillText('W', W - 130, y);
  ctx.fillText('G', W - 95, y);
  ctx.fillText('A', W - 65, y);
  ctx.fillText('G+A', W - PAD - 10, y);
  y += 8;
  ctx.strokeStyle = '#2A2A2A';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
  y += 4;

  scorers.forEach((s, i) => {
    if (i % 2 === 0) {
      ctx.fillStyle = '#1A1A1A';
      ctx.fillRect(PAD, y - 2, W - PAD * 2, rowH);
    }
    ctx.font = '700 10px "Montserrat", sans-serif';
    ctx.fillStyle = '#888888';
    ctx.textAlign = 'left';
    ctx.fillText((i + 1) + '.', PAD + 8, y + 14);
    ctx.font = '600 11px "Nunito", sans-serif';
    ctx.fillStyle = '#E8E4DE';
    ctx.fillText(s.name, PAD + 30, y + 14);
    ctx.textAlign = 'center';
    ctx.font = '400 11px "Nunito", sans-serif';
    ctx.fillStyle = '#888888';
    ctx.fillText(s.played.toString(), W - 130, y + 14);
    ctx.font = '700 11px "Montserrat", sans-serif';
    ctx.fillStyle = '#E8E4DE';
    ctx.fillText(s.goals.toString(), W - 95, y + 14);
    ctx.fillText(s.assists.toString(), W - 65, y + 14);
    ctx.fillStyle = '#059669';
    ctx.fillText((s.goals + s.assists).toString(), W - PAD - 10, y + 14);
    y += rowH;
  });

  drawCardFooter(ctx, W, H);
  await doShare(canvas, 'joga-bonito-stats');
}

async function sharePlayerCard(id) {
  const p = getPlayer(id);
  if (!p) return;
  const career = getPlayerCareerStats(p.name, id);
  if (!career.totalPlayed) { showToast('Geen stats om te delen'); return; }

  const W = 390, PAD = 24, rowH = 26;
  const seasonRows = career.seasons.length;
  const hasTotal = career.seasons.length > 1;
  const careerH = seasonRows * rowH + (hasTotal ? rowH + 8 : 0) + 26;
  const H = 210 + careerH + 40;
  const { canvas, ctx } = createShareCanvas(W);
  canvas.height = H;
  ctx.fillStyle = '#0A0A0A';
  ctx.fillRect(0, 0, W, H);

  const grd = ctx.createLinearGradient(0, 0, W, 100);
  grd.addColorStop(0, '#C4922E');
  grd.addColorStop(1, '#D4A843');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, 100);

  ctx.fillStyle = 'rgba(10,10,10,0.15)';
  ctx.beginPath(); ctx.arc(W - 40, 50, 32, 0, Math.PI * 2); ctx.fill();
  ctx.font = '800 30px "Montserrat", sans-serif';
  ctx.fillStyle = 'rgba(10,10,10,0.3)';
  ctx.textAlign = 'center';
  ctx.fillText(`#${p.number}`, W - 40, 62);

  ctx.textAlign = 'left';
  ctx.font = '800 20px "Montserrat", sans-serif';
  ctx.fillStyle = '#0A0A0A';
  ctx.fillText(p.name, PAD, 40);

  const badges = [];
  if (p.isKeeper) badges.push('Keeper');
  if (p.isCaptain) badges.push('Aanvoerder');
  if (badges.length) {
    ctx.font = '600 10px "Nunito", sans-serif';
    ctx.fillStyle = 'rgba(10,10,10,0.5)';
    ctx.fillText(badges.join(' · '), PAD, 58);
  }

  ctx.font = '18px "Pirata One", cursive';
  ctx.fillStyle = 'rgba(10,10,10,0.4)';
  ctx.fillText('Joga Bonito', PAD, 85);

  let y = 112;
  const statW = (W - PAD * 2) / 3;
  const statsData = [
    { val: career.totalPlayed, label: 'Wedstrijden' },
    { val: career.totalGoals, label: 'Goals' },
    { val: career.totalAssists, label: 'Assists' },
  ];
  statsData.forEach((s, i) => {
    const x = PAD + i * statW + statW / 2;
    ctx.font = '800 22px "Montserrat", sans-serif';
    ctx.fillStyle = '#C4922E';
    ctx.textAlign = 'center';
    ctx.fillText(String(s.val), x, y + 24);
    ctx.font = '400 9px "Nunito", sans-serif';
    ctx.fillStyle = '#888888';
    ctx.fillText(s.label, x, y + 38);
  });

  if (career.totalPlayed > 0) {
    const ratio = ((career.totalGoals + career.totalAssists) / career.totalPlayed).toFixed(1);
    const gpw = career.totalGoals ? (career.totalGoals / career.totalPlayed).toFixed(1) : '0';
    const extra = [
      { val: ratio, label: 'G/A ratio' },
      { val: gpw, label: 'Goals / wed.' },
      { val: String(career.motm), label: 'MOTM' },
    ];
    extra.forEach((s, i) => {
      const x = PAD + i * statW + statW / 2;
      ctx.font = '800 16px "Montserrat", sans-serif';
      ctx.fillStyle = '#C4922E';
      ctx.textAlign = 'center';
      ctx.fillText(String(s.val), x, y + 66);
      ctx.font = '400 9px "Nunito", sans-serif';
      ctx.fillStyle = '#888888';
      ctx.fillText(s.label, x, y + 80);
    });
    y += 94;
  } else {
    y += 50;
  }

  ctx.font = '800 10px "Montserrat", sans-serif';
  ctx.fillStyle = '#C4922E';
  ctx.textAlign = 'left';
  ctx.fillText('CARRIÈRE', PAD, y);
  y += 12;

  career.seasons.forEach(s => {
    ctx.font = '600 10px "Nunito", sans-serif';
    ctx.fillStyle = '#E8E4DE';
    ctx.textAlign = 'left';
    ctx.fillText(s.season, PAD + 8, y + 16);
    ctx.font = '400 10px "Nunito", sans-serif';
    ctx.fillStyle = '#888888';
    ctx.textAlign = 'right';
    ctx.fillText(`${s.played} wed   ${s.goals} G   ${s.assists} A`, W - PAD - 8, y + 16);
    y += rowH;
  });

  if (hasTotal) {
    y += 4;
    ctx.fillStyle = '#C4922E';
    ctx.beginPath();
    ctx.roundRect(PAD, y, W - PAD * 2, rowH, 6);
    ctx.fill();
    ctx.font = '700 10px "Nunito", sans-serif';
    ctx.fillStyle = '#0A0A0A';
    ctx.textAlign = 'left';
    ctx.fillText('All-time', PAD + 8, y + 16);
    ctx.textAlign = 'right';
    ctx.fillText(`${career.totalPlayed} wed   ${career.totalGoals} G   ${career.totalAssists} A`, W - PAD - 8, y + 16);
  }

  drawCardFooter(ctx, W, H);
  await doShare(canvas, `joga-bonito-${p.name.toLowerCase()}`);
}

function getMatchResult(m) {
  if (m.scoreHome > m.scoreAway) return 'win';
  if (m.scoreHome < m.scoreAway) return 'loss';
  return 'draw';
}
function formatDate(d) {
  try { return new Date(d).toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'}); }
  catch(e) { return d; }
}

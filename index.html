<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Joga Bonito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Montserrat:wght@400;600;700;800;900&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
 * JOGA BONITO — BRAND GUIDE
 *
 * Typography
 *   Logo:     Pirata One — title case ("Joga Bonito"), nooit all-caps
 *   Headings: Montserrat 600–800
 *   Body:     Nunito 400–700
 *
 * Palette
 *   --navy         #1B2A4A   primair (headers, knoppen, accenten)
 *   --navy-dark    #0F1B32   hover / pressed state
 *   --navy-light   #2C3E6B   secondary actions, subtiel accent
 *   --surface      #FFFFFF   cards, modals
 *   --bg           #F0F2F5   pagina-achtergrond
 *   --border       #E2E8F0   scheidslijnen
 *   --text         #1A1A2E   primaire tekst op licht
 *   --text-muted   #64748B   secundaire tekst
 *   --on-primary   #FFFFFF   tekst/iconen op navy
 *
 * Functionele kleuren (alleen sport-specifiek)
 *   --card-green   #10B981   groene kaart (2 min straftijd)
 *   --card-yellow  #F59E0B   gele kaart (5 min straftijd)
 *   --card-red     #EF4444   rode kaart (uitsluiting)
 *
 * Resultaat-indicatoren (subtiel, op surface)
 *   Win:  navy 8% opacity
 *   Loss: red  8% opacity
 *   Draw: muted 8% opacity
 *
 * Alle interactieve elementen gebruiken navy/on-primary.
 * Geen groen voor "succes", geen rood voor "gevaar" buiten sportcontext.
 * Kaart-kleuren zijn de officiële sportkleuren, geen UI-semantiek.
 */

:root {
  --navy: #1B2A4A;
  --navy-dark: #0F1B32;
  --navy-light: #2C3E6B;
  --navy-10: rgba(27,42,74,0.08);
  --navy-20: rgba(27,42,74,0.15);
  --surface: #FFFFFF;
  --bg: #F0F2F5;
  --border: #E2E8F0;
  --text: #1A1A2E;
  --text-muted: #64748B;
  --on-primary: #FFFFFF;
  --card-green: #10B981;
  --card-green-bg: #D1FAE5;
  --card-yellow: #F59E0B;
  --card-yellow-bg: #FEF3C7;
  --card-red: #EF4444;
  --card-red-bg: #FEE2E2;
  --win-bg: rgba(27,42,74,0.06);
  --loss-bg: rgba(239,68,68,0.06);
  --draw-bg: rgba(100,116,139,0.06);
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 2px 8px rgba(27,42,74,0.07);
  --shadow-lg: 0 8px 24px rgba(27,42,74,0.12);
  --transition: 0.2s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
  padding-bottom: 72px;
}
h1, h2, h3, h4, h5 { font-family: 'Montserrat', sans-serif; }

/* ===== TOP BAR ===== */
.topbar {
  background: var(--navy);
  color: var(--on-primary);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-logo {
  font-family: 'Pirata One', cursive;
  font-size: 1.5rem;
  font-weight: 400;
  letter-spacing: 0.5px;
}
.topbar .season-badge {
  font-family: 'Nunito', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  background: var(--navy-20);
  padding: 3px 10px;
  border-radius: 20px;
}

/* ===== BOTTOM NAV ===== */
.bottomnav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  display: flex;
  justify-content: space-around;
  padding: 6px 0 env(safe-area-inset-bottom, 8px);
  border-top: 1px solid var(--border);
  z-index: 100;
}
.bottomnav button {
  background: none;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 6px;
  cursor: pointer;
  color: var(--text-muted);
  font-family: 'Nunito', sans-serif;
  font-size: 0.65rem;
  font-weight: 600;
  transition: color var(--transition);
  position: relative;
}
.bottomnav button.active { color: var(--navy); }
.bottomnav button .nav-icon { font-size: 1.4rem; }
.bottomnav button.active::after {
  content: '';
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 3px;
  background: var(--navy);
  border-radius: 0 0 3px 3px;
}
.bottomnav .live-dot {
  position: absolute;
  top: 2px;
  right: 8px;
  width: 8px;
  height: 8px;
  background: var(--navy-light);
  border-radius: 50%;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.4); }
}

/* ===== PAGES ===== */
.page { display: none; padding: 16px; max-width: 600px; margin: 0 auto; }
.page.active { display: block; }

/* ===== CARD ===== */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'Montserrat', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--transition);
  letter-spacing: 0.3px;
}
.btn-primary { background: var(--navy); color: var(--on-primary); }
.btn-primary:hover { background: var(--navy-dark); }
.btn-secondary { background: var(--navy-10); color: var(--navy); }
.btn-secondary:hover { background: var(--navy-20); }
.btn-outline { background: transparent; color: var(--navy); border: 2px solid var(--navy); }
.btn-outline:hover { background: var(--navy); color: var(--on-primary); }
.btn-danger-outline { background: transparent; color: var(--card-red); border: 2px solid var(--card-red); }
.btn-sm { padding: 8px 16px; font-size: 0.8rem; }
.btn-lg { padding: 16px 32px; font-size: 1.05rem; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

/* ===== FORMS ===== */
input, select {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  color: var(--text);
  background: var(--surface);
  transition: border-color var(--transition);
}
input:focus, select:focus { outline: none; border-color: var(--navy); }
label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  font-size: 0.8rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.form-group { margin-bottom: 16px; }

/* ===== MODAL ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 500px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 8px 20px 32px;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-bar {
  display: block;
  width: 40px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 8px auto 16px;
}
.modal h3 { font-size: 1.05rem; margin-bottom: 16px; text-align: center; }
.modal-cancel {
  display: block;
  width: 100%;
  text-align: center;
  padding: 14px;
  margin-top: 8px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: 'Nunito', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
}
.modal-cancel:hover { color: var(--text); }

/* ===== TOAST (undo) ===== */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--navy);
  color: var(--on-primary);
  padding: 12px 20px;
  border-radius: var(--radius);
  font-family: 'Nunito', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  z-index: 300;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-lg);
  transition: transform 0.3s ease, opacity 0.3s ease;
  max-width: 90%;
  opacity: 0;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.hiding { transform: translateX(-50%) translateY(0); opacity: 0; }
.toast button {
  background: var(--on-primary);
  color: var(--navy);
  border: none;
  padding: 4px 12px;
  border-radius: 4px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.75rem;
  cursor: pointer;
  white-space: nowrap;
}

/* ===== AVATAR ===== */
.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 0.85rem;
  flex-shrink: 0;
  background: var(--navy);
  color: var(--on-primary);
  overflow: hidden;
  position: relative;
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  inset: 0;
}
.avatar-num {
  position: absolute;
  bottom: -2px;
  right: -2px;
  min-width: 16px;
  height: 16px;
  padding: 0 3px;
  background: var(--navy);
  color: white;
  border-radius: 8px;
  font-size: 0.5rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid white;
  z-index: 1;
  line-height: 1;
}
.avatar-sm { width: 32px; height: 32px; font-size: 0.75rem; }
.avatar-lg { width: 56px; height: 56px; font-size: 1.1rem; }
.avatar-xl { width: 72px; height: 72px; font-size: 1.4rem; }

/* ===== PLAYER LIST ===== */
.player-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--bg);
}
.player-item:last-child { border-bottom: none; }
.player-info { flex: 1; min-width: 0; }
.player-name { font-weight: 700; font-size: 0.95rem; }
.player-badges { display: flex; gap: 4px; margin-top: 2px; }
.player-badge {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--navy-10);
  color: var(--navy);
}
.player-actions { display: flex; gap: 6px; }
.player-actions button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1rem;
  padding: 4px;
  opacity: 0.4;
  transition: opacity var(--transition);
}
.player-actions button:hover { opacity: 1; }

/* ===== SQUAD SELECTION ===== */
.squad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.squad-player {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
}
.squad-player.selected { border-color: var(--navy); background: var(--navy-10); }
.squad-player .sq-name {
  font-weight: 600;
  font-size: 0.82rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.squad-player .sq-badge {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--navy);
}

/* ===== LINEUP ROLES ===== */
.lineup-role-section { margin-bottom: 16px; }
.lineup-role-label {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.lineup-player {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  margin-bottom: 6px;
}
.lineup-player.selected { border-color: var(--navy); background: var(--navy-10); }
.lineup-player .lp-name { font-weight: 600; font-size: 0.85rem; flex: 1; }
.lineup-player .lp-role {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--navy-light);
}

/* ===== MATCH LIVE ===== */
.match-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
  color: var(--on-primary);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  margin-bottom: 12px;
}
.match-timer {
  font-family: 'Montserrat', sans-serif;
  font-size: 3rem;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 4px;
}
.match-half-label {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
  opacity: 0.65;
  margin-bottom: 16px;
}
.match-score-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.match-team-name {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.82rem;
  text-transform: uppercase;
  flex: 1;
  min-width: 0;
}
.match-team-name.home { text-align: right; }
.match-team-name.away { text-align: left; }
.match-score {
  font-family: 'Montserrat', sans-serif;
  font-size: 2.2rem;
  font-weight: 900;
  background: rgba(255,255,255,0.1);
  padding: 4px 20px;
  border-radius: var(--radius-sm);
  min-width: 100px;
  flex-shrink: 0;
  text-align: center;
  letter-spacing: 4px;
  white-space: nowrap;
}
.timer-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
}
.timer-btn {
  background: rgba(255,255,255,0.12);
  border: none;
  color: var(--on-primary);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition);
}
.timer-btn:hover { background: rgba(255,255,255,0.22); }

/* ===== MATCH ACTIONS ===== */
.match-actions { display: flex; gap: 10px; margin-bottom: 12px; }
.action-btn {
  flex: 1;
  padding: 18px 12px;
  border: none;
  border-radius: var(--radius);
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 1.05rem;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.action-btn.goal-btn {
  background: var(--navy-light);
  color: var(--on-primary);
  flex: 2;
}
.action-btn.goal-btn:hover { background: var(--navy); }
.action-btn.card-btn {
  background: var(--surface);
  color: var(--text);
  border: 2px solid var(--border);
}
.action-btn.card-btn:hover { border-color: var(--navy); }
.action-btn.fk-btn {
  background: var(--surface);
  color: var(--text);
  border: 2px solid var(--border);
  flex: 1;
  font-size: 0.75rem;
  padding: 12px 10px;
  flex-direction: column;
  gap: 4px;
}
.action-btn.fk-btn.active-fk {
  border-color: var(--card-red);
  background: var(--card-red-bg);
}
.pp-icon {
  display: inline-block;
  width: 28px;
  height: 24px;
  vertical-align: middle;
}
.pp-icon svg { width: 100%; height: 100%; }
.pp-icon.pp-sm { width: 20px; height: 17px; }

/* ===== TIMELINE ===== */
.timeline-event {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--bg);
}
.timeline-event:last-child { border-bottom: none; }
.timeline-minute {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.82rem;
  color: var(--text-muted);
  min-width: 32px;
  text-align: right;
}
.timeline-icon { font-size: 1rem; flex-shrink: 0; }
.timeline-detail { flex: 1; font-size: 0.88rem; }
.timeline-detail strong { font-weight: 700; }
.timeline-detail .sub-text { color: var(--text-muted); font-size: 0.78rem; }
.timeline-score {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.78rem;
  color: var(--navy);
  background: var(--navy-10);
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
}
.timeline-event.opponent-goal { opacity: 0.55; }
.timeline-event.opponent-goal .timeline-score { color: var(--text-muted); background: var(--draw-bg); }
.timeline-event.own-goal .timeline-icon { color: var(--card-red); }
.timeline-event.own-goal .timeline-detail strong { color: var(--card-red); }

/* ===== STATS ===== */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.stat-box {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 12px 6px;
  text-align: center;
  box-shadow: var(--shadow);
}
.stat-value {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 1.4rem;
  color: var(--navy);
}
.stat-label {
  font-size: 0.65rem;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-top: 2px;
}

.leaderboard-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--bg);
}
.leaderboard-item:last-child { border-bottom: none; }
.lb-rank {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 0.9rem;
  color: var(--text-muted);
  width: 20px;
  text-align: center;
}
.lb-rank.top { color: var(--navy); }
.lb-stats {
  display: flex;
  gap: 12px;
  margin-left: auto;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--navy);
}
.lb-stats .stat-icon { margin-right: 2px; font-size: 0.75rem; }

/* ===== SCHEDULE ===== */
.schedule-match {
  display: flex;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--bg);
  gap: 12px;
}
.schedule-match:last-child { border-bottom: none; }
.sched-date {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.72rem;
  color: var(--text-muted);
  text-align: center;
  min-width: 44px;
  line-height: 1.3;
}
.sched-date .sched-day { font-size: 1.15rem; color: var(--text); }
.sched-info { flex: 1; }
.sched-opponent { font-weight: 700; font-size: 0.92rem; }
.sched-meta { font-size: 0.72rem; color: var(--text-muted); }
.sched-result {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 0.95rem;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  min-width: 54px;
  text-align: center;
}
.sched-result.win { background: var(--win-bg); color: var(--navy); }
.sched-result.loss { background: var(--loss-bg); color: var(--card-red); }
.sched-result.draw { background: var(--draw-bg); color: var(--text-muted); }
.sched-result.upcoming { background: var(--bg); color: var(--text-muted); font-weight: 600; font-size: 0.78rem; }
.match-type {
  display: inline-block;
  font-size: 0.58rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  padding: 1px 5px;
  border-radius: 3px;
  margin-left: 4px;
  vertical-align: middle;
}
.match-type.comp { background: var(--navy-10); color: var(--navy); }
.match-type.beker { background: #FEF3C7; color: #92400E; }
.match-type.friendly { background: #E5E7EB; color: #6B7280; }
.srza-show-all {
  display: block;
  width: 100%;
  text-align: center;
  padding: 10px;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--navy);

function matchTypeHTML(comp) {

}

function srzaResultClass(m) {
  if (m.jb > m.opp_s) return 'win';

}

async function loadSRZA() {

// =========================================================
// TIMER
// =========================================================
let timerInterval = null;
let timerSeconds = 20 * 60;
let timerRunning = false;

function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  timerInterval = setInterval(() => {
    if (timerSeconds > 0) { timerSeconds--; renderTimerDisplay(); }
    else { stopTimer(); onTimerEnd(); }
  }, 1000);
  renderMatchView();
}
function stopTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  renderMatchView();
}
function resetTimer() { stopTimer(); timerSeconds = 20 * 60; renderMatchView(); }

function getCurrentMinute() {
  const cm = DB.currentMatch;
  if (!cm) return 0;
  const elapsed = (20*60) - timerSeconds;
  const min = Math.ceil(elapsed / 60);
  return cm.half === 2 ? 20 + (min || 1) : (min || 1);
}

function formatTimer(sec) {
  return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
}
function renderTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = formatTimer(timerSeconds);
}
function onTimerEnd() {
  const cm = DB.currentMatch;
  if (!cm) return;
  if (cm.half === 1) {
    showPhaseOverlay('Rust', `${cm.scoreHome} – ${cm.scoreAway}`, 'Start 2e Helft', () => {
      cm.half = 2; timerSeconds = 20*60; saveData(); hidePhaseOverlay(); startTimer();
    });
  } else {
    cm.status = 'fulltime'; saveData();
    showPhaseOverlay('Einde Wedstrijd', `${cm.scoreHome} – ${cm.scoreAway}`, 'Man of the Match', () => {
      hidePhaseOverlay(); renderMatchView();
    });
  }
}

let toastTimeout = null;
let toastFadeTimeout = null;
function showToast(text, undoFn) {
  const el = document.getElementById('toast');
  el.classList.remove('show', 'hiding');
  el.innerHTML = `<span>${text}</span>` + (undoFn ? `<button id="toastUndo">Ongedaan maken</button>` : '');
  requestAnimationFrame(() => el.classList.add('show'));
  if (undoFn) document.getElementById('toastUndo').onclick = () => { undoFn(); hideToast(); };
  clearTimeout(toastTimeout);
  clearTimeout(toastFadeTimeout);
  toastTimeout = setTimeout(() => {
    el.classList.remove('show');
    el.classList.add('hiding');
    toastFadeTimeout = setTimeout(() => el.classList.remove('hiding'), 300);
  }, 3000);
}
function hideToast() {
  const el = document.getElementById('toast');
  el.classList.remove('show', 'hiding');
  clearTimeout(toastTimeout);
  clearTimeout(toastFadeTimeout);
}

function triggerPhotoUpload(id) { document.getElementById('photo_'+id).click(); }

function handlePhotoUpload(id, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const size = 200;
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const min = Math.min(img.width, img.height);
      const sx = (img.width - min) / 2, sy = (img.height - min) / 2;
      ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
      const p = getPlayer(id);
      if (p) { p.photo = canvas.toDataURL('image/jpeg', 0.7); saveData(); renderTeamPage(); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderMatchView() {
  const c = document.getElementById('matchContent');
  const cm = DB.currentMatch;
  if (!cm) renderMatchIdle(c);
  else if (cm.status === 'setup') renderMatchSetup(c);
  else if (cm.status === 'squad') renderMatchSquad(c);
  else if (cm.status === 'lineup') renderMatchLineup(c);
  else if (cm.status === 'half1' || cm.status === 'half2') renderMatchLive(c);
  else if (cm.status === 'fulltime') renderMatchMOTM(c);
  updateLiveDot();
}

function renderMatchIdle(c) {
  const finished = DB.matches.filter(m => m.status==='finished').sort((a,b) => new Date(b.date)-new Date(a.date));
  let h = `<div style="text-align:center;padding:24px 0 20px">
    <button class="btn btn-primary btn-lg" onclick="startNewMatch()" ${DB.players.length<5?'disabled':''}>
      &#9917; Nieuwe Wedstrijd</button>

  </div>`;

  if (finished.length > 0) {
    h += `<div class="section-header"><h2 class="section-title">Recente Wedstrijden</h2></div>`;
    finished.slice(0,5).forEach(m => {
      const res = getMatchResult(m);
      const scorers = m.events.filter(e => e.type==='goal' && e.team==='home').map(e => getPlayerName(e.scorerId));
      h += `<div class="card match-history-item" onclick="showMatchDetail('${m.id}')">
        <div class="mh-top"><span class="mh-date">${formatDate(m.date)}</span>
          <span class="mh-badge ${res}">${res==='win'?'W':res==='loss'?'V':'G'}</span></div>
        <div class="mh-teams">
          <span class="mh-team home">${DB.teamName}</span>
          <span class="mh-score">${m.scoreHome} – ${m.scoreAway}</span>
          <span class="mh-team away">${m.opponent}</span></div>
        ${scorers.length?`<div class="mh-scorers">⚽ ${scorers.join(', ')}</div>`:''}
      </div>`;
    });
  } else if (DB.players.length >= 5) {
    h += `<div class="empty-state" style="padding-top:10px">
      <div class="empty-icon">&#127942;</div><h3>Klaar om te beginnen</h3><p>Start je eerste wedstrijd!</p></div>`;
  }
  c.innerHTML = h;
}

    scoreAway: 0,

  const cm = DB.currentMatch;
  const sorted = [...DB.players].sort((a,b) => a.number - b.number);
  let h = `<div class="section-header">
      <h2 class="section-title">Selectie</h2>
      <button class="btn btn-secondary btn-sm" onclick="DB.currentMatch.status='setup';saveData();renderMatchView()">&#8592; Terug</button></div>

    <div class="squad-grid">`;
  sorted.forEach(p => {
    const sel = cm.squad.includes(p.id);
    h += `<div class="squad-player ${sel?'selected':''}" onclick="toggleSquad('${p.id}')">
      ${avatarHTML(p, 'avatar-sm')}

function toggleSquad(id) {
  const cm = DB.currentMatch;
  const i = cm.squad.indexOf(id);
  if (i >= 0) { cm.squad.splice(i,1); cm.lineup = cm.lineup.filter(l=>l!==id); }
  else cm.squad.push(id);
  saveData(); renderMatchView();
}

function proceedToLineup() {
  const cm = DB.currentMatch;
  const defaultCaptain = cm.squad.find(id => { const p = getPlayer(id); return p && p.isCaptain; });
  if (defaultCaptain && !cm.captain) cm.captain = defaultCaptain;
  cm.status = 'lineup';
  saveData(); renderMatchView();
}

function renderMatchLineup(c) {
  const cm = DB.currentMatch;
  const squad = cm.squad.map(id => getPlayer(id)).filter(Boolean).sort((a,b) => a.number - b.number);
  const keepers = squad.filter(p => p.isKeeper);
  const fieldPlayers = squad.filter(p => !cm.lineup.includes(p.id) || p.id === cm.keeper);

  let h = `<div class="section-header">
      <h2 class="section-title">Opstelling</h2>
      <button class="btn btn-secondary btn-sm" onclick="DB.currentMatch.status='squad';saveData();renderMatchView()">&#8592; Terug</button></div>`;

  // Keeper selection
  h += `<div class="lineup-role-section">
    <div class="lineup-role-label">&#129351; Keeper</div>`;
  keepers.forEach(p => {
    h += `<div class="lineup-player ${cm.keeper===p.id?'selected':''}" onclick="selectKeeper('${p.id}')">
      ${avatarHTML(p, 'avatar-sm')} <span class="lp-name">${p.name}</span>
      ${cm.keeper===p.id?'<span class="lp-role">Keeper</span>':''}
    </div>`;
  });
  if (keepers.length === 0) h += `<p style="font-size:0.82rem;color:var(--text-muted)">Geen keepers in selectie</p>`;
  h += `</div>`;

  // Captain selection
  h += `<div class="lineup-role-section">
    <div class="lineup-role-label">© Aanvoerder</div>`;
  squad.forEach(p => {
    h += `<div class="lineup-player ${cm.captain===p.id?'selected':''}" onclick="selectCaptain('${p.id}')">
      ${avatarHTML(p, 'avatar-sm')} <span class="lp-name">${p.name}</span>
      ${cm.captain===p.id?'<span class="lp-role">Aanvoerder</span>':''}
    </div>`;
  });
  h += `</div>`;

  // Field starters (4 veldspelers, excl. keeper)
  const available = squad.filter(p => p.id !== cm.keeper);
  const fieldLineup = cm.lineup.filter(id => id !== cm.keeper);
  h += `<div class="lineup-role-section">
    <div class="lineup-role-label">Veldspelers (${fieldLineup.length}/4)</div>`;
  available.forEach(p => {
    const isSel = fieldLineup.includes(p.id);
    h += `<div class="lineup-player ${isSel?'selected':''}" onclick="toggleFieldPlayer('${p.id}')">
      ${avatarHTML(p, 'avatar-sm')} <span class="lp-name">${p.name}</span>
      ${isSel?'<span class="lp-role">Basis</span>':''}
    </div>`;
  });
  h += `</div>`;

  const ready = cm.keeper && cm.captain && fieldLineup.length === 4;
  h += `<button class="btn btn-primary btn-block btn-lg" onclick="startMatch()" ${ready?'':'disabled'}>
    &#9917; Start Wedstrijd</button>`;
  c.innerHTML = h;
}

function selectKeeper(id) {
  DB.currentMatch.keeper = id;
  DB.currentMatch.lineup = DB.currentMatch.lineup.filter(l => l !== id);
  if (!DB.currentMatch.lineup.includes(id)) {
    // keeper is separate from field lineup
  }
  saveData(); renderMatchView();
}
function selectCaptain(id) { DB.currentMatch.captain = id; saveData(); renderMatchView(); }
function toggleFieldPlayer(id) {
  const cm = DB.currentMatch;
  const fl = cm.lineup.filter(l => l !== cm.keeper);
  const i = fl.indexOf(id);
  if (i >= 0) { cm.lineup = cm.lineup.filter(l => l !== id); }
  else if (fl.length < 4) { cm.lineup.push(id); }
  saveData(); renderMatchView();
}

function startMatch() {
  const cm = DB.currentMatch;
  if (!cm.lineup.includes(cm.keeper)) cm.lineup.unshift(cm.keeper);
  cm.status = 'half1';
  cm.half = 1;
  timerSeconds = 20 * 60;
  saveData(); renderMatchView();
}

// =========================================================
// MATCH LIVE
// =========================================================
function renderMatchLive(c) {
  const cm = DB.currentMatch;
  const halfLabel = cm.half === 1 ? '1e Helft' : '2e Helft';

  let h = `<div class="match-header">
    <div class="match-half-label">${halfLabel}${cm.sporthal ? ' — ' + cm.sporthal : ''}</div>
    <div class="match-timer" id="timerDisplay">${formatTimer(timerSeconds)}</div>
    <div class="timer-controls">
      ${timerRunning
        ? `<button class="timer-btn" onclick="stopTimer()" title="Pauze">&#10074;&#10074;</button>`
        : `<button class="timer-btn" onclick="startTimer()" title="Start">&#9654;</button>`}
      <button class="timer-btn" onclick="adjustTimer(-60)" style="font-size:0.72rem">-1</button>
      <button class="timer-btn" onclick="adjustTimer(60)" style="font-size:0.72rem">+1</button>
      <button class="timer-btn" onclick="endHalfEarly()" style="font-size:0.72rem">&#9724;</button>
    </div>
    <div style="margin-top:16px"><div class="match-score-row">
      <span class="match-team-name home">${DB.teamName}</span>
      <span class="match-score">${cm.scoreHome} – ${cm.scoreAway}</span>
      <span class="match-team-name away">${cm.opponent}</span>
    </div></div>
  </div>

  <div class="match-actions">
    <button class="action-btn goal-btn" onclick="openGoalModal()">&#9917; Goal</button>
    <button class="action-btn card-btn" onclick="openCardModal()">Kaart</button>
    <button class="action-btn fk-btn ${cm.flyingKeeper?'active-fk':''}" onclick="toggleFlyingKeeper()" title="Power Play">${ppIconHTML()} Power Play</button>
  </div>`;

  if (cm.events.length > 0) {
    h += `<div class="card"><div class="timeline">`;
    [...cm.events].sort((a,b) => a.minute - b.minute).forEach((ev, idx) => {
      const evIdx = cm.events.indexOf(ev);
      h += renderTimelineEvent(ev, cm, evIdx);
    });
    h += `</div></div>`;
  }

  h += `<div style="text-align:center;margin-top:20px">
    <button class="btn btn-secondary btn-sm" onclick="openMatchMenu()">&#8942; Opties</button></div>`;
  c.innerHTML = h;
}

function adjustTimer(s) { timerSeconds = Math.max(0, Math.min(20*60, timerSeconds+s)); renderMatchView(); }
function endHalfEarly() { stopTimer(); timerSeconds = 0; onTimerEnd(); }

function toggleFlyingKeeper() {
  const cm = DB.currentMatch;
  if (cm.flyingKeeper) {
    cm.flyingKeeper = false;
    cm.events.push({ type:'flyingkeeper', minute:getCurrentMinute(), half:cm.half, active:false });
    saveData(); renderMatchView();
    showToast('Power Play uit');
  } else {
    openFlyingKeeperModal();
  }
}

function openFlyingKeeperModal() {
  const cm = DB.currentMatch;
  const squad = cm.squad.map(id => getPlayer(id)).filter(Boolean).filter(p => p.id !== cm.keeper).sort((a,b) => a.number - b.number);
  let h = `<h3>${ppIconHTML()} Power Play</h3>
    <p style="font-size:0.82rem;color:var(--text-muted);text-align:center;margin-bottom:16px">Wie gaat als keeper meevoetballen?</p>`;
  squad.forEach(p => {
    h += `<div class="player-select-item" onclick="activateFlyingKeeper('${p.id}')">
      ${avatarHTML(p, 'avatar-sm')} <span style="font-weight:600">${p.name}</span></div>`;
  });
  h += `<button class="modal-cancel" onclick="closeModal()">Annuleren</button>`;
  openModal(h);
}

function activateFlyingKeeper(playerId) {
  const cm = DB.currentMatch;
  cm.flyingKeeper = true;
  cm.events.push({ type:'flyingkeeper', minute:getCurrentMinute(), half:cm.half, active:true, playerId });
  saveData(); closeModal(); renderMatchView();
  showToast(`Power Play: ${getPlayerName(playerId)}`);
}

function openMatchMenu() {
  openModal(`<h3>Wedstrijd Opties</h3>
    <button class="btn btn-danger-outline btn-block" style="margin-bottom:8px" onclick="closeModal();confirmCancelMatch()">Wedstrijd annuleren</button>
    <button class="modal-cancel" onclick="closeModal()">Sluiten</button>`);
}

function confirmCancelMatch() {
  openModal(`<h3>Wedstrijd Annuleren</h3>
    <p style="text-align:center;margin-bottom:20px">Weet je het zeker? Alle data van deze wedstrijd gaat verloren.</p>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline btn-block" onclick="closeModal()">Nee, ga door</button>
      <button class="btn btn-danger-outline btn-block" onclick="closeModal();cancelMatch()">Ja, annuleren</button>
    </div>`);
}
function cancelMatch() { DB.currentMatch = null; stopTimer(); saveData(); renderMatchView(); }

function renderTimelineEvent(ev, m, evIdx) {
  const clickable = evIdx !== undefined && DB.currentMatch;
  const clickAttr = clickable ? `onclick="openEventEditModal(${evIdx})" style="cursor:pointer"` : '';
  if (ev.type === 'goal') {
    const isOurs = ev.team === 'home';
    const isOwnGoal = ev.ownGoal;
    const scorer = isOurs ? getPlayer(ev.scorerId) : null;
    let detail = '';
    if (isOwnGoal) {
      detail = `<strong>Eigen goal</strong>`;
    } else if (isOurs && scorer) {
      detail = `<strong>${scorer.name}</strong>`;
      if (ev.assistId) detail += ` <span class="sub-text">(${getPlayerName(ev.assistId)})</span>`;
    } else {
      detail = `<strong>${m.opponent}</strong>`;
    }
    const cls = isOwnGoal ? 'own-goal' : (!isOurs ? 'opponent-goal' : '');
    return `<div class="timeline-event ${cls}" ${clickAttr}>
      <span class="timeline-minute">${ev.minute != null ? ev.minute + "'" : '–'}</span>
      <span class="timeline-icon">${isOwnGoal ? '⚽' : '⚽'}</span>
      <span class="timeline-detail">${detail}</span>
      <span class="timeline-score">${ev.scoreAfter||''}</span>
    </div>`;
  }
  if (ev.type === 'card') {
    const icons = { green: '🟢', yellow: '🟡', red: '🔴' };
    const labels = { green: 'Groen (2 min)', yellow: 'Geel (5 min)', red: 'Rood' };
    return `<div class="timeline-event" ${clickAttr}>
      <span class="timeline-minute">${ev.minute != null ? ev.minute + "'" : '–'}</span>
      <span class="timeline-icon">${icons[ev.cardType]||''}</span>
      <span class="timeline-detail"><strong>${getPlayerName(ev.playerId)}</strong> <span class="sub-text">${labels[ev.cardType]||''}</span></span>
      <span class="timeline-score"></span>
    </div>`;
  }
  if (ev.type === 'flyingkeeper') {
    return `<div class="timeline-event" ${clickAttr}>
      <span class="timeline-minute">${ev.minute != null ? ev.minute + "'" : '–'}</span>
      <span class="timeline-icon">${ppIconHTML('pp-sm')}</span>
      <span class="timeline-detail"><span class="sub-text">${ev.active ? 'Power Play: <strong>'+getPlayerName(ev.playerId)+'</strong>' : 'Power Play uit'}</span></span>
      <span class="timeline-score"></span>
    </div>`;
  }
  return '';
}

// =========================================================
// GOAL MODAL
// =========================================================
let goalState = { team:null, scorerId:null, assistId:null, ownGoal:false };

function openGoalModal() { goalState = { team:null, scorerId:null, assistId:null, ownGoal:false }; renderGoalModal(); }

function renderGoalModal() {
  const cm = DB.currentMatch;
  const squad = cm.squad.map(id => getPlayer(id)).filter(Boolean).sort((a,b) => a.number - b.number);
  let h = `<h3>&#9917; Goal Registreren</h3>
    <p style="font-size:0.82rem;color:var(--text-muted);text-align:center;margin-bottom:16px">Minuut ${getCurrentMinute()}'</p>

    <label>Wie scoort?</label>
    <div class="team-select">
      <div class="team-option ${goalState.team==='home'?'selected-home':''}" onclick="setGoalTeam('home')">
        <h4>${DB.teamName}</h4><span style="font-size:0.78rem;color:var(--text-muted)">Wij</span></div>
      <div class="team-option ${goalState.team==='away'?'selected-away':''}" onclick="setGoalTeam('away')">
        <h4>${cm.opponent}</h4><span style="font-size:0.78rem;color:var(--text-muted)">Zij</span></div>
    </div>`;

  if (goalState.team === 'home') {
    h += `<div style="margin-bottom:14px">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:10px 12px;border:2px solid ${goalState.ownGoal?'var(--card-red)':'var(--border)'};border-radius:var(--radius-sm);background:${goalState.ownGoal?'var(--card-red-bg)':'var(--surface)'}">
        <input type="checkbox" ${goalState.ownGoal?'checked':''} onchange="toggleOwnGoal()">
        <span style="font-weight:700;color:${goalState.ownGoal?'var(--card-red)':'var(--text)'}">Eigen goal</span>
      </label></div>`;

    if (goalState.ownGoal) {
      // No player selection needed for own goals
    } else {
      h += `<label>Doelpuntenmaker</label><div style="margin-bottom:16px">`;
      squad.forEach(p => {
        h += `<div class="player-select-item ${goalState.scorerId===p.id?'selected':''}" onclick="setGoalScorer('${p.id}')">
          ${avatarHTML(p, 'avatar-sm')} <span style="font-weight:600">${p.name}</span></div>`;
      });
      h += `</div>`;

      if (goalState.scorerId) {
        h += `<label>Assist (optioneel)</label><div style="margin-bottom:16px">
          <div class="player-select-item ${goalState.assistId===null?'selected':''}" onclick="setGoalAssist(null)">
            <div class="avatar avatar-sm" style="background:var(--text-muted)">–</div>
            <span style="font-weight:600">Geen assist</span></div>`;
        squad.filter(p => p.id !== goalState.scorerId).forEach(p => {
          h += `<div class="player-select-item ${goalState.assistId===p.id?'selected':''}" onclick="setGoalAssist('${p.id}')">
            ${avatarHTML(p, 'avatar-sm')} <span style="font-weight:600">${p.name}</span></div>`;
        });
        h += `</div>`;
      }
    }
  }

  const canSave = goalState.team === 'away' || (goalState.team === 'home' && (goalState.ownGoal || goalState.scorerId));
  h += `<button class="btn btn-primary btn-block btn-lg" onclick="saveGoal()" ${canSave?'':'disabled'}>Bevestig Goal</button>
    <button class="modal-cancel" onclick="closeModal()">Annuleren</button>`;
  openModal(h);
}

function setGoalTeam(t) { goalState.team = t; goalState.scorerId = null; goalState.assistId = null; goalState.ownGoal = false; renderGoalModal(); }
function setGoalScorer(id) { goalState.scorerId = id; goalState.assistId = null; renderGoalModal(); }
function setGoalAssist(id) { goalState.assistId = id; renderGoalModal(); }
function toggleOwnGoal() { goalState.ownGoal = !goalState.ownGoal; goalState.scorerId = null; goalState.assistId = null; renderGoalModal(); }

function saveGoal() {
  const cm = DB.currentMatch;
  const minute = getCurrentMinute();
  const isOwnGoal = goalState.team === 'home' && goalState.ownGoal;

  if (goalState.team === 'away') { cm.scoreAway++; }
  else { cm.scoreHome++; }

  const ev = {
    type:'goal', minute, half:cm.half,
    team: 'home',
    ownGoal: isOwnGoal,
    scorerId: (!isOwnGoal && goalState.team==='home') ? goalState.scorerId : null,
    assistId: (!isOwnGoal && goalState.team==='home') ? goalState.assistId : null,
    scoreAfter: `${cm.scoreHome}–${cm.scoreAway}`
  };
  if (goalState.team === 'away') ev.team = 'away';
  cm.events.push(ev);

  const savedTeam = goalState.team;
  saveData(); closeModal(); renderMatchView();

  if (!isOwnGoal && goalState.team === 'home') showGoalCelebration(ev, cm);

  const evIdx = cm.events.length - 1;
  showToast(`${isOwnGoal ? 'Eigen goal!' : 'Goal!'} ${cm.scoreHome}–${cm.scoreAway}`, () => {
    cm.events.splice(evIdx, 1);
    if (savedTeam === 'away') cm.scoreAway--;
    else cm.scoreHome--;
    saveData(); renderMatchView();
  });
}

// =========================================================
// GOAL CELEBRATION
// =========================================================
function showGoalCelebration(ev, cm) {
  if (ev.ownGoal || ev.team === 'away') return;
  const scorer = getPlayer(ev.scorerId);
  if (!scorer) return;
  const el = document.createElement('div');
  el.className = 'goal-celebration';
  const photoHTML = scorer.photo
    ? `<div class="celeb-photo"><img src="${scorer.photo}" alt="${scorer.name}"></div>`
    : `<div class="celeb-photo">${scorer.number}</div>`;
  el.innerHTML = `
    ${photoHTML}
    <div class="celeb-label">Goal!</div>
    <div class="celeb-name">${scorer.name}</div>
    <div class="celeb-number">#${scorer.number}</div>
    <div class="celeb-minute">${ev.minute}'</div>
    <div class="celeb-score">${cm.scoreHome} – ${cm.scoreAway}</div>`;
  document.body.appendChild(el);
  el.addEventListener('click', () => dismissCelebration(el));
  setTimeout(() => dismissCelebration(el), 2500);
}
function dismissCelebration(el) {
  if (el.classList.contains('fade-out')) return;
  el.classList.add('fade-out');
  setTimeout(() => el.remove(), 400);
}

// =========================================================
// EVENT EDIT/DELETE
// =========================================================
function openEventEditModal(evIdx) {
  const cm = DB.currentMatch;
  if (!cm || evIdx < 0 || evIdx >= cm.events.length) return;
  const ev = cm.events[evIdx];
  const squad = cm.squad.map(id => getPlayer(id)).filter(Boolean).sort((a,b) => a.number - b.number);

  let h = `<h3>Event Bewerken</h3>
    <p style="text-align:center;font-size:0.78rem;color:var(--text-muted);margin-bottom:16px">${ev.half === 1 ? '1e Helft' : '2e Helft'}</p>
    <div class="form-group"><label>Minuut</label>
      <input type="number" id="editMinute" value="${ev.minute}" min="1" max="40"></div>`;

  if (ev.type === 'goal' && ev.team === 'home' && !ev.ownGoal) {
    h += `<div class="form-group"><label>Doelpuntenmaker</label>
      <select id="editScorer">`;
    squad.forEach(p => {
      h += `<option value="${p.id}" ${ev.scorerId===p.id?'selected':''}>${p.name}</option>`;
    });
    h += `</select></div>
      <div class="form-group"><label>Assist</label>
      <select id="editAssist"><option value="">Geen</option>`;
    squad.forEach(p => {
      h += `<option value="${p.id}" ${ev.assistId===p.id?'selected':''}>${p.name}</option>`;
    });
    h += `</select></div>`;
  } else if (ev.type === 'card') {
    h += `<div class="form-group"><label>Speler</label>
      <select id="editCardPlayer">`;
    squad.forEach(p => {
      h += `<option value="${p.id}" ${ev.playerId===p.id?'selected':''}>${p.name}</option>`;
    });
    h += `</select></div>
      <div class="form-group"><label>Type</label>
      <select id="editCardType">
        <option value="green" ${ev.cardType==='green'?'selected':''}>Groen (2 min)</option>
        <option value="yellow" ${ev.cardType==='yellow'?'selected':''}>Geel (5 min)</option>
        <option value="red" ${ev.cardType==='red'?'selected':''}>Rood</option>
      </select></div>`;
  }

  h += `<button class="btn btn-primary btn-block" style="margin-bottom:8px" onclick="saveEventEdit(${evIdx})">Opslaan</button>
    <button class="btn btn-danger-outline btn-block" style="margin-bottom:8px" onclick="deleteEvent(${evIdx})">Verwijderen</button>
    <button class="modal-cancel" onclick="closeModal()">Annuleren</button>`;
  openModal(h);
}
function saveEventEdit(evIdx) {
  const cm = DB.currentMatch;
  if (!cm) return;
  const ev = cm.events[evIdx];
  ev.minute = parseInt(document.getElementById('editMinute').value) || ev.minute;

  if (ev.type === 'goal' && ev.team === 'home' && !ev.ownGoal) {
    ev.scorerId = document.getElementById('editScorer').value;
    const assist = document.getElementById('editAssist').value;
    ev.assistId = assist || null;
  } else if (ev.type === 'card') {
    ev.playerId = document.getElementById('editCardPlayer').value;
    ev.cardType = document.getElementById('editCardType').value;
  }
  saveData(); closeModal(); renderMatchView();
}
function deleteEvent(evIdx) {
  const cm = DB.currentMatch;
  if (!cm) return;
  const ev = cm.events[evIdx];
  if (ev && ev.type === 'goal') {
    if (ev.team === 'home') cm.scoreHome = Math.max(0, cm.scoreHome - 1);
    else cm.scoreAway = Math.max(0, cm.scoreAway - 1);
  }
  cm.events.splice(evIdx, 1);
  saveData(); closeModal(); renderMatchView();
}

function setCardType(t) { cardState.cardType = t; renderCardModal(); }

function saveCard() {

  const ev = { type:'card', minute:getCurrentMinute(), half:cm.half, playerId:cardState.playerId, cardType:cardState.cardType };

    cm.events.splice(evIdx, 1);
    saveData(); renderMatchView();

}

function renderMatchMOTM(c) {
  const cm = DB.currentMatch;
  const squad = cm.squad.map(id => getPlayer(id)).filter(Boolean).sort((a,b) => a.number - b.number);

  let h = `<div class="match-header">
    <div class="match-half-label">Einde Wedstrijd</div>
    <div style="margin-top:8px"><div class="match-score-row">
      <span class="match-team-name home">${DB.teamName}</span>
      <span class="match-score">${cm.scoreHome} – ${cm.scoreAway}</span>
      <span class="match-team-name away">${cm.opponent}</span>
    </div></div>
  </div>
  <div class="card motm-section">
    <h3>&#11088; Man of the Match</h3><p>Kies de beste speler van de wedstrijd</p>
    <div class="motm-grid">`;
  squad.forEach(p => {
    h += `<div class="motm-player ${cm.motm===p.id?'selected':''}" onclick="selectMOTM('${p.id}')">
      ${avatarHTML(p)} <div class="motm-name">${p.name}</div></div>`;
  });
  h += `</div><div style="display:flex;gap:8px">
    <button class="btn btn-outline btn-block" onclick="skipMOTM()">Overslaan</button>
    <button class="btn btn-primary btn-block" onclick="finishMatch()" ${!cm.motm?'disabled':''}>Opslaan</button>
  </div></div>`;

  if (cm.events.length > 0) {
    h += `<div class="card" style="margin-top:12px"><h3 style="font-size:0.88rem;margin-bottom:12px">Wedstrijdverloop</h3><div class="timeline">`;
    [...cm.events].sort((a,b) => a.minute - b.minute).forEach(ev => { h += renderTimelineEvent(ev, cm); });
    h += `</div></div>`;
  }
  c.innerHTML = h;
}

function selectMOTM(id) { DB.currentMatch.motm = id; saveData(); renderMatchView(); }
function skipMOTM() { DB.currentMatch.motm = null; finishMatch(); }
function finishMatch() {
  const cm = DB.currentMatch;
  cm.status = 'finished';
  DB.matches.push(JSON.parse(JSON.stringify(cm)));
  DB.currentMatch = null;
  stopTimer(); saveData(); renderMatchView();
}

function renderCurrentSeasonStats() {
  const finished = DB.matches.filter(m => m.status === 'finished');
  if (!finished.length) {
    return `<div class="empty-state"><div class="empty-icon">&#128202;</div>
      <h3>Nog geen statistieken</h3><p>Speel je eerste wedstrijd</p></div>`;
  }

  let totalFor=0, totalAgainst=0, wins=0, draws=0, losses=0, cleanSheets=0;
  finished.forEach(m => {
    totalFor += m.scoreHome; totalAgainst += m.scoreAway;
    if (m.scoreHome > m.scoreAway) wins++;
    else if (m.scoreHome < m.scoreAway) losses++;
    else draws++;
    if (m.scoreAway === 0) cleanSheets++;
  });

  const n = finished.length;
  let h = `<div class="stat-grid">
    <div class="stat-box"><div class="stat-value">${n}</div><div class="stat-label">Gespeeld</div></div>
    <div class="stat-box"><div class="stat-value">${wins}</div><div class="stat-label">Gewonnen</div></div>
    <div class="stat-box"><div class="stat-value">${draws}</div><div class="stat-label">Gelijk</div></div>
    <div class="stat-box"><div class="stat-value">${losses}</div><div class="stat-label">Verloren</div></div>
  </div>
  <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
    <div class="stat-box"><div class="stat-value">${totalFor}</div><div class="stat-label">Goals voor</div></div>
    <div class="stat-box"><div class="stat-value">${totalAgainst}</div><div class="stat-label">Goals tegen</div></div>
    <div class="stat-box"><div class="stat-value">${cleanSheets}</div><div class="stat-label">Clean sheets</div></div>
  </div>
  <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
    <div class="stat-box"><div class="stat-value">${(totalFor/n).toFixed(1)}</div><div class="stat-label">Gem. voor</div></div>
    <div class="stat-box"><div class="stat-value">${(totalAgainst/n).toFixed(1)}</div><div class="stat-label">Gem. tegen</div></div>
    <div class="stat-box"><div class="stat-value">${((totalFor-totalAgainst)/n).toFixed(1)}</div><div class="stat-label">Doelsaldo</div></div>
  </div>`;

  const phaseKeys = ['0-5','5-10','10-15','15-20','20-25','25-30','30-35','35-40'];
  const phases = {};
  phaseKeys.forEach(k => { phases[k] = { for:0, against:0 }; });
  finished.forEach(m => {
    m.events.filter(e => e.type==='goal' && e.minute != null).forEach(e => {
      const min = e.minute;
      let phase;
      if (min <= 5) phase = '0-5';
      else if (min <= 10) phase = '5-10';
      else if (min <= 15) phase = '10-15';
      else if (min <= 20) phase = '15-20';
      else if (min <= 25) phase = '20-25';
      else if (min <= 30) phase = '25-30';
      else if (min <= 35) phase = '30-35';
      else phase = '35-40';
      if (e.team === 'home' && !e.ownGoal) phases[phase].for++;
      else if (e.team === 'away') phases[phase].against++;
      else if (e.ownGoal) phases[phase].for++;
    });
  });

  h += `<div class="card" style="margin-top:4px"><h3 style="font-size:0.88rem;margin-bottom:12px">Goals per fase</h3>
    <div style="display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 12px;font-size:0.82rem">
      <span style="font-weight:700;color:var(--text-muted)">Fase</span>
      <span style="font-weight:700;color:var(--text-muted)">Voor</span>
      <span style="font-weight:700;color:var(--text-muted)">Tegen</span>`;
  Object.entries(phases).forEach(([phase, data]) => {
    h += `<span style="font-weight:600">${phase}'</span>
      <span style="font-weight:700;color:var(--navy)">${data.for}</span>
      <span style="font-weight:700">${data.against}</span>`;
  });
  h += `</div></div>`;

  h += `<div class="section-header" style="margin-top:8px"><h2 class="section-title">Spelers</h2></div>
    <div class="tab-row" id="statTabs">
      <button class="tab-btn active" data-sort="goals">&#9917; Goals</button>
      <button class="tab-btn" data-sort="assists">&#127919; Assists</button>
      <button class="tab-btn" data-sort="motm">&#11088; MOTM</button>
      <button class="tab-btn" data-sort="cards">Kaarten</button>
    </div>
    <div class="card" id="leaderboard"></div>`;
  return h;
}

function setupCurrentLeaderboard() {
  const finished = DB.matches.filter(m => m.status === 'finished');
  if (!finished.length) return;
  const ps = {};
  DB.players.forEach(p => { ps[p.id] = { goals:0, assists:0, greens:0, yellows:0, reds:0, motm:0, played:0, cleanSheets:0 }; });
  finished.forEach(m => {
    (m.squad||[]).forEach(pid => { if(ps[pid]) ps[pid].played++; });
    m.events.forEach(ev => {
      if (ev.type==='goal' && ev.team==='home') {
        if (ev.scorerId && ps[ev.scorerId]) ps[ev.scorerId].goals++;
        if (ev.assistId && ps[ev.assistId]) ps[ev.assistId].assists++;
      }
      if (ev.type==='card' && ev.playerId && ps[ev.playerId]) {
        if (ev.cardType==='green') ps[ev.playerId].greens++;
        else if (ev.cardType==='yellow') ps[ev.playerId].yellows++;
        else ps[ev.playerId].reds++;
      }
    });
    if (m.motm && ps[m.motm]) ps[m.motm].motm++;
    if (m.scoreAway === 0 && m.keeper && ps[m.keeper]) ps[m.keeper].cleanSheets++;
  });
  renderLeaderboard(ps, 'goals');
  document.querySelectorAll('#statTabs .tab-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#statTabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderLeaderboard(ps, btn.dataset.sort);
    };
  });
}

function renderLeaderboard(ps, sortBy) {
  const el = document.getElementById('leaderboard');
  if (!el) return;
  let sortFn;
  if (sortBy==='goals') sortFn = (a,b) => b[1].goals-a[1].goals || b[1].assists-a[1].assists;
  else if (sortBy==='assists') sortFn = (a,b) => b[1].assists-a[1].assists || b[1].goals-a[1].goals;
  else if (sortBy==='motm') sortFn = (a,b) => b[1].motm-a[1].motm || b[1].goals-a[1].goals;
  else sortFn = (a,b) => (b[1].greens+b[1].yellows+b[1].reds)-(a[1].greens+a[1].yellows+a[1].reds);

  const sorted = Object.entries(ps).filter(([id]) => getPlayer(id)).sort(sortFn);
  let h = `<div class="leaderboard-item" style="border-bottom:2px solid var(--border);padding-bottom:8px">
    <span class="lb-rank" style="font-size:0.7rem;color:var(--text-muted)">#</span>
    <div class="avatar avatar-sm" style="visibility:hidden"></div>
    <span class="player-name" style="font-size:0.78rem;font-weight:700;color:var(--text-muted);flex:1">Naam</span>
    <div class="lb-stats" style="color:var(--text-muted);font-size:0.72rem">
      <span>&#9917;</span><span>&#127919;</span><span>&#11088;</span>
    </div>
  </div>`;
  sorted.forEach(([id, s], i) => {
    const p = getPlayer(id);
    if (!p) return;
    let stats = `<span>&#9917; ${s.goals}</span><span>&#127919; ${s.assists}</span>`;
    if (s.motm) stats += `<span>&#11088; ${s.motm}</span>`;
    if (s.cleanSheets) stats += `<span>&#129351; ${s.cleanSheets}</span>`;
    if (s.greens) stats += `<span>&#x1F7E2; ${s.greens}</span>`;
    if (s.yellows) stats += `<span>&#x1F7E1; ${s.yellows}</span>`;
    if (s.reds) stats += `<span>&#x1F534; ${s.reds}</span>`;
    h += `<div class="leaderboard-item">
      <span class="lb-rank ${i===0?'top':''}">${i+1}</span>
      ${avatarHTML(p, 'avatar-sm')}
      <span class="player-name" style="font-size:0.88rem;flex:1">${p.name}</span>
      <div class="lb-stats">${stats}</div>
    </div>`;
  });
  el.innerHTML = h;
}

        <td>${r.dv}</td><td>${r.dt}</td><td class="${dsClass}">${r.ds > 0 ? '+' : ''}${r.ds}</td><td class="pts">${r.p}</td>
      </tr>`;
    });
    h += `</table></div></div>`;
  }

  h += `<div class="section-header" style="margin-top:8px"><h2 class="section-title">Spelers</h2></div>
    <div class="tab-row" id="historyTabs">
      <button class="tab-btn active" data-sort="goals">&#9917; Goals</button>
      <button class="tab-btn" data-sort="assists">&#127919; Assists</button>
      <button class="tab-btn" data-sort="ratio">&#9889; Ratio</button>

function renderHistoricalPlayerList(players, sortBy) {
  const el = document.getElementById('historyLeaderboard');
  if (!el) return;
  const sorted = [...players].sort((a, b) => {
    if (sortBy === 'goals') return b.goals - a.goals || b.assists - a.assists;
    if (sortBy === 'assists') return b.assists - a.assists || b.goals - a.goals;
    const ra = a.played ? (a.goals + a.assists) / a.played : 0;
    const rb = b.played ? (b.goals + b.assists) / b.played : 0;
    return rb - ra;
  });

  let h = `<div class="leaderboard-item" style="border-bottom:2px solid var(--border);padding-bottom:8px">
    <span class="lb-rank" style="font-size:0.7rem;color:var(--text-muted)">#</span>
    <span class="player-name" style="font-size:0.78rem;font-weight:700;color:var(--text-muted);flex:1">Naam</span>
    <div class="lb-stats" style="color:var(--text-muted);font-size:0.68rem">
      <span>&#9917;</span><span>&#127919;</span><span>GP</span><span>R</span>
    </div>
  </div>`;
  sorted.forEach((p, i) => {
    const ratio = p.played ? ((p.goals + p.assists) / p.played).toFixed(1) : '–';
    const dbPlayer = DB.players.find(dp => dp.name === p.name);
    const avatar = dbPlayer ? avatarHTML(dbPlayer, 'avatar-sm') : `<div class="avatar avatar-sm">?</div>`;
    h += `<div class="leaderboard-item">
      <span class="lb-rank ${i===0?'top':''}">${i+1}</span>
      ${avatar}
      <span class="player-name" style="font-size:0.88rem;flex:1">${p.name}</span>
      <div class="lb-stats">
        <span>&#9917; ${p.goals}</span><span>&#127919; ${p.assists}</span>
        <span style="color:var(--text-muted)">${p.played}</span>
        <span style="color:var(--navy);font-weight:800">${ratio}</span>
      </div>
    </div>`;
  });
  el.innerHTML = h;
}

        <div class="sched-date"><div class="sched-day">${d.getDate()}</div>${d.toLocaleDateString('nl-NL',{month:'short'})}</div>

          <div class="sched-opponent">${m.opp} ${matchTypeHTML(m.comp)}</div>
          <div class="sched-meta">${m.hal} · ${m.time} · ${m.home ? 'thuis' : 'uit'}</div>
        </div>
        <div class="sched-result upcoming">–</div>
      </div>`;
    });
    if (srzaData.programma.length > 5) {
      h += `<button class="srza-show-all" onclick="srzaShowAllResults=false;renderSchedulePage()">Alle ${srzaData.programma.length} wedstrijden ›</button>`;
    }
    h += `</div>`;
  }

  h += `<div class="section-header" style="margin-top:16px"><h2 class="section-title">Uitslagen</h2>
    <button class="btn btn-outline btn-sm" onclick="openRetroModal()">Achteraf invoeren</button></div>`;

  if (finished.length) {
    h += `<div class="card">`;
    finished.forEach(m => {
      const d = new Date(m.date);
      const res = getMatchResult(m);
      h += `<div class="schedule-match" onclick="showMatchDetail('${m.id}')" style="cursor:pointer">
        <div class="sched-date"><div class="sched-day">${d.getDate()}</div>${d.toLocaleDateString('nl-NL',{month:'short'})}</div>
        <div class="sched-info">
          <div class="sched-opponent">${m.opponent||'TBD'} ${matchTypeHTML(m.comp)}</div>
          <div class="sched-meta">${m.sporthal||''}</div>
        </div>
        <div class="sched-result ${res}">${m.scoreHome} – ${m.scoreAway}</div>
      </div>`;
    });
    h += `</div>`;
  }

  if (srzaData && srzaData.uitslagen && srzaData.uitslagen.length) {
    const allResults = [...srzaData.uitslagen].reverse();
    const showResults = srzaShowAllResults ? allResults : allResults.slice(0, 5);
    if (!finished.length) {
      h += `<div class="card">`;
    } else {
      h += `<div class="section-header" style="margin-top:16px"><h2 class="section-title">Seizoen uitslagen</h2>
        <span style="font-size:0.65rem;color:var(--text-muted)">srza.nl</span></div>`;
      h += `<div class="card">`;
    }
    showResults.forEach(m => {
      const d = new Date(m.date);
      const res = srzaResultClass(m);
      h += `<div class="schedule-match">
        <div class="sched-date"><div class="sched-day">${d.getDate()}</div>${d.toLocaleDateString('nl-NL',{month:'short'})}</div>
        <div class="sched-info">
          <div class="sched-opponent">${m.opp} ${matchTypeHTML(m.comp)}</div>
          <div class="sched-meta">${m.hal} · ${m.home ? 'thuis' : 'uit'}</div>
        </div>
        <div class="sched-result ${res}">${m.jb} – ${m.opp_s}</div>
      </div>`;
    });
    if (!srzaShowAllResults && allResults.length > 5) {
      h += `<button class="srza-show-all" onclick="srzaShowAllResults=true;renderSchedulePage()">Alle ${allResults.length} uitslagen ›</button>`;
    } else if (srzaShowAllResults) {
      h += `<button class="srza-show-all" onclick="srzaShowAllResults=false;renderSchedulePage()">Minder tonen</button>`;
    }
    h += `</div>`;
  } else if (!finished.length) {
    h += `<div class="empty-state" style="padding:20px 0"><p style="color:var(--text-muted)">Nog geen uitslagen</p></div>`;
  }

  if (srzaData) {
    const updated = new Date(srzaData.lastUpdated);
    h += `<p style="text-align:center;font-size:0.65rem;color:var(--text-muted);margin-top:12px">
      SRZA · ${updated.toLocaleDateString('nl-NL')}</p>`;
  }

  c.innerHTML = h;
}

function openAddMatchModal() {
  openModal(`<h3>Wedstrijd Toevoegen</h3>
    <div class="form-group"><label>Tegenstander</label><input type="text" id="schedOpp" placeholder="Teamnaam"></div>
    <div class="form-group"><label>Datum</label><input type="date" id="schedDate" value="${new Date().toISOString().split('T')[0]}"></div>
    <div class="form-group"><label>Type</label>
      <select id="schedType">
        <option value="comp">Competitie</option>
        <option value="beker">Beker</option>
        <option value="friendly">Vriendschappelijk</option>
      </select></div>
    <div class="form-group"><label>Sporthal</label>
      <select id="schedHall">
        <option value="">— Kies sporthal —</option>
        <option>Stedenwijk</option><option>Waterwijk</option><option>Haven</option><option>Buiten</option>
      </select></div>
    <button class="btn btn-primary btn-block" onclick="addScheduleMatch()">Toevoegen</button>
    <button class="modal-cancel" onclick="closeModal()">Annuleren</button>`);
}

function addScheduleMatch() {
  const opp = document.getElementById('schedOpp').value.trim();
  if (!opp) return;
  DB.matches.push({
    id:'m'+DB.nextMatchId++, date:document.getElementById('schedDate').value,
    opponent:opp, sporthal:document.getElementById('schedHall').value.trim(),
    comp:document.getElementById('schedType').value,
    squad:[], lineup:[], keeper:null, captain:null, flyingKeeper:false,
    events:[], scoreHome:0, scoreAway:0, half:1, motm:null, status:'scheduled'
  });
  saveData(); closeModal(); renderSchedulePage();
}

// =========================================================
// SCHEDULED MATCH OPTIONS + RETROACTIVE ENTRY
// =========================================================
function openScheduleMatchOptions(matchId) {
  const m = DB.matches.find(x => x.id === matchId);
  if (!m) return;
  openModal(`<h3>${m.opponent || 'TBD'}</h3>
    <p style="text-align:center;color:var(--text-muted);margin-bottom:16px">${formatDate(m.date)}${m.sporthal?' — '+m.sporthal:''}</p>
    <button class="btn btn-primary btn-block" style="margin-bottom:8px" onclick="closeModal();startLiveMatch('${matchId}')">&#9654; Live bijhouden</button>
    <button class="btn btn-outline btn-block" style="margin-bottom:8px" onclick="closeModal();openRetroModal('${matchId}')">&#9998; Resultaat invoeren</button>
    <button class="btn btn-danger-outline btn-block" style="margin-bottom:8px" onclick="closeModal();deleteScheduleMatch('${matchId}')">Verwijderen</button>
    <button class="modal-cancel" onclick="closeModal()">Sluiten</button>`);
}

function startLiveMatch(matchId) {
  const idx = DB.matches.findIndex(x => x.id === matchId);
  if (idx === -1) return;
  const m = DB.matches[idx];
  DB.currentMatch = {
    id: m.id, date: m.date, opponent: m.opponent, sporthal: m.sporthal,
    comp: m.comp || 'comp',
    squad: [], lineup: [], keeper: null, captain: null, flyingKeeper: false,
    events: [], scoreHome: 0, scoreAway: 0, half: 1, motm: null, status: 'setup'
  };
  DB.matches.splice(idx, 1);
  saveData();
  document.querySelectorAll('.bottomnav button').forEach(b => b.classList.remove('active'));
  document.querySelector('.bottomnav button[data-page="pageMatch"]').classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'pageMatch'));
  renderPage('pageMatch');
}

function deleteScheduleMatch(matchId) {
  openModal(`<h3>Wedstrijd Verwijderen</h3>
    <p style="text-align:center;margin-bottom:20px">Weet je het zeker?</p>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline btn-block" onclick="closeModal()">Nee</button>
      <button class="btn btn-danger-outline btn-block" onclick="DB.matches=DB.matches.filter(x=>x.id!=='${matchId}');saveData();closeModal();renderSchedulePage()">Ja, verwijderen</button>
    </div>`);
}

let retroState = null;

function openRetroModal(matchId) {
  const m = matchId ? DB.matches.find(x => x.id === matchId) : null;
  retroState = {
    matchId: matchId || null,
    opponent: m ? m.opponent : '',
    date: m ? m.date : new Date().toISOString().split('T')[0],
    sporthal: m ? (m.sporthal || '') : '',
    comp: m ? (m.comp || 'comp') : 'comp',
    scoreHome: 0,
    scoreAway: 0,
    goals: [],
    motm: null
  };
  renderRetroModal();
}

function renderRetroModal() {
  const rs = retroState;
  const players = [...DB.players].sort((a,b) => a.number - b.number);
  let h = `<h3>Resultaat Invoeren</h3>`;

  if (!rs.matchId) {
    h += `<div class="form-group"><label>Tegenstander</label>
      <input type="text" id="retroOpp" value="${rs.opponent}" onchange="retroState.opponent=this.value"></div>
    <div class="form-group"><label>Datum</label>
      <input type="date" id="retroDate" value="${rs.date}" onchange="retroState.date=this.value"></div>
    <div class="form-group"><label>Type</label>
      <select id="retroType" onchange="retroState.comp=this.value">
        <option value="comp" ${rs.comp==='comp'?'selected':''}>Competitie</option>
        <option value="beker" ${rs.comp==='beker'?'selected':''}>Beker</option>
        <option value="friendly" ${rs.comp==='friendly'?'selected':''}>Vriendschappelijk</option>
      </select></div>
    <div class="form-group"><label>Sporthal</label>
      <select id="retroHall" onchange="retroState.sporthal=this.value">
        <option value="">— Kies sporthal —</option>
        <option ${rs.sporthal==='Stedenwijk'?'selected':''}>Stedenwijk</option>
        <option ${rs.sporthal==='Waterwijk'?'selected':''}>Waterwijk</option>
        <option ${rs.sporthal==='Haven'?'selected':''}>Haven</option>
        <option ${rs.sporthal==='Buiten'?'selected':''}>Buiten</option>
      </select></div>`;
  } else {
    h += `<p style="text-align:center;color:var(--text-muted);margin-bottom:12px">${rs.opponent} — ${formatDate(rs.date)}${rs.sporthal?' — '+rs.sporthal:''}</p>`;
  }

  h += `<div style="display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0 20px">
    <div style="text-align:center">
      <div style="font-weight:700;font-size:0.75rem;margin-bottom:4px">${DB.teamName}</div>
      <input type="number" id="retroHome" value="${rs.scoreHome}" min="0" max="99"
        onchange="retroState.scoreHome=parseInt(this.value)||0"
        style="width:56px;text-align:center;font-size:1.4rem;font-weight:800;padding:8px 4px">
    </div>
    <span style="font-size:1.2rem;font-weight:700;color:var(--text-muted)">–</span>
    <div style="text-align:center">
      <div style="font-weight:700;font-size:0.75rem;margin-bottom:4px">${rs.opponent||'Tegenst.'}</div>
      <input type="number" id="retroAway" value="${rs.scoreAway}" min="0" max="99"
        onchange="retroState.scoreAway=parseInt(this.value)||0"
        style="width:56px;text-align:center;font-size:1.4rem;font-weight:800;padding:8px 4px">
    </div>
  </div>`;

  h += `<div style="border-top:1px solid var(--border);padding-top:12px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-weight:700;font-size:0.88rem">Doelpunten</span>
      <button class="btn btn-outline btn-sm" onclick="addRetroGoal()" style="font-size:0.75rem">+ Goal</button>
    </div>`;

  if (rs.goals.length === 0) {
    h += `<p style="text-align:center;color:var(--text-muted);font-size:0.82rem;margin:8px 0">Geen goals toegevoegd (optioneel)</p>`;
  } else {
    rs.goals.forEach((g, i) => {
      const typeLabel = g.ownGoal ? 'Eigen goal' : (g.team === 'away' ? rs.opponent : DB.teamName);
      const scorerName = g.scorerId ? getPlayerName(g.scorerId) : '';
      const assistName = g.assistId ? getPlayerName(g.assistId) : '';
      let detail = '';
      if (g.team === 'home' && !g.ownGoal && scorerName) {
        detail = scorerName + (assistName ? ` (${assistName})` : '');
      } else if (g.ownGoal) {
        detail = 'Eigen goal';
      } else {
        detail = rs.opponent;
      }
      h += `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bg);font-size:0.85rem">
        <span style="flex:1"><strong>${detail}</strong></span>
        <button onclick="editRetroGoal(${i})" style="background:none;border:none;cursor:pointer;font-size:0.85rem;opacity:0.5">&#9998;</button>
        <button onclick="removeRetroGoal(${i})" style="background:none;border:none;cursor:pointer;font-size:0.85rem;opacity:0.5">&#128465;</button>
      </div>`;
    });
  }
  h += `</div>`;

  h += `<div class="form-group" style="margin-top:8px"><label>Man of the Match</label>
    <select id="retroMotm" onchange="retroState.motm=this.value||null">
      <option value="">— Geen —</option>`;
  players.forEach(p => {
    h += `<option value="${p.id}" ${rs.motm===p.id?'selected':''}>#${p.number} ${p.name}</option>`;
  });
  h += `</select></div>`;

  const canSave = !rs.matchId ? rs.opponent.trim() : true;
  h += `<button class="btn btn-primary btn-block" onclick="saveRetroMatch()" ${canSave?'':'disabled'}>Opslaan</button>
    <button class="modal-cancel" onclick="retroState=null;closeModal()">Annuleren</button>`;

  document.getElementById('modalContent').innerHTML = `<div class="modal-bar"></div>` + h;
  document.getElementById('modalOverlay').classList.add('open');
}

function addRetroGoal() {
  const rs = retroState;
  const players = [...DB.players].sort((a,b) => a.number - b.number);
  let h = `<h3>Goal Toevoegen</h3>
    <div class="form-group"><label>Type</label>
      <select id="rgType" onchange="document.getElementById('rgPlayerFields').style.display=this.value==='home'?'block':'none'">
        <option value="home">Goal ${DB.teamName}</option>
        <option value="away">Goal ${rs.opponent||'tegenstander'}</option>
        <option value="own">Eigen goal</option>
      </select></div>
    <div id="rgPlayerFields">
      <div class="form-group"><label>Doelpuntenmaker</label>
        <select id="rgScorer"><option value="">— Kies speler —</option>`;
  players.forEach(p => { h += `<option value="${p.id}">#${p.number} ${p.name}</option>`; });
  h += `</select></div>
    <div class="form-group"><label>Assist</label>
      <select id="rgAssist"><option value="">— Geen —</option>`;
  players.forEach(p => { h += `<option value="${p.id}">#${p.number} ${p.name}</option>`; });
  h += `</select></div></div>
    <button class="btn btn-primary btn-block" onclick="confirmRetroGoal()">Toevoegen</button>
    <button class="modal-cancel" onclick="renderRetroModal()">Terug</button>`;

  document.getElementById('modalContent').innerHTML = `<div class="modal-bar"></div>` + h;
}

function confirmRetroGoal(editIdx) {
  const type = document.getElementById('rgType').value;
  const goal = {
    team: type === 'away' ? 'away' : 'home',
    ownGoal: type === 'own',
    scorerId: type === 'home' ? (document.getElementById('rgScorer').value || null) : null,
    assistId: type === 'home' ? (document.getElementById('rgAssist').value || null) : null
  };
  if (editIdx !== undefined) {
    retroState.goals[editIdx] = goal;
  } else {
    retroState.goals.push(goal);
  }
  renderRetroModal();
}

function editRetroGoal(idx) {
  const g = retroState.goals[idx];
  const rs = retroState;
  const players = [...DB.players].sort((a,b) => a.number - b.number);
  const type = g.ownGoal ? 'own' : g.team;
  let h = `<h3>Goal Bewerken</h3>
    <div class="form-group"><label>Type</label>
      <select id="rgType" onchange="document.getElementById('rgPlayerFields').style.display=this.value==='home'?'block':'none'">
        <option value="home" ${type==='home'?'selected':''}>Goal ${DB.teamName}</option>
        <option value="away" ${type==='away'?'selected':''}>Goal ${rs.opponent||'tegenstander'}</option>
        <option value="own" ${type==='own'?'selected':''}>Eigen goal</option>
      </select></div>
    <div id="rgPlayerFields" style="display:${type==='home'?'block':'none'}">
      <div class="form-group"><label>Doelpuntenmaker</label>
        <select id="rgScorer"><option value="">— Kies speler —</option>`;
  players.forEach(p => { h += `<option value="${p.id}" ${g.scorerId===p.id?'selected':''}>#${p.number} ${p.name}</option>`; });
  h += `</select></div>
    <div class="form-group"><label>Assist</label>
      <select id="rgAssist"><option value="">— Geen —</option>`;
  players.forEach(p => { h += `<option value="${p.id}" ${g.assistId===p.id?'selected':''}>#${p.number} ${p.name}</option>`; });
  h += `</select></div></div>
    <button class="btn btn-primary btn-block" onclick="confirmRetroGoal(${idx})">Opslaan</button>
    <button class="modal-cancel" onclick="renderRetroModal()">Terug</button>`;

  document.getElementById('modalContent').innerHTML = `<div class="modal-bar"></div>` + h;
}

function removeRetroGoal(idx) {
  retroState.goals.splice(idx, 1);
  renderRetroModal();
}

function saveRetroMatch() {
  const rs = retroState;
  const scoreHome = parseInt(document.getElementById('retroHome').value) || 0;
  const scoreAway = parseInt(document.getElementById('retroAway').value) || 0;
  const motm = document.getElementById('retroMotm').value || null;

  const events = [];
  let runHome = 0, runAway = 0;
  rs.goals.forEach(g => {
    if (g.team === 'away') runAway++;
    else runHome++;
    events.push({
      type: 'goal', minute: null, half: null,
      team: g.team, ownGoal: g.ownGoal || false,
      scorerId: g.scorerId || null, assistId: g.assistId || null,
      scoreAfter: `${runHome}–${runAway}`
    });
  });

  if (rs.matchId) {
    const idx = DB.matches.findIndex(x => x.id === rs.matchId);
    if (idx !== -1) {
      const m = DB.matches[idx];
      m.scoreHome = scoreHome;
      m.scoreAway = scoreAway;
      m.events = events;
      m.motm = motm;
      m.status = 'finished';
      if (rs.comp) m.comp = rs.comp;
    }
  } else {
    DB.matches.push({
      id: 'm' + DB.nextMatchId++,
      date: rs.date, opponent: rs.opponent.trim(), sporthal: rs.sporthal,
      comp: rs.comp || 'comp',
      squad: [], lineup: [], keeper: null, captain: null, flyingKeeper: false,
      events, scoreHome, scoreAway, half: 2, motm, status: 'finished'
    });
  }

  retroState = null;
  saveData(); closeModal(); renderSchedulePage();
}

// =========================================================
// HELPERS
// =========================================================
function getMatchResult(m) {
  if (m.scoreHome > m.scoreAway) return 'win';
  if (m.scoreHome < m.scoreAway) return 'loss';
  return 'draw';
}
function formatDate(d) {
  try { return new Date(d).toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'}); }
  catch(e) { return d; }
}

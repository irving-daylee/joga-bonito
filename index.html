<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Joga Bonito</title>
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Montserrat:wght@400;600;700;800;900&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
<style>
/*
 * JOGA BONITO — BRAND GUIDE
 *
 * Typography
 *   Logo:     Pirata One — title case ("Joga Bonito"), nooit all-caps
 *   Headings: Montserrat 600–800
 *   Body:     Nunito 400–700
 *
 * Palette (zwart/goud dark-mode)
 *   --navy         #C4922E   goud — primair accent (knoppen, accenten, tekst-highlights)
 *   --navy-dark    #A07824   donker goud — hover / pressed state
 *   --navy-light   #D4A843   licht goud — secondary accent
 *   --surface      #1A1A1A   cards, modals (donker)
 *   --bg           #111111   pagina-achtergrond (donker)
 *   --border       #2A2A2A   scheidslijnen (donker)
 *   --text         #E8E4DE   primaire tekst op donker
 *   --text-muted   #888888   secundaire tekst
 *   --on-primary   #FFFFFF   tekst/iconen op donkere achtergronden
 *
 * Functionele kleuren (alleen sport-specifiek)
 *   --card-green   #10B981   groene kaart (2 min straftijd)
 *   --card-yellow  #F59E0B   gele kaart (5 min straftijd)
 *   --card-red     #EF4444   rode kaart (uitsluiting)
 *
 * Resultaat-indicatoren (subtiel, op dark surface)
 *   Win:  goud 12% opacity
 *   Loss: red  12% opacity
 *   Draw: muted 12% opacity
 *
 * Alle interactieve elementen gebruiken goud als accent.
 * Topbar is zwart (#0A0A0A) met goud logo.
 * Knoppen: goud achtergrond, zwart tekst.
 * Kaart-kleuren zijn de officiële sportkleuren, geen UI-semantiek.
 */

:root {
  --navy: #C4922E;
  --navy-dark: #A07824;
  --navy-light: #D4A843;
  --navy-10: rgba(196,146,46,0.10);
  --navy-20: rgba(196,146,46,0.15);
  --surface: #1A1A1A;
  --bg: #111111;
  --border: #2A2A2A;
  --text: #E8E4DE;
  --text-muted: #888888;
  --on-primary: #FFFFFF;
  --card-green: #10B981;
  --card-green-bg: rgba(16,185,129,0.15);
  --card-yellow: #F59E0B;
  --card-yellow-bg: rgba(245,158,11,0.15);
  --card-red: #EF4444;
  --card-red-bg: rgba(239,68,68,0.15);
  --win-bg: rgba(196,146,46,0.12);
  --loss-bg: rgba(239,68,68,0.12);
  --draw-bg: rgba(136,136,136,0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
  --transition: 0.2s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
  padding-bottom: 72px;
}
h1, h2, h3, h4, h5 { font-family: 'Montserrat', sans-serif; }

/* ===== TOP BAR ===== */
.topbar {
  background: #0A0A0A;
  color: var(--navy);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-left {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}
.topbar-logo {
  font-family: 'Pirata One', cursive;
  font-size: 1.5rem;
  font-weight: 400;
  letter-spacing: 0.5px;
}
/* Zo zie je op je telefoon meteen of de nieuwste versie geladen is. */
.app-version {
  font-family: 'Nunito', sans-serif;
  font-size: 0.62rem;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.3px;
  white-space: nowrap;
  cursor: pointer;
}
.topbar .season-badge {
  font-family: 'Nunito', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  background: var(--navy-20);
  padding: 3px 10px;
  border-radius: 20px;
}
/* Laat zien of een wijziging Firebase al bereikt heeft. */
.sync-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  cursor: pointer;
  flex-shrink: 0;
  transition: background var(--transition);
}
.sync-dot.synced { background: var(--navy); }
.sync-dot.pending { background: var(--text-muted); }
.sync-dot.unsynced {
  background: var(--card-yellow);
  animation: syncPulse 1.6s ease-in-out infinite;
}
@keyframes syncPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* ===== BOTTOM NAV ===== */
.bottomnav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  display: flex;
  justify-content: space-around;
  padding: 6px 0 env(safe-area-inset-bottom, 8px);
  border-top: 1px solid var(--border);
  z-index: 100;
}
.bottomnav button {
  background: none;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 6px;
  cursor: pointer;
  color: var(--text-muted);
  font-family: 'Nunito', sans-serif;
  font-size: 0.65rem;
  font-weight: 600;
  transition: color var(--transition);
  position: relative;
}
.bottomnav button.active { color: var(--navy); }
.bottomnav button .nav-icon { font-size: 1.4rem; }
.bottomnav button.active::after {
  content: '';
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 3px;
  background: var(--navy);
  border-radius: 0 0 3px 3px;
}
.bottomnav .live-dot {
  position: absolute;
  top: 2px;
  right: 8px;
  width: 8px;
  height: 8px;
  background: var(--navy-light);
  border-radius: 50%;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.4); }
}

/* ===== PAGES ===== */
.page { display: none; padding: 16px 16px 80px; max-width: 600px; margin: 0 auto; }
.page.active { display: block; }

/* ===== CARD ===== */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'Montserrat', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--transition);
  letter-spacing: 0.3px;
}
.btn-primary { background: var(--navy); color: #0A0A0A; }
.btn-primary:hover { background: var(--navy-dark); color: #0A0A0A; }
.btn-secondary { background: var(--navy-10); color: var(--navy); }
.btn-secondary:hover { background: var(--navy-20); }
.btn-outline { background: transparent; color: var(--navy); border: 2px solid var(--navy); }
.btn-outline:hover { background: var(--navy); color: var(--on-primary); }
.btn-danger-outline { background: transparent; color: var(--card-red); border: 2px solid var(--card-red); }
.btn-sm { padding: 8px 16px; font-size: 0.8rem; }
.btn-lg { padding: 16px 32px; font-size: 1.05rem; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

/* ===== FORMS ===== */
input, select {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  color: var(--text);
  background: var(--surface);
  transition: border-color var(--transition);
}
input:focus, select:focus { outline: none; border-color: var(--navy); }
select option { background: var(--surface); color: var(--text); }
/* iOS Safari geeft een datumveld een eigen minimumbreedte en centreert de
   waarde, waardoor die buiten het veld valt en niet meeschaalt. */
input[type="date"] {
  -webkit-appearance: none;
  appearance: none;
  min-width: 0;
  min-height: 50px;
  text-align: left;
}
input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.65); cursor: pointer; }
label {
  display: block;
  font-weight: 600;
  margin-bottom: 6px;
  font-size: 0.8rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.form-group { margin-bottom: 16px; }

/* ===== MODAL ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 500px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 8px 20px 32px;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-bar {
  display: block;
  width: 40px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 8px auto 16px;
}
.modal h3 { font-size: 1.05rem; margin-bottom: 16px; text-align: center; }
.modal-cancel {
  display: block;
  width: 100%;
  text-align: center;
  padding: 14px;
  margin-top: 8px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: 'Nunito', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
}
.modal-cancel:hover { color: var(--text); }

/* ===== TOAST (undo) ===== */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1A1A1A;
  color: var(--text);
  padding: 12px 20px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  font-family: 'Nunito', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  z-index: 300;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-lg);
  transition: transform 0.3s ease, opacity 0.3s ease;
  /* left:50% zonder right laat de beschikbare breedte op de halve viewport
     uitkomen, waardoor de tekst tot één woord per regel kromp. */
  width: max-content;
  max-width: calc(100vw - 32px);
  opacity: 0;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.hiding { transform: translateX(-50%) translateY(0); opacity: 0; }
.toast button {
  background: var(--navy);
  color: #0A0A0A;
  border: none;
  padding: 4px 12px;
  border-radius: 4px;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.75rem;
  cursor: pointer;
  white-space: nowrap;
}

/* ===== AVATAR ===== */
.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 0.85rem;
  flex-shrink: 0;
  background: var(--navy);
  color: var(--on-primary);
  overflow: hidden;
  position: relative;
}
.avatar-sm { width: 32px; height: 32px; font-size: 0.75rem; }
.avatar-lg { width: 56px; height: 56px; font-size: 1.1rem; }
.avatar-xl { width: 72px; height: 72px; font-size: 1.4rem; }

/* ===== PLAYER LIST ===== */
.player-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--bg);
}
.player-item:last-child { border-bottom: none; }
.player-info { flex: 1; min-width: 0; }
.player-name { font-weight: 700; font-size: 0.95rem; }
.player-badges { display: flex; gap: 4px; margin-top: 2px; }
.player-badge {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--navy-10);
  color: var(--navy);
}
.player-actions { display: flex; gap: 6px; }
.player-actions button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1rem;
  padding: 4px;
  opacity: 0.4;
  transition: opacity var(--transition);
}
.player-actions button:hover { opacity: 1; }

/* ===== SQUAD SELECTION ===== */
/* Wie vlagt of een vlagger regelt — keuze op het selectiescherm. */
.vlagger-row {
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.vlagger-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vlagger-label {
  font-family: 'Montserrat', sans-serif;
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
}
.vlagger-naam { font-weight: 700; font-size: 0.92rem; color: var(--navy); }
.vlagger-naam.leeg { color: var(--text-muted); font-weight: 500; font-style: italic; }
.vlagger-acties { display: flex; gap: 6px; }
.vlag-icon { vertical-align: -2px; }

.squad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.squad-player {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
}
.squad-player.selected { border-color: var(--navy); background: var(--navy-10); }
.squad-player .sq-name {
  font-weight: 600;
  font-size: 0.82rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.squad-player .sq-badge {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--navy);
}

/* ===== LINEUP ROLES ===== */
.lineup-role-section { margin-bottom: 16px; }
.lineup-role-label {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.lineup-player {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  margin-bottom: 6px;
}
.lineup-player.selected { border-color: var(--navy); background: var(--navy-10); }
.lineup-player .lp-name { font-weight: 600; font-size: 0.85rem; flex: 1; }
.lineup-player .lp-role {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--navy-light);
}

/* ===== MATCH LIVE ===== */
.match-header {
  background: linear-gradient(135deg, #0A0A0A 0%, #1A1A1A 100%);
  color: var(--on-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  margin-bottom: 12px;
}
.match-timer {
  font-family: 'Montserrat', sans-serif;
  font-size: 3rem;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 4px;
}
.match-half-label {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
  opacity: 0.65;
  margin-bottom: 16px;
}
.match-score-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
/* Straftijd in het scorebord: kaartje met mini-countdown. */
.penalty-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,0.08);
}
.penalty-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 6px 4px 8px;
  border-radius: 20px;
  background: rgba(255,255,255,0.06);
  cursor: pointer;
}
.penalty-card {
  width: 11px;
  height: 15px;
  border-radius: 2px;
  flex-shrink: 0;
}
.penalty-chip.running .penalty-card { animation: penaltyBlink 1.8s ease-in-out infinite; }
.penalty-btn {
  position: relative;
  width: 30px;
  height: 30px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  color: var(--text);
  font-size: 0.66rem;
  line-height: 1;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* Het aanraakgebied loopt door buiten de zichtbare knop: 44px, zoals Apple
   aanhoudt. Je tikt hier tijdens een wedstrijd, vaak gehaast. */
.penalty-btn::after { content: ''; position: absolute; inset: -7px; }
.penalty-btn.release { opacity: 0.5; font-size: 0.6rem; }
.penalty-chip.green .penalty-card { background: var(--card-green); }
.penalty-chip.yellow .penalty-card { background: var(--card-yellow); }
.penalty-chip.red .penalty-card { background: var(--card-red); }
.penalty-chip.red .penalty-time { color: var(--card-red); font-size: 0.68rem; letter-spacing: 1px; }
.penalty-name {
  font-size: 0.72rem;
  font-weight: 600;
  white-space: nowrap;
}
.penalty-time {
  font-family: 'Montserrat', sans-serif;
  font-size: 0.82rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.penalty-chip.green .penalty-time { color: var(--card-green); }
.penalty-chip.yellow .penalty-time { color: var(--card-yellow); }
.penalty-note {
  width: 100%;
  text-align: center;
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0.45;
}
@keyframes penaltyBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.match-team-name {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.82rem;
  text-transform: uppercase;
  flex: 1;
  min-width: 0;
  /* Lange clubnamen breken op spaties in plaats van weggesneden te worden. */
  overflow-wrap: break-word;
}
.match-team-name.home { text-align: right; }
.match-team-name.away { text-align: left; }
.match-score {
  font-family: 'Montserrat', sans-serif;
  font-size: 2rem;
  font-weight: 900;
  background: rgba(255,255,255,0.1);
  padding: 4px 12px;
  border-radius: var(--radius-sm);
  min-width: 92px;
  flex-shrink: 0;
  text-align: center;
  letter-spacing: 3px;
  white-space: nowrap;
}
/* Lange clubnamen krijgen een kleiner formaat in plaats van middenin een woord
   te breken. De grens ligt bij het langste woord, niet bij de hele naam. */
.match-team-name.sm { font-size: 0.70rem; }
.match-team-name.xs { font-size: 0.62rem; }
.timer-controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
}
.timer-btn {
  background: rgba(255,255,255,0.12);
  border: none;
  color: var(--on-primary);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition);
}
.timer-btn:hover { background: rgba(255,255,255,0.22); }

/* ===== MATCH ACTIONS ===== */
.match-actions { display: flex; gap: 10px; margin-bottom: 12px; }
.action-btn {
  flex: 1;
  padding: 18px 12px;
  border: none;
  border-radius: var(--radius);
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 1.05rem;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.action-btn.goal-btn {
  background: var(--navy-light);
  color: #0A0A0A;
  flex: 2;
}
.action-btn.goal-btn:hover { background: var(--navy); color: #0A0A0A; }
.action-btn.card-btn {
  background: var(--surface);
  color: var(--text);
  border: 2px solid var(--border);
}
.action-btn.card-btn:hover { border-color: var(--navy); }
.action-btn.fk-btn {
  background: var(--surface);
  color: var(--text);
  border: 2px solid var(--border);
  flex: 1;
  font-size: 0.75rem;
  padding: 12px 10px;
  flex-direction: column;
  gap: 4px;
}
.action-btn.fk-btn.active-fk {
  border-color: var(--card-red);
  background: var(--card-red-bg);
}
.pp-icon {
  display: inline-block;
  width: 28px;
  height: 24px;
  vertical-align: middle;
}
.pp-icon svg { width: 100%; height: 100%; }
.pp-icon.pp-sm { width: 20px; height: 17px; }

/* ===== TIMELINE ===== */
.timeline-event {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--bg);
}
.timeline-event:last-child { border-bottom: none; }
.timeline-minute {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.82rem;
  color: var(--text-muted);
  min-width: 32px;
  text-align: right;
}
.timeline-icon { font-size: 1rem; flex-shrink: 0; }
.timeline-detail { flex: 1; font-size: 0.88rem; }
.timeline-detail strong { font-weight: 700; }
.timeline-detail .sub-text { color: var(--text-muted); font-size: 0.78rem; }
.timeline-score {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.78rem;
  color: var(--navy);
  background: var(--navy-10);
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
}
.timeline-event.opponent-goal { opacity: 0.55; }
.timeline-event.opponent-goal .timeline-score { color: var(--text-muted); background: var(--draw-bg); }
.timeline-event.own-goal .timeline-icon { color: var(--card-red); }
.timeline-event.own-goal .timeline-detail strong { color: var(--card-red); }

/* ===== STATS ===== */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.stat-box {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 12px 6px;
  text-align: center;
  box-shadow: var(--shadow);
}
.stat-value {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 1.4rem;
  color: var(--navy);
}
.stat-label {
  font-size: 0.65rem;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-top: 2px;
}

.leaderboard-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--bg);
}
.leaderboard-item:last-child { border-bottom: none; }
.lb-rank {
  font-family: 'Nunito', sans-serif;
  font-weight: 600;
  font-size: 0.72rem;
  color: #888888;
  width: 16px;
  text-align: center;
  flex-shrink: 0;
}
.lb-rank.top { color: #888888; }
.lb-stats {
  display: flex;
  gap: 12px;
  margin-left: auto;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--navy);
}
.lb-stats .stat-icon { margin-right: 2px; font-size: 0.75rem; }

/* ===== SCHEDULE ===== */
.schedule-match {
  display: flex;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--bg);
  gap: 12px;
}
.schedule-match:last-child { border-bottom: none; }
.sched-date {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.72rem;
  color: var(--text-muted);
  text-align: center;
  min-width: 44px;
  line-height: 1.3;
}
.sched-date .sched-day { font-size: 1.15rem; color: var(--text); }
.sched-info { flex: 1; }
.sched-opponent { font-weight: 700; font-size: 0.92rem; }
.sched-meta { font-size: 0.72rem; color: var(--text-muted); }
.sched-result {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 0.95rem;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  min-width: 54px;
  text-align: center;
}
.sched-result.win { background: var(--win-bg); color: var(--navy); }
.sched-result.loss { background: var(--loss-bg); color: var(--card-red); }
.sched-result.draw { background: var(--draw-bg); color: var(--text-muted); }
.sched-result.upcoming { background: var(--bg); color: var(--text-muted); font-weight: 600; font-size: 0.78rem; }
.match-type {
  display: inline-block;
  font-size: 0.58rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  padding: 1px 5px;
  border-radius: 3px;
  margin-left: 4px;
  vertical-align: middle;
}
.match-type.comp { background: var(--navy-10); color: var(--navy); }
.match-type.beker { background: rgba(196,146,46,0.15); color: var(--navy); }
.match-type.friendly { background: rgba(136,136,136,0.15); color: #888888; }
.srza-show-all {
  display: block;
  width: 100%;
  text-align: center;
  padding: 10px;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--navy);
  background: none;
  border: none;
  border-top: 1px solid var(--bg);
  cursor: pointer;
}

/* ===== SEASON SELECTOR ===== */
.season-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.season-tabs::-webkit-scrollbar { display: none; }
.season-tab {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-family: 'Nunito', sans-serif;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition);
}
.season-tab.active {
  background: var(--navy);
  color: #0A0A0A;
  border-color: var(--navy);
}

/* ===== STANDINGS TABLE ===== */
.standings-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.standings-table {
  width: 100%;
  font-size: 0.72rem;
  border-collapse: collapse;
  min-width: 340px;
}
.standings-table th {
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  font-size: 0.6rem;
  letter-spacing: 0.3px;
  padding: 8px 3px;
  border-bottom: 2px solid var(--border);
  text-align: center;
}
.standings-table th:nth-child(2) { text-align: left; }
.standings-table td {
  padding: 7px 3px;
  text-align: center;
  border-bottom: 1px solid var(--bg);
  font-weight: 500;
}
.standings-table td:nth-child(2) { text-align: left; font-weight: 600; font-size: 0.7rem; }
.standings-table tr.highlight { background: var(--navy-10); }
.standings-table tr.highlight td { font-weight: 700; }
.standings-table tr.highlight td:nth-child(2) { color: var(--navy); font-weight: 800; }
.standings-table .pts { font-family: 'Montserrat', sans-serif; font-weight: 800; color: var(--navy); }
.standings-table .ds-pos { color: var(--navy); }
.standings-table .ds-neg { color: var(--card-red); }

/* ===== ANALYSE / INSIGHTS ===== */
.insight-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.insight-tag {
  display: inline-block;
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 3px 8px;
  border-radius: 10px;
  margin-bottom: 8px;
}
.insight-tag.positive { background: rgba(16,185,129,0.1); color: #059669; }
.insight-tag.neutral { background: var(--navy-10); color: var(--navy); }
.insight-tag.warning { background: rgba(245,158,11,0.1); color: #D97706; }
.insight-title {
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.92rem;
  margin-bottom: 6px;
}
.insight-body {
  font-size: 0.82rem;
  color: var(--text-muted);
  line-height: 1.55;
}
.insight-body strong {
  color: var(--text);
  font-weight: 700;
}
.insight-stat {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  color: var(--navy);
}
.analyse-header {
  text-align: center;
  margin-bottom: 20px;
}
.analyse-header h2 {
  font-size: 1.1rem;
  font-weight: 800;
  margin-bottom: 4px;
}
.analyse-header p {
  font-size: 0.78rem;
  color: var(--text-muted);
}
.insight-section {
  margin-top: 24px;
  margin-bottom: 8px;
}
.insight-section-title {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 0.82rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--navy);
  padding-bottom: 6px;
  border-bottom: 2px solid var(--navy);
  margin-bottom: 12px;
}
.history-result {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--bg);
  gap: 10px;
  font-size: 0.82rem;
}
.history-result:last-child { border-bottom: none; }
.history-result .hr-date {
  font-size: 0.7rem;
  color: var(--text-muted);
  min-width: 50px;
  font-weight: 600;
}
.history-result .hr-opp { flex: 1; font-weight: 600; }
.history-result .hr-ha {
  font-size: 0.6rem;
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.history-result .hr-score {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 0.85rem;
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  min-width: 48px;
  text-align: center;
}
.hr-score.win { background: var(--win-bg); color: var(--navy); }
.hr-score.loss { background: var(--loss-bg); color: var(--card-red); }
.hr-score.draw { background: var(--draw-bg); color: var(--text-muted); }

/* ===== MISC ===== */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.section-title { font-size: 1.05rem; font-weight: 800; }

.tab-row {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 3px;
}
.tab-btn {
  flex: 1;
  padding: 8px;
  text-align: center;
  background: none;
  border: none;
  border-radius: 6px;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.75rem;
  cursor: pointer;
  color: var(--text-muted);
  transition: all var(--transition);
}
.tab-btn.active { background: var(--surface); color: var(--navy); box-shadow: var(--shadow); }

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}
.empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
.empty-state h3 { color: var(--text); margin-bottom: 6px; }
.empty-state p { font-size: 0.88rem; margin-bottom: 20px; }

/* ===== MATCH HISTORY ===== */
.match-history-item {
  cursor: pointer;
  transition: background var(--transition);
  padding: 14px;
}
.match-history-item:hover { background: var(--bg); }
.mh-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.mh-date { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
.mh-badge {
  font-size: 0.62rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  text-transform: uppercase;
}
.mh-badge.win { background: var(--win-bg); color: var(--navy); }
.mh-badge.loss { background: var(--loss-bg); color: var(--card-red); }
.mh-badge.draw { background: var(--draw-bg); color: var(--text-muted); }
.mh-teams {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-family: 'Montserrat', sans-serif;
}
.mh-team { font-weight: 700; font-size: 0.88rem; flex: 1; }
.mh-team.home { text-align: right; }
.mh-team.away { text-align: left; }
.mh-score { font-weight: 900; font-size: 1.25rem; color: var(--navy); min-width: 60px; text-align: center; }
.mh-scorers { font-size: 0.72rem; color: var(--text-muted); text-align: center; margin-top: 4px; }

/* ===== MATCH DETAIL ===== */
.match-detail-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: -100px;
  padding-bottom: 100px;
  background: var(--bg);
  z-index: 150;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.match-detail-overlay.open { display: block; }
body.overlay-open { overflow: hidden; }
.detail-back {
  display: flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  font-family: 'Nunito', sans-serif;
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--navy);
  cursor: pointer;
  padding: 16px 20px;
}
.share-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--navy);
  color: #0A0A0A;
  border: none;
  border-radius: 8px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  padding: 8px 16px;
  margin-right: 16px;
  cursor: pointer;
}
.share-btn-sm {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--navy-10);
  color: var(--navy);
  border: none;
  border-radius: 6px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 5px 10px;
  cursor: pointer;
}
.pp-header {
  text-align: center;
  padding: 30px 20px 20px;
  background: linear-gradient(135deg, #0A0A0A, #1A1A1A);
  color: #fff;
}
.pp-avatar {
  width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 12px;
  background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center;
  font-size: 2rem; font-weight: 800; color: #fff; overflow: hidden;
}
.pp-name { font-family: 'Montserrat', sans-serif; font-size: 1.3rem; font-weight: 800; }
.pp-number { font-size: 0.85rem; opacity: 0.7; margin-top: 4px; }
.pp-badges { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
.pp-badge { font-size: 0.65rem; font-weight: 700; background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.pp-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); margin: 0 16px; border-radius: 12px; overflow: hidden; }
.pp-stat { background: var(--surface); text-align: center; padding: 14px 8px; }
.pp-stat-val { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.4rem; color: var(--navy); }
.pp-stat-label { font-size: 0.68rem; color: var(--text-muted); margin-top: 2px; }
.pp-matches { margin: 16px; }
.pp-match { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; }
.pp-match:last-child { border-bottom: none; }
.pp-match-opp { font-weight: 600; }
.pp-match-contrib { color: var(--navy); font-weight: 700; font-size: 0.78rem; }
.pp-season { margin: 16px; }
.pp-season-header { font-family: 'Montserrat', sans-serif; font-size: 0.78rem; font-weight: 700; color: var(--navy); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.pp-season-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--surface); border-radius: 8px; margin-bottom: 4px; font-size: 0.82rem; }
.pp-season-row.total { background: var(--navy); color: #0A0A0A; font-weight: 700; border-radius: 10px; margin-top: 8px; }
.pp-season-row.total .pp-season-stat { color: rgba(10,10,10,0.6); }
.pp-season-label { font-weight: 600; }
.pp-season-stats { display: flex; gap: 12px; }
.pp-season-stat { font-size: 0.75rem; color: var(--text-muted); }
.pp-season-stat strong { color: var(--navy); font-weight: 800; }
.pp-season-row.total .pp-season-stat strong { color: #0A0A0A; }

/* ===== FORMATION PITCH ===== */
.pitch {
  position: relative;
  width: 100%;
  max-width: 340px;
  margin: 16px auto;
  aspect-ratio: 4 / 3;
  background: linear-gradient(180deg, #1A1A1A, #0A0A0A);
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,0.15);
}
.pitch::before {
  content: '';
  position: absolute;
  top: 0;
  left: 8%;
  right: 8%;
  height: 1px;
  background: rgba(255,255,255,0.2);
}
.pitch::after {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  width: 50px;
  height: 25px;
  border: 1px solid rgba(255,255,255,0.2);
  border-top: none;
  border-radius: 0 0 50px 50px;
  transform: translateX(-50%);
}
.pitch-goal {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 36%;
  height: 10%;
  border: 1px solid rgba(255,255,255,0.2);
  border-bottom: none;
  border-radius: 6px 6px 0 0;
}
.pitch-player {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translate(-50%, -50%);
}
.pitch-dot {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,0.9);
  color: #0A0A0A;
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 0.7rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.pitch-dot.keeper { background: #F59E0B; color: #fff; }
.pitch-label {
  margin-top: 3px;
  font-size: 0.62rem;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  white-space: nowrap;
}

/* ===== PHASE OVERLAY ===== */
.phase-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,10,10,0.95);
  z-index: 180;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--on-primary);
  text-align: center;
  backdrop-filter: blur(8px);
}
.phase-overlay.open { display: flex; }
.phase-overlay h2 {
  font-size: 1.8rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 4px;
  margin-bottom: 8px;
}
.phase-overlay .phase-score {
  font-family: 'Montserrat', sans-serif;
  font-size: 3rem;
  font-weight: 900;
  margin-bottom: 24px;
}

/* ===== GOAL TEAM SELECT ===== */
.team-select { display: flex; gap: 12px; margin-bottom: 20px; }
.team-option {
  flex: 1;
  padding: 18px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
}
.team-option h4 { font-size: 0.88rem; margin-bottom: 2px; }
.team-option.selected-home { border-color: var(--navy); background: var(--navy-10); }
.team-option.selected-away { border-color: var(--text-muted); background: var(--draw-bg); }

/* ===== PLAYER SELECT ===== */
.player-select-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 2px solid transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  margin-bottom: 4px;
}
.player-select-item:hover { background: var(--bg); }
.player-select-item.selected { border-color: var(--navy); background: var(--navy-10); }

/* ===== CARD TYPE ===== */
.card-type-row { display: flex; gap: 8px; margin-bottom: 16px; }
.card-type-btn {
  flex: 1;
  padding: 14px 8px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  text-align: center;
  cursor: pointer;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 0.82rem;
  transition: all var(--transition);
  background: var(--surface);
}
.card-type-btn .card-dot {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 3px;
  vertical-align: middle;
  margin-right: 4px;
}
.card-type-btn.green-selected { border-color: var(--card-green); background: var(--card-green-bg); }
.card-type-btn.yellow-selected { border-color: var(--card-yellow); background: var(--card-yellow-bg); }
.card-type-btn.red-selected { border-color: var(--card-red); background: var(--card-red-bg); }

/* ===== MOTM ===== */
.motm-section { text-align: center; padding: 20px; }
.motm-section h3 { font-size: 1rem; margin-bottom: 4px; }
.motm-section p { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px; }
.motm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
.motm-player {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 12px 6px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
}
.motm-player.selected { border-color: var(--navy); background: var(--navy-10); }
.motm-player .motm-name { font-size: 0.72rem; font-weight: 600; text-align: center; }


/* ===== GOAL CELEBRATION ===== */
.goal-celebration {
  position: fixed;
  inset: 0;
  background: rgba(10,10,10,0.95);
  z-index: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--on-primary);
  text-align: center;
  backdrop-filter: blur(8px);
  animation: celebFadeIn 0.3s ease;
}
.goal-celebration.fade-out { animation: celebFadeOut 0.4s ease forwards; }
@keyframes celebFadeIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
@keyframes celebFadeOut { from { opacity:1; transform:scale(1); } to { opacity:0; transform:scale(1.05); } }
.celeb-photo {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 4px solid var(--on-primary);
  overflow: hidden;
  margin-bottom: 20px;
  background: var(--navy-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  font-size: 2.5rem;
  color: var(--on-primary);
}
.celeb-label {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  font-size: 2.2rem;
  text-transform: uppercase;
  letter-spacing: 6px;
  margin-bottom: 16px;
}
.celeb-name {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800;
  font-size: 1.6rem;
  margin-bottom: 4px;
}
.celeb-number {
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  font-size: 1rem;
  opacity: 0.7;
  margin-bottom: 8px;
}
.celeb-minute {
  font-family: 'Nunito', sans-serif;
  font-weight: 600;
  font-size: 0.92rem;
  opacity: 0.6;
}
.celeb-score {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  font-size: 2.8rem;
  margin-top: 20px;
}

/* ===== RESPONSIVE ===== */
@media (min-width: 480px) {
  .squad-grid { grid-template-columns: 1fr 1fr 1fr; }
  .motm-grid { grid-template-columns: repeat(4, 1fr); }
}

/* ===== MENU DOTS ===== */
.menu-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.2rem;
  padding: 8px;
  color: var(--on-primary);
  opacity: 0.6;
  transition: opacity var(--transition);
  line-height: 1;
}
.menu-btn:hover { opacity: 1; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ===== LOGIN SCREEN ===== */
.login-screen {
  position: fixed;
  inset: 0;
  background: #0A0A0A;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-screen.hidden { display: none; }
.login-card {
  text-align: center;
  padding: 40px 32px;
  max-width: 340px;
  width: 100%;
}
.login-logo {
  font-family: 'Pirata One', cursive;
  font-size: 2.4rem;
  color: var(--navy);
  margin-bottom: 8px;
}
.login-sub {
  color: var(--text-muted);
  font-size: 0.88rem;
  margin-bottom: 32px;
}
.login-google-btn {
  gap: 10px;
  font-size: 0.95rem;
  padding: 14px 24px;
}
.login-divider {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.75rem;
  margin: 16px 0;
  position: relative;
}
.login-divider::before, .login-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 40%;
  height: 1px;
  background: var(--border);
}
.login-divider::before { left: 0; }
.login-divider::after { right: 0; }
.login-error {
  color: var(--card-red);
  font-size: 0.8rem;
  margin-top: 16px;
  min-height: 20px;
}
.user-menu {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.user-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--navy);
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">

    <div class="login-divider"><span>of</span></div>
    <button class="btn btn-secondary btn-block login-google-btn" onclick="doGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Inloggen met Google
    </button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<script>
// =========================================================
// DATA + FIREBASE
// =========================================================
// Hét versienummer van de app; hier ophogen bij een release. De deploy leest
// deze waarde en hangt er het commit-kenmerk achter voor de naam van de
// service worker cache, zodat die ook verloopt als je het bumpen vergeet.
const APP_VERSION = '2.5.2';

const STORAGE_KEY = 'jogaBonito_v2';
const UNSYNCED_KEY = 'jogaBonito_unsynced';

const firebaseConfig = {
  apiKey: "AIzaSyCMs8R5y-ud2n8naGLc9eNlszXJFDkBF8w",
  authDomain: "futsal-joga-bonito.firebaseapp.com",
  databaseURL: "https://futsal-joga-bonito-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "futsal-joga-bonito",
  storageBucket: "futsal-joga-bonito.firebasestorage.app",
  messagingSenderId: "462991962749",
  appId: "1:462991962749:web:6b180cac60bf4973b9b714"
};

firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const fbDb = firebase.database();
const fbRef = fbDb.ref('data');
let fbReady = false;
let savingToFirebase = false;

const DEFAULT_PLAYERS = [
  { id:'p1',  name:'Marco',   number:1,  isKeeper:true,  isCaptain:false, foot:'R' },
  { id:'p2',  name:'Irving',  number:7,  isKeeper:false, isCaptain:true,  foot:'R' },
  { id:'p3',  name:'Lyzairo', number:8,  isKeeper:false, isCaptain:false, foot:'R' },
  { id:'p4',  name:'Rayvano', number:9,  isKeeper:false, isCaptain:false, foot:'R' },
  { id:'p5',  name:'Bobby',   number:10, isKeeper:false, isCaptain:false, foot:'R' },
  { id:'p6',  name:'Gregory', number:11, isKeeper:false, isCaptain:false, foot:'L' },
  { id:'p7',  name:'Lawin',   number:5,  isKeeper:false, isCaptain:false, foot:'R' },
  { id:'p8',  name:'Erfan',   number:12, isKeeper:true,  isCaptain:false, foot:'R' },
  { id:'p9',  name:'Kenneth', number:14, isKeeper:false, isCaptain:false, foot:'L' },
  { id:'p10', name:'Said',    number:24, isKeeper:false, isCaptain:false, foot:'R' },
  { id:'p11', name:'Amine',   number:59, isKeeper:false, isCaptain:false, foot:'R' },
  { id:'p12', name:'Fouad',   number:99, isKeeper:false, isCaptain:false, foot:'L' },
];

const defaultData = () => ({
  teamName: 'Joga Bonito',
  season: '2026/27',
  players: JSON.parse(JSON.stringify(DEFAULT_PLAYERS)),
  matches: [],
  currentMatch: null,
  nextPlayerId: 13,
  nextMatchId: 1
});

let DB = loadDataLocal();

// Firebase slaat lege arrays en null-waarden niet op: `events: []` verdwijnt
// volledig uit het object. Zonder deze normalisatie crasht elke `.filter()` op
// een teruggeladen wedstrijd. Ook sparse arrays komen als object terug.
function toArray(v) {
  if (Array.isArray(v)) return v;
  if (v && typeof v === 'object') return Object.values(v);
  return [];
}

function normalizeDB(d) {
  if (!d || typeof d !== 'object') return defaultData();
  const base = defaultData();
  d.teamName = d.teamName || base.teamName;
  d.season = d.season || base.season;
  d.players = toArray(d.players);
  if (!d.players.length) d.players = base.players;
  // De app bewaart geen spelersfoto's meer (AVG). Bestaande foto's uit oudere
  // versies worden hier weggegooid, zodat ze bij de eerstvolgende save ook
  // echt uit Firebase verdwijnen in plaats van alleen ongebruikt te blijven.
  d.players.forEach(p => { if (p && p.photo !== undefined) delete p.photo; });
  d.matches = toArray(d.matches).filter(Boolean).map(normalizeMatch);
  d.currentMatch = d.currentMatch ? normalizeMatch(d.currentMatch) : null;
  if (!d.nextPlayerId) d.nextPlayerId = d.players.length + 1;
  if (!d.nextMatchId) d.nextMatchId = d.matches.length + 1;
  return d;
}

function normalizeMatch(m) {
  m.squad = toArray(m.squad);
  m.lineup = toArray(m.lineup);
  m.events = toArray(m.events).filter(Boolean);
  m.penalties = toArray(m.penalties).filter(Boolean).map(p => {
    if (p.endsAtClock === undefined) p.endsAtClock = null;
    if (p.remaining === undefined) p.remaining = null;
    return p;
  });
  if (m.keeper === undefined) m.keeper = null;
  if (m.captain === undefined) m.captain = null;
  if (m.motm === undefined) m.motm = null;
  if (m.timerEndsAt === undefined) m.timerEndsAt = null;
  if (m.timerRemaining === undefined) m.timerRemaining = null;
  if (m.vlagger === undefined) m.vlagger = null;
  if (m.vlaggerNaam === undefined) m.vlaggerNaam = null;
  if (m.zaaldienst === undefined) m.zaaldienst = null;
  if (m.zaaldienstNaam === undefined) m.zaaldienstNaam = null;
  m.squadNamen = toArray(m.squadNamen);
  m.assistsNamen = toArray(m.assistsNamen).filter(Boolean);
  if (typeof m.scoreHome !== 'number') m.scoreHome = 0;
  if (typeof m.scoreAway !== 'number') m.scoreAway = 0;
  return m;
}

function loadDataLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalizeDB(JSON.parse(raw));
  } catch(e) {}
  return defaultData();
}

// De Firebase-webSDK bewaart wachtende schrijfacties alleen in het geheugen.
// Sluit je de app in een sporthal zonder bereik, dan is die write weg. Daarom
// markeren we lokaal dat er nog iets openstaat, en pas als Firebase de
// schrijfactie bevestigt halen we die markering weg.
function saveData() {
  DB.updatedAt = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  localStorage.setItem(UNSYNCED_KEY, '1');
  if (!fbReady) { setSyncState('unsynced'); return; }
  savingToFirebase = true;
  setSyncState('pending');
  fbRef.set(DB)
    .then(() => { localStorage.removeItem(UNSYNCED_KEY); setSyncState('synced'); })
    .catch(() => setSyncState('unsynced'))
    .finally(() => { savingToFirebase = false; });
}

let syncState = 'synced';
function setSyncState(state) {
  syncState = state;
  const el = document.getElementById('syncDot');
  if (!el) return;
  el.className = 'sync-dot ' + state;
  el.style.display = (fbReady || localStorage.getItem(UNSYNCED_KEY)) ? 'block' : 'none';
  el.title = { synced: 'Opgeslagen', pending: 'Bezig met opslaan', unsynced: 'Nog niet gesynct' }[state] || '';
}

function explainVersion() {
  showToast(`Versie ${APP_VERSION} — dit is wat er nu op dit toestel draait`);
}

function explainSync() {
  const uitleg = {
    synced: 'Alles is opgeslagen en staat ook op je andere apparaat.',
    pending: 'Bezig met opslaan…',
    unsynced: 'Nog niet gesynct. Je gegevens staan veilig op dit toestel en gaan vanzelf mee zodra je weer verbinding hebt.',
  };
  showToast(uitleg[syncState] || '');
}

function doEmailLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  if (!email || !pass) return;
  document.getElementById('loginError').textContent = '';
  fbAuth.signInWithEmailAndPassword(email, pass).catch(err => {
    const msgs = { 'auth/invalid-credential': 'Onjuist email of wachtwoord', 'auth/invalid-email': 'Ongeldig emailadres', 'auth/too-many-requests': 'Te veel pogingen, probeer later opnieuw' };
    document.getElementById('loginError').textContent = msgs[err.code] || 'Inloggen mislukt';
  });
}

function doGoogleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(err => {
    document.getElementById('loginError').textContent =
      err.code === 'auth/popup-closed-by-user' ? '' : 'Inloggen mislukt: ' + err.message;
  });
}

function doLogout() {
  fbAuth.signOut();
}

const SEED_VERSION = 6;
const SEEDED_SEASONS = ['2025/26', '2024/25'];

function seedMatchesFromHistory() {
  const seeded = [];
  const seededKeys = new Set();
  let id = 1;
  SEEDED_SEASONS.forEach(season => {
    const h = HISTORY[season];
    if (!h || !h.results) return;
    h.results.forEach(r => {
      seededKeys.add(r.date + '|' + r.opp);
      const d = MATCH_DETAILS[r.date + '|' + r.opp] || {};
      const spelerIdVan = naam => (DB.players.find(p => p.name === naam) || {}).id || null;

      // Uit de administratie kennen we per speler het áántal goals, niet welke
      // assist bij welke goal hoorde. Doelpunten worden dus losse gebeurtenissen
      // zonder minuut, en assists tonen we apart in plaats van ze te koppelen.
      const events = [];
      (d.g || []).forEach(([naam, aantal]) => {
        for (let i = 0; i < aantal; i++) {
          events.push({ type: 'goal', team: 'home', minute: null, half: null,
            scorerId: spelerIdVan(naam), scorerNaam: naam, assistId: null });
        }
      });
      (d.c || []).forEach(([naam, soort]) => {
        events.push({ type: 'card', minute: null, half: null,
          playerId: spelerIdVan(naam), playerNaam: naam, cardType: soort });
      });

      seeded.push({
        id: 'hs' + id++,
        _seeded: true,
        season,
        date: r.date,
        opponent: r.opp,
        sporthal: r.hal || '',
        comp: r.comp === '1B' || r.comp === 'HB' ? 'comp' : (r.comp === 'BK' ? 'beker' : r.comp),
        squad: (d.s || []).map(spelerIdVan).filter(Boolean),
        squadNamen: d.s || [],
        assistsNamen: d.a || [],
        lineup: [], keeper: null, captain: null, flyingKeeper: false,
        events,
        scoreHome: r.jb,
        scoreAway: r.opp_s,
        // Vlagger en zaaldienst staan als naam: het kan iemand zijn die niet
        // meer in de selectie zit, en dan is er geen speler-id om naar te wijzen.
        vlagger: null,
        vlaggerNaam: d.v || null,
        zaaldienst: null,
        zaaldienstNaam: d.z || null,
        half: 2, motm: null, status: 'finished'
      });
    });
  });
  // Behoud alleen zelf ingevoerde wedstrijden. De date|opponent check ruimt
  // seeds van vóór de _seeded flag op, die anders als duplicaat blijven staan.
  const userMatches = toArray(DB.matches).filter(m =>
    m && !m._seeded && !seededKeys.has(m.date + '|' + m.opponent));
  DB.matches = [...seeded, ...userMatches];
  DB.nextMatchId = Math.max(id, DB.nextMatchId || 1);
  DB._seedVersion = SEED_VERSION;
}

function needsSeed() {
  return !DB.matches || DB.matches.length === 0 || (DB._seedVersion || 0) < SEED_VERSION;
}

// Wedstrijden van vóór de seizoensregistratie horen bij het lopende seizoen;
// alleen historische seeds dragen expliciet hun eigen seizoen mee.
function matchSeason(m) { return m.season || DB.season; }
function seasonMatches(season) {
  return toArray(DB.matches).filter(m => m.status === 'finished' && matchSeason(m) === season);
}

// ===== TAKEN: VLAGGER EN ZAALDIENST =====
// Elke wedstrijd moet iemand vlaggen of een vlagger regelen, en iemand draait
// zaaldienst. Beide werken hetzelfde, dus ze delen deze machinerie. We houden
// bij wie het op zich neemt, zodat het niet altijd bij dezelfde persoon belandt.
const TAKEN = {
  vlagger:    { veld: 'vlagger',    naamVeld: 'vlaggerNaam',    label: 'Vlagger',    vraag: 'Wie vlagt?',
                uitleg: 'Vlaggen of een vlagger regelen telt allebei mee.', werkwoord: 'vlagt', historie: 'vlaggers' },
  zaaldienst: { veld: 'zaaldienst', naamVeld: 'zaaldienstNaam', label: 'Zaaldienst', vraag: 'Wie draait zaaldienst?',
                uitleg: 'De zaaldienst houdt het wedstrijdformulier bij.', werkwoord: 'draait zaaldienst', historie: 'zaaldiensten' },
};

// De geblokte grensrechtersvlag; de rode-driehoek-emoji leest als iets anders.
function vlagIcon(size = 14) {
  return `<svg class="vlag-icon" width="${size}" height="${size}" viewBox="0 0 16 16" aria-hidden="true">
    <rect x="1.1" y="0.8" width="1.5" height="14.4" rx="0.7" fill="currentColor" opacity="0.5"/>
    <rect x="3.2" y="1.8" width="5.4" height="4.4" fill="var(--card-red)"/>
    <rect x="8.6" y="1.8" width="5.4" height="4.4" fill="var(--card-yellow)"/>
    <rect x="3.2" y="6.2" width="5.4" height="4.4" fill="var(--card-yellow)"/>
    <rect x="8.6" y="6.2" width="5.4" height="4.4" fill="var(--card-red)"/>
  </svg>`;
}

function taakVan(m, taak) {
  const t = TAKEN[taak];
  if (m[t.veld]) {
    const p = getPlayer(m[t.veld]);
    if (p) return p.name;
  }
  return m[t.naamVeld] || null;
}
function vlaggerVan(m) { return taakVan(m, 'vlagger'); }

function taakTellingen(season, taak) {
  const telling = {};
  seasonMatches(season).forEach(m => {
    const naam = taakVan(m, taak);
    if (naam) telling[naam] = (telling[naam] || 0) + 1;
  });
  return telling;
}
function vlaggerTellingen(season) { return taakTellingen(season, 'vlagger'); }

function setTaak(taak, playerId) {
  const cm = DB.currentMatch;
  if (!cm) return;
  const t = TAKEN[taak];
  const p = getPlayer(playerId);
  cm[t.veld] = p ? p.id : null;
  cm[t.naamVeld] = p ? p.name : null;
  saveData(); closeModal(); renderMatchView();
}

// Loot onder de aanwezigen die dit seizoen het minst aan de beurt zijn geweest.
// Puur willekeurig zou de scheve verdeling in stand houden.
function wijsTaakAan(taak) {
  const cm = DB.currentMatch;
  if (!cm) return;
  const t = TAKEN[taak];
  const aanwezig = toArray(cm.squad).map(getPlayer).filter(Boolean);
  if (!aanwezig.length) return;
  const telling = taakTellingen(DB.season, taak);
  const minimum = Math.min(...aanwezig.map(p => telling[p.name] || 0));
  const kandidaten = aanwezig.filter(p => (telling[p.name] || 0) === minimum);
  const gekozen = kandidaten[Math.floor(Math.random() * kandidaten.length)];
  const vorige = cm[t.veld];
  cm[t.veld] = gekozen.id;
  cm[t.naamVeld] = gekozen.name;
  saveData(); renderMatchView();
  showToast(
    `${gekozen.name} ${t.werkwoord}${minimum === 0 ? ' (nog niet aan de beurt geweest)' : ` (${minimum}x dit seizoen)`}`,
    () => { setTaak(taak, vorige); }
  );
}

function openTaakModal(taak) {
  const cm = DB.currentMatch;
  if (!cm) return;
  const t = TAKEN[taak];
  const telling = taakTellingen(DB.season, taak);
  const aanwezig = toArray(cm.squad).map(getPlayer).filter(Boolean)
    .sort((a, b) => (telling[a.name] || 0) - (telling[b.name] || 0) || a.number - b.number);
  let h = `<h3>${t.vraag}</h3>
    <p style="text-align:center;font-size:0.8rem;color:var(--text-muted);margin-bottom:16px">${t.uitleg}</p>`;
  aanwezig.forEach(p => {
    const n = telling[p.name] || 0;
    h += `<div class="squad-player ${cm[t.veld] === p.id ? 'selected' : ''}" style="margin-bottom:6px"
      onclick="setTaak('${taak}', '${p.id}')">
      ${avatarHTML(p, 'avatar-sm')}
      <span class="sq-name">${p.name}</span>
      <span class="sq-badge">${n}x</span>
    </div>`;
  });
  h += `<button class="modal-cancel" onclick="closeModal()">Sluiten</button>`;
  openModal(h);
}

fbAuth.onAuthStateChanged(user => {
  const loginScreen = document.getElementById('loginScreen');
  const avatar = document.getElementById('userAvatar');
  if (user) {
    loginScreen.classList.add('hidden');
    if (user.photoURL) { avatar.src = user.photoURL; avatar.style.display = 'block'; }
    fbRef.once('value').then(snap => {
      const remote = snap.val();
      // Blind de server volgen wist wedstrijden die offline zijn vastgelegd en
      // Firebase nooit bereikten. Alleen als er zulke wijzigingen openstaan én
      // ze nieuwer zijn dan wat er staat, wint de lokale versie.
      const lokaalOpenstaand = localStorage.getItem(UNSYNCED_KEY) === '1';
      const lokaalNieuwer = (DB.updatedAt || 0) > ((remote && remote.updatedAt) || 0);
      if (remote && !(lokaalOpenstaand && lokaalNieuwer)) DB = normalizeDB(remote);
      fbReady = true;
      // saveData() moet ná fbReady staan, anders belandt de correctie alleen
      // in localStorage en laadt elke login opnieuw de foute data.
      if (needsSeed()) seedMatchesFromHistory();
      saveData();
      refreshApp();
    });
    fbRef.on('value', snap => {
      if (savingToFirebase) return;
      const remote = snap.val();
      if (remote) {
        DB = normalizeDB(remote);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
        refreshApp();
      }
    });
  } else {
    loginScreen.classList.remove('hidden');
    avatar.style.display = 'none';
    fbReady = false;
    fbRef.off();
    const dot = document.getElementById('syncDot');
    if (dot) dot.style.display = 'none';
  }
});

function refreshApp() {
  document.getElementById('seasonBadge').textContent = DB.season;
  if (!timerRunning) restoreTimer();
  const active = document.querySelector('.page.active');
  if (active) {
    if (active.id === 'pageMatch') renderMatchView();
    else if (active.id === 'pageStats') renderStatsPage();
    else if (active.id === 'pageSchedule') renderSchedulePage();
    else if (active.id === 'pageTeam') renderTeamPage();
    else if (active.id === 'pageAnalyse') renderAnalysePage();
  } else {
    renderMatchView();
  }
}

// =========================================================
// TIMER
// =========================================================
let timerInterval = null;
let timerSeconds = 20 * 60;
let timerRunning = false;

// De klok wordt verankerd aan een eindtijdstip in plaats van alleen af te
// tellen in het geheugen. Zo staat hij na een herstart — of nadat iOS de app
// uit het geheugen gooit tijdens de rust — nog op de juiste stand, en blijven
// de minuten bij goals kloppen.
function persistTimer(save = true) {
  const cm = DB.currentMatch;
  if (!cm) return;
  if (timerRunning) {
    cm.timerEndsAt = Date.now() + timerSeconds * 1000;
    cm.timerRemaining = null;
  } else {
    cm.timerEndsAt = null;
    cm.timerRemaining = timerSeconds;
  }
  if (save) saveData();
}

function restoreTimer() {
  const cm = DB.currentMatch;
  if (!cm || (cm.status !== 'half1' && cm.status !== 'half2')) return;
  if (cm.timerEndsAt) {
    timerSeconds = Math.max(0, Math.round((cm.timerEndsAt - Date.now()) / 1000));
    if (timerSeconds > 0) startTimer();
    else { timerRunning = false; onTimerEnd(); }
  } else if (typeof cm.timerRemaining === 'number') {
    timerSeconds = cm.timerRemaining;
    timerRunning = false;
  }
}

function startTimer() {
  if (timerRunning) return;
  timerRunning = true;
  persistTimer();
  timerInterval = setInterval(() => {
    if (timerSeconds > 0) { timerSeconds--; renderTimerDisplay(); renderPenaltyStrip(); checkPenalties(); }
    else { stopTimer(); onTimerEnd(); }
  }, 1000);
  renderMatchView();
}
function stopTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  persistTimer();
  renderMatchView();
}
function resetTimer() { stopTimer(); timerSeconds = 20 * 60; persistTimer(); renderMatchView(); }

function getCurrentMinute() {
  const cm = DB.currentMatch;
  if (!cm) return 0;
  const elapsed = (20*60) - timerSeconds;
  const min = Math.ceil(elapsed / 60);
  return cm.half === 2 ? 20 + (min || 1) : (min || 1);
}

function formatTimer(sec) {
  return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
}
function renderTimerDisplay() {
  const el = document.getElementById('timerDisplay');
  if (el) el.textContent = formatTimer(timerSeconds);
}
function onTimerEnd() {
  const cm = DB.currentMatch;
  if (!cm) return;
  if (cm.half === 1) {
    showPhaseOverlay('Rust', `${cm.scoreHome} – ${cm.scoreAway}`, 'Start 2e Helft', () => {
      cm.half = 2; timerSeconds = 20*60; timerRunning = false; persistTimer(false);
      // Nog niet uitgezeten straftijd loopt door in de tweede helft; de klok
      // begint weer op 20:00, dus de afloopstand van lopende straffen schuift mee.
      toArray(cm.penalties).forEach(p => { if (p.endsAtClock != null) p.endsAtClock += 20*60; });
      saveData(); hidePhaseOverlay(); startTimer();
    });
  } else {
    cm.status = 'fulltime'; saveData();
    showPhaseOverlay('Einde Wedstrijd', `${cm.scoreHome} – ${cm.scoreAway}`, 'Man of the Match', () => {
      hidePhaseOverlay(); renderMatchView();
    });
  }
}

let toastFadeTimeout = null;
function showToast(text, undoFn, btnLabel) {
  const el = document.getElementById('toast');
  el.classList.remove('show', 'hiding');
  el.innerHTML = `<span>${text}</span>` + (undoFn ? `<button id="toastUndo">${btnLabel || 'Ongedaan maken'}</button>` : '');
  requestAnimationFrame(() => el.classList.add('show'));
  if (undoFn) document.getElementById('toastUndo').onclick = () => { undoFn(); hideToast(); };
  clearTimeout(toastTimeout);
  clearTimeout(toastFadeTimeout);
  toastTimeout = setTimeout(() => {
    el.classList.remove('show');
    el.classList.add('hiding');
    toastFadeTimeout = setTimeout(() => el.classList.remove('hiding'), 300);
  }, 3000);
}
function hideToast() {
  const el = document.getElementById('toast');
  el.classList.remove('show', 'hiding');
  clearTimeout(toastTimeout);
  clearTimeout(toastFadeTimeout);
}

function getPlayerCareerStats(name, id) {
  const seasons = [];
  let totalGoals = 0, totalAssists = 0, totalPlayed = 0;

  ['2024/25', '2025/26'].forEach(key => {
    const hist = HISTORY[key];
    if (!hist) return;
    const hp = hist.players.find(p => p.name === name);
    if (hp && hp.played > 0) {
      seasons.push({ season: key, goals: hp.goals, assists: hp.assists, played: hp.played });
      totalGoals += hp.goals;
      totalAssists += hp.assists;
      totalPlayed += hp.played;
    }
  });

  const finished = DB.matches.filter(m => m.status === 'finished');
  const played = finished.filter(m => (m.squad || []).includes(id));
  if (played.length > 0) {
    let cg = 0, ca = 0;
    const matchDetails = [];
    played.forEach(m => {
      let mg = 0, ma = 0;
      (m.events || []).forEach(ev => {
        if (ev.type !== 'goal') return;
        if (ev.team === 'home' && !ev.ownGoal && ev.scorerId === id) { cg++; mg++; }
        if (ev.assistId === id) { ca++; ma++; }
      });
      matchDetails.push({ m, goals: mg, assists: ma });
    });
    seasons.push({ season: DB.season, goals: cg, assists: ca, played: played.length, matchDetails });
    totalGoals += cg;
    totalAssists += ca;
    totalPlayed += played.length;
  }

  const motm = finished.filter(m => m.motm === id).length;
  return { seasons, totalGoals, totalAssists, totalPlayed, motm };
}

    <button class="detail-back" onclick="closePlayerProfile()">&#8592; Terug</button>

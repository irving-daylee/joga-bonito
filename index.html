      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
    </button>
  </div>
  <div class="pp-header">
    <div class="pp-avatar">${p.name.charAt(0)}</div>
    <div class="pp-name">${p.name}</div>
    <div class="pp-number">#${p.number}</div>
    ${badges.length ? `<div class="pp-badges">${badges.map(b => `<span class="pp-badge">${b}</span>`).join('')}</div>` : ''}
  </div>
  <div style="margin-top:16px">
    <div class="pp-stats">
      <div class="pp-stat"><div class="pp-stat-val">${career.totalPlayed}</div><div class="pp-stat-label">Wedstrijden</div></div>
      <div class="pp-stat"><div class="pp-stat-val">${career.totalGoals}</div><div class="pp-stat-label">Goals</div></div>
      <div class="pp-stat"><div class="pp-stat-val">${career.totalAssists}</div><div class="pp-stat-label">Assists</div></div>
    </div>`;

  if (career.totalPlayed > 0) {
    if (p.isKeeper) {
      const keeperMatches = DB.matches.filter(m => m.status === 'finished' && m.keeper === id);
      const cleanSheets = keeperMatches.filter(m => m.scoreAway === 0).length;
      const goalsAgainstPer = keeperMatches.length ? (keeperMatches.reduce((s, m) => s + m.scoreAway, 0) / keeperMatches.length).toFixed(1) : '–';
      h += `<div class="pp-stats" style="margin-top:1px">
        <div class="pp-stat"><div class="pp-stat-val">${cleanSheets}</div><div class="pp-stat-label">Clean sheets</div></div>
        <div class="pp-stat"><div class="pp-stat-val">${goalsAgainstPer}</div><div class="pp-stat-label">Tegen / wed.</div></div>
        <div class="pp-stat"><div class="pp-stat-val">${career.motm}</div><div class="pp-stat-label">MOTM</div></div>
      </div>`;
    } else {
      const ratio = ((career.totalGoals + career.totalAssists) / career.totalPlayed).toFixed(1);
      const gpw = career.totalGoals ? (career.totalGoals / career.totalPlayed).toFixed(1) : '0';
      h += `<div class="pp-stats" style="margin-top:1px">
        <div class="pp-stat"><div class="pp-stat-val">${ratio}</div><div class="pp-stat-label">G/A ratio</div></div>
        <div class="pp-stat"><div class="pp-stat-val">${gpw}</div><div class="pp-stat-label">Goals / wed.</div></div>
        <div class="pp-stat"><div class="pp-stat-val">${career.motm}</div><div class="pp-stat-label">MOTM</div></div>
      </div>`;
    }
  }

  if (career.seasons.length > 0) {
    h += `<div class="pp-season"><div class="pp-season-header">Carrière</div>`;
    career.seasons.forEach(s => {
      h += `<div class="pp-season-row">
        <span class="pp-season-label">${s.season}</span>
        <div class="pp-season-stats">
          <span class="pp-season-stat"><strong>${s.played}</strong> wed</span>
          <span class="pp-season-stat"><strong>${s.goals}</strong> G</span>
          <span class="pp-season-stat"><strong>${s.assists}</strong> A</span>
        </div>
      </div>`;
    });
    if (career.seasons.length > 1) {
      h += `<div class="pp-season-row total">
        <span class="pp-season-label">All-time</span>
        <div class="pp-season-stats">
          <span class="pp-season-stat"><strong>${career.totalPlayed}</strong> wed</span>
          <span class="pp-season-stat"><strong>${career.totalGoals}</strong> G</span>
          <span class="pp-season-stat"><strong>${career.totalAssists}</strong> A</span>
        </div>
      </div>`;
    }
    h += `</div>`;
  }

  const currentSeason = career.seasons.find(s => s.matchDetails);
  if (currentSeason && currentSeason.matchDetails.length > 0) {
    h += `<div class="pp-matches"><h3 style="font-size:0.88rem;font-weight:700;margin-bottom:8px">Wedstrijden ${DB.season}</h3>`;
    [...currentSeason.matchDetails].reverse().forEach(({ m, goals: mg, assists: ma }) => {
      const contribs = [];
      if (mg) contribs.push(`${mg}G`);
      if (ma) contribs.push(`${ma}A`);
      h += `<div class="pp-match">
        <div><span class="pp-match-opp">${m.opponent}</span> <span style="color:var(--text-muted);font-size:0.75rem">${formatDate(m.date)}</span></div>
        <div style="display:flex;align-items:center;gap:8px">
          ${contribs.length ? `<span class="pp-match-contrib">${contribs.join(' ')}</span>` : ''}
          <span style="font-weight:700">${m.scoreHome}-${m.scoreAway}</span>
        </div>
      </div>`;
    });
    h += `</div>`;
  }

  h += `</div>`;
  document.getElementById('playerProfileContent').innerHTML = h;
  document.getElementById('playerProfile').classList.add('open');
  document.body.classList.add('overlay-open');
  document.getElementById('playerProfile').scrollTop = 0;
}
function closePlayerProfile() {
  document.getElementById('playerProfile').classList.remove('open');
  if (!document.getElementById('matchDetail').classList.contains('open')) document.body.classList.remove('overlay-open');
}

// =========================================================
// MATCH PAGE
// =========================================================
function renderMatchView() {
  const c = document.getElementById('matchContent');
  if (!c) return;
  const cm = DB.currentMatch;
  if (!cm || !cm.status) renderMatchIdle(c);
  else if (cm.status === 'setup') renderMatchSetup(c);
  else if (cm.status === 'squad') renderMatchSquad(c);
  else if (cm.status === 'lineup') renderMatchLineup(c);
  else if (cm.status === 'half1' || cm.status === 'half2') renderMatchLive(c);
  else if (cm.status === 'fulltime') renderMatchMOTM(c);
  else renderMatchIdle(c);
  updateLiveDot();
}

function renderMatchIdle(c) {
  const finished = DB.matches.filter(m => m.status==='finished').sort((a,b) => new Date(b.date)-new Date(a.date));
  let h = `<div style="text-align:center;padding:24px 0 20px">
    <button class="btn btn-primary btn-lg" onclick="startNewMatch()" ${DB.players.length<5?'disabled':''}>
      &#9917; Nieuwe Wedstrijd</button>
    ${DB.players.length<5?'<p style="font-size:0.78rem;color:var(--text-muted);margin-top:8px">Min. 5 spelers nodig</p>':''}
  </div>`;

  if (finished.length > 0) {
    h += `<div class="section-header"><h2 class="section-title">Recente Wedstrijden</h2></div>`;
    finished.slice(0,5).forEach(m => {
      const res = getMatchResult(m);
      const scorerCounts = {};
      (m.events || []).filter(e => e.type==='goal' && e.team==='home' && !e.ownGoal && e.scorerId).forEach(e => {
        const n = getPlayerName(e.scorerId);
        scorerCounts[n] = (scorerCounts[n] || 0) + 1;
      });
      const scorers = Object.entries(scorerCounts).map(([n, c]) => c > 1 ? `${n} (${c}x)` : n);
      h += `<div class="card match-history-item" onclick="showMatchDetail('${m.id}')">
        <div class="mh-top"><span class="mh-date">${formatDate(m.date)}</span>
          <span class="mh-badge ${res}">${res==='win'?'W':res==='loss'?'V':'G'}</span></div>
        <div class="mh-teams">
          <span class="mh-team home">${DB.teamName}</span>
          <span class="mh-score">${m.scoreHome} – ${m.scoreAway}</span>
          <span class="mh-team away">${m.opponent}</span></div>
        ${scorers.length?`<div class="mh-scorers">⚽ ${scorers.join(', ')}</div>`:''}
      </div>`;
    });
  } else if (DB.players.length >= 5) {
    h += `<div class="empty-state" style="padding-top:10px">
      <div class="empty-icon">&#127942;</div><h3>Klaar om te beginnen</h3><p>Start je eerste wedstrijd!</p></div>`;
  }
  c.innerHTML = h;
}

function startNewMatch() {
  DB.currentMatch = {
    id: 'm' + DB.nextMatchId++,
    date: new Date().toISOString().split('T')[0],
    opponent: '',
    sporthal: '',
    squad: [],
    lineup: [],
    keeper: null,
    captain: null,
    flyingKeeper: false,
    comp: 'comp',
    events: [],
    scoreHome: 0,
    scoreAway: 0,
    half: 1,
    motm: null,
    vlagger: null,
    vlaggerNaam: null,
    status: 'setup'
  };
  saveData(); renderMatchView();
}

function renderMatchSetup(c) {
  const cm = DB.currentMatch;
  c.innerHTML = `<div class="section-header">
      <h2 class="section-title">Nieuwe Wedstrijd</h2>
      <button class="btn btn-secondary btn-sm" onclick="confirmCancelMatch()">Annuleren</button></div>
    <div class="card">
      <div class="form-group"><label>Tegenstander</label>
        <input type="text" id="oppInput" value="${cm.opponent}" placeholder="Teamnaam"></div>
      <div class="form-group"><label>Sporthal</label>
        <select id="hallInput">
          <option value="">— Kies sporthal —</option>
          ${['Stedenwijk','Waterwijk','Haven','Buiten'].map(s => `<option value="${s}" ${cm.sporthal===s?'selected':''}>${s}</option>`).join('')}
        </select></div>
      <div class="form-group"><label>Type</label>
        <select id="compInput">
          <option value="comp" ${cm.comp==='comp'?'selected':''}>Competitie</option>
          <option value="beker" ${cm.comp==='beker'?'selected':''}>Beker</option>
          <option value="friendly" ${cm.comp==='friendly'?'selected':''}>Vriendschappelijk</option>
        </select></div>
      <div class="form-group"><label>Datum</label>
        <input type="date" id="dateInput" value="${cm.date}"></div>
      <button class="btn btn-primary btn-block btn-lg" onclick="proceedToSquad()">Volgende: Selectie &#10145;</button>
    </div>`;
}

function proceedToSquad() {
  const opp = document.getElementById('oppInput').value.trim();
  if (!opp) { document.getElementById('oppInput').focus(); return; }
  DB.currentMatch.opponent = opp;
  DB.currentMatch.sporthal = document.getElementById('hallInput').value.trim();
  DB.currentMatch.comp = document.getElementById('compInput').value;
  DB.currentMatch.date = document.getElementById('dateInput').value;
  DB.currentMatch.status = 'squad';
  saveData(); renderMatchView();
}

function renderMatchSquad(c) {
  const cm = DB.currentMatch;
  const sorted = [...DB.players].sort((a,b) => a.number - b.number);
  let h = `<div class="section-header">
      <h2 class="section-title">Selectie</h2>
      <button class="btn btn-secondary btn-sm" onclick="DB.currentMatch.status='setup';saveData();renderMatchView()">&#8592; Terug</button></div>
    <p style="font-size:0.82rem;color:var(--text-muted);margin-bottom:12px">Wie is aanwezig? (${cm.squad.length} geselecteerd)</p>
    <div class="squad-grid">`;
  sorted.forEach(p => {
    const sel = cm.squad.includes(p.id);
    h += `<div class="squad-player ${sel?'selected':''}" onclick="toggleSquad('${p.id}')">
      ${avatarHTML(p, 'avatar-sm')}
      <span class="sq-name">${p.name}</span>
      ${p.isKeeper?'<span class="sq-badge">GK</span>':''}
    </div>`;
  });
  h += `</div>`;
  ['vlagger', 'zaaldienst'].forEach(taak => {
    const t = TAKEN[taak];
    const naam = taakVan(cm, taak);
    h += `<div class="vlagger-row">
      <div class="vlagger-info">
        <span class="vlagger-label">${t.label}</span>
        <span class="vlagger-naam ${naam ? '' : 'leeg'}">${naam || 'nog niemand'}</span>
      </div>
      <div class="vlagger-acties">
        <button class="btn btn-secondary btn-sm" onclick="openTaakModal('${taak}')" ${cm.squad.length ? '' : 'disabled'}>Kiezen</button>
        <button class="btn btn-secondary btn-sm" onclick="wijsTaakAan('${taak}')" ${cm.squad.length ? '' : 'disabled'} title="Loot onder wie dit seizoen het minst aan de beurt was">&#127922; Wijs aan</button>
      </div>
    </div>`;
  });
  h += `<div style="margin-top:16px">
    <button class="btn btn-primary btn-block btn-lg" onclick="proceedToLineup()" ${cm.squad.length<5?'disabled':''}>
      Volgende: Opstelling &#10145;</button>
    ${cm.squad.length<5?'<p style="font-size:0.78rem;color:var(--text-muted);text-align:center;margin-top:6px">Min. 5 spelers nodig</p>':''}
  </div>`;
  c.innerHTML = h;
}

function toggleSquad(id) {
  const cm = DB.currentMatch;
  const i = cm.squad.indexOf(id);
  if (i >= 0) { cm.squad.splice(i,1); cm.lineup = cm.lineup.filter(l=>l!==id); }
  else cm.squad.push(id);
  saveData(); renderMatchView();
}

function proceedToLineup() {
  const cm = DB.currentMatch;
  const defaultCaptain = cm.squad.find(id => { const p = getPlayer(id); return p && p.isCaptain; });
  if (defaultCaptain && !cm.captain) cm.captain = defaultCaptain;
  cm.status = 'lineup';
  saveData(); renderMatchView();
}

function renderMatchLineup(c) {
  const cm = DB.currentMatch;
  const squad = cm.squad.map(id => getPlayer(id)).filter(Boolean).sort((a,b) => a.number - b.number);
  const keepers = squad.filter(p => p.isKeeper);
  const fieldPlayers = squad.filter(p => !cm.lineup.includes(p.id) || p.id === cm.keeper);

  let h = `<div class="section-header">
      <h2 class="section-title">Opstelling</h2>
      <button class="btn btn-secondary btn-sm" onclick="DB.currentMatch.status='squad';saveData();renderMatchView()">&#8592; Terug</button></div>`;

  // Keeper selection
  h += `<div class="lineup-role-section">
    <div class="lineup-role-label">&#129351; Keeper</div>`;
  keepers.forEach(p => {
    h += `<div class="lineup-player ${cm.keeper===p.id?'selected':''}" onclick="selectKeeper('${p.id}')">
      ${avatarHTML(p, 'avatar-sm')} <span class="lp-name">${p.name}</span>
      ${cm.keeper===p.id?'<span class="lp-role">Keeper</span>':''}
    </div>`;
  });
  if (keepers.length === 0) h += `<p style="font-size:0.82rem;color:var(--text-muted)">Geen keepers in selectie</p>`;
  h += `</div>`;

  // Captain selection
  h += `<div class="lineup-role-section">
    <div class="lineup-role-label">© Aanvoerder</div>`;
  squad.forEach(p => {
    h += `<div class="lineup-player ${cm.captain===p.id?'selected':''}" onclick="selectCaptain('${p.id}')">
      ${avatarHTML(p, 'avatar-sm')} <span class="lp-name">${p.name}</span>
      ${cm.captain===p.id?'<span class="lp-role">Aanvoerder</span>':''}
    </div>`;
  });
  h += `</div>`;

  // Field starters (4 veldspelers, excl. keeper)
  const available = squad.filter(p => p.id !== cm.keeper);
  const fieldLineup = cm.lineup.filter(id => id !== cm.keeper);
  h += `<div class="lineup-role-section">
    <div class="lineup-role-label">Veldspelers (${fieldLineup.length}/4)</div>`;
  available.forEach(p => {
    const isSel = fieldLineup.includes(p.id);
    h += `<div class="lineup-player ${isSel?'selected':''}" onclick="toggleFieldPlayer('${p.id}')">
      ${avatarHTML(p, 'avatar-sm')} <span class="lp-name">${p.name}</span>
      ${isSel?'<span class="lp-role">Basis</span>':''}
    </div>`;
  });
  h += `</div>`;

  const ready = cm.keeper && cm.captain && fieldLineup.length === 4;

  if (ready) {
    const kp = getPlayer(cm.keeper);
    const fl = fieldLineup.map(id => getPlayer(id)).filter(Boolean);
    const positions = [
      { left: '25%', top: '18%' },
      { left: '75%', top: '18%' },
      { left: '38%', top: '50%' },
      { left: '62%', top: '50%' },
    ];
    h += `<div class="pitch"><div class="pitch-goal"></div>`;
    if (kp) {
      h += `<div class="pitch-player" style="left:50%;top:82%">
        <div class="pitch-dot keeper">${kp.number}</div>
        <div class="pitch-label">${kp.name}</div>
      </div>`;
    }
    fl.forEach((p, i) => {
      const pos = positions[i] || positions[0];
      h += `<div class="pitch-player" style="left:${pos.left};top:${pos.top}">
        <div class="pitch-dot">${p.number}</div>
        <div class="pitch-label">${p.name}</div>
      </div>`;
    });
    h += `</div>`;
  }

  h += `<button class="btn btn-primary btn-block btn-lg" onclick="startMatch()" ${ready?'':'disabled'}>
    &#9917; Start Wedstrijd</button>`;
  c.innerHTML = h;
}

function selectKeeper(id) {
  DB.currentMatch.keeper = id;
  DB.currentMatch.lineup = DB.currentMatch.lineup.filter(l => l !== id);
  if (!DB.currentMatch.lineup.includes(id)) {
    // keeper is separate from field lineup
  }
  saveData(); renderMatchView();
}
function selectCaptain(id) { DB.currentMatch.captain = id; saveData(); renderMatchView(); }
function toggleFieldPlayer(id) {
  const cm = DB.currentMatch;
  const fl = cm.lineup.filter(l => l !== cm.keeper);
  const i = fl.indexOf(id);
  if (i >= 0) { cm.lineup = cm.lineup.filter(l => l !== id); }
  else if (fl.length < 4) { cm.lineup.push(id); }
  saveData(); renderMatchView();
}

function startMatch() {
  const cm = DB.currentMatch;
  if (!cm.lineup.includes(cm.keeper)) cm.lineup.unshift(cm.keeper);
  cm.status = 'half1';
  cm.half = 1;
  timerSeconds = 20 * 60;
  timerRunning = false;
  persistTimer(false);
  saveData(); renderMatchView();
}

// =========================================================
// MATCH LIVE
// =========================================================
function renderMatchLive(c) {
  const cm = DB.currentMatch;
  const halfLabel = cm.half === 1 ? '1e Helft' : '2e Helft';

  let h = `<div class="match-header">
    <div class="match-half-label">${halfLabel}${cm.sporthal ? ' — ' + cm.sporthal : ''}</div>
    <div class="match-timer" id="timerDisplay">${formatTimer(timerSeconds)}</div>
    <div class="timer-controls">
      ${timerRunning
        ? `<button class="timer-btn" onclick="stopTimer()" title="Pauze">&#10074;&#10074;</button>`
        : `<button class="timer-btn" onclick="startTimer()" title="Start">&#9654;</button>`}
      <button class="timer-btn" onclick="adjustTimer(-60)" style="font-size:0.72rem">-1</button>
      <button class="timer-btn" onclick="adjustTimer(60)" style="font-size:0.72rem">+1</button>
      <button class="timer-btn" onclick="endHalfEarly()" style="font-size:0.72rem">&#9724;</button>
    </div>
    <div style="margin-top:16px"><div class="match-score-row">
      <span class="match-team-name home${teamNameClass(DB.teamName)}">${DB.teamName}</span>
      <span class="match-score">${cm.scoreHome} – ${cm.scoreAway}</span>
      <span class="match-team-name away${teamNameClass(cm.opponent)}">${cm.opponent}</span>
    </div></div>
    <div id="penaltyStrip">${penaltyStripHTML()}</div>
  </div>

  <div class="match-actions">
    <button class="action-btn goal-btn" onclick="openGoalModal()">&#9917; Goal</button>
    <button class="action-btn card-btn" onclick="openCardModal()">Kaart</button>
    <button class="action-btn fk-btn ${cm.flyingKeeper?'active-fk':''}" onclick="toggleFlyingKeeper()" title="Power Play">${ppIconHTML()} Power Play</button>
  </div>`;

  if (cm.events.length > 0) {
    h += `<div class="card"><div class="timeline">`;
    [...cm.events].sort((a,b) => a.minute - b.minute).forEach((ev, idx) => {
      const evIdx = cm.events.indexOf(ev);
      h += renderTimelineEvent(ev, cm, evIdx);
    });
    h += `</div></div>`;
  }

  h += `<div style="text-align:center;margin-top:20px">
    <button class="btn btn-secondary btn-sm" onclick="openMatchMenu()">&#8942; Opties</button></div>`;
  c.innerHTML = h;
}

function adjustTimer(s) { timerSeconds = Math.max(0, Math.min(20*60, timerSeconds+s)); persistTimer(); renderMatchView(); }
function endHalfEarly() { stopTimer(); timerSeconds = 0; persistTimer(); onTimerEnd(); }

function toggleFlyingKeeper() {
  const cm = DB.currentMatch;
  if (cm.flyingKeeper) {
    cm.flyingKeeper = false;
    cm.events.push({ type:'flyingkeeper', minute:getCurrentMinute(), half:cm.half, active:false });
    saveData(); renderMatchView();
    showToast('Power Play uit');
  } else {
    openFlyingKeeperModal();
  }
}

function openFlyingKeeperModal() {
  const cm = DB.currentMatch;
  const squad = cm.squad.map(id => getPlayer(id)).filter(Boolean).filter(p => p.id !== cm.keeper).sort((a,b) => a.number - b.number);
  let h = `<h3>${ppIconHTML()} Power Play</h3>
    <p style="font-size:0.82rem;color:var(--text-muted);text-align:center;margin-bottom:16px">Wie gaat als keeper meevoetballen?</p>`;
  squad.forEach(p => {
    h += `<div class="player-select-item" onclick="activateFlyingKeeper('${p.id}')">
      ${avatarHTML(p, 'avatar-sm')} <span style="font-weight:600">${p.name}</span></div>`;
  });
  h += `<button class="modal-cancel" onclick="closeModal()">Annuleren</button>`;
  openModal(h);
}

function activateFlyingKeeper(playerId) {
  const cm = DB.currentMatch;
  cm.flyingKeeper = true;
  cm.events.push({ type:'flyingkeeper', minute:getCurrentMinute(), half:cm.half, active:true, playerId });
  saveData(); closeModal(); renderMatchView();
  showToast(`Power Play: ${getPlayerName(playerId)}`);
}

function openMatchMenu() {
  openModal(`<h3>Wedstrijd Opties</h3>
    <button class="btn btn-danger-outline btn-block" style="margin-bottom:8px" onclick="closeModal();confirmCancelMatch()">Wedstrijd annuleren</button>
    <button class="modal-cancel" onclick="closeModal()">Sluiten</button>`);
}

function confirmCancelMatch() {
  openModal(`<h3>Wedstrijd Annuleren</h3>
    <p style="text-align:center;margin-bottom:20px">Weet je het zeker? Alle data van deze wedstrijd gaat verloren.</p>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline btn-block" onclick="closeModal()">Nee, ga door</button>
      <button class="btn btn-danger-outline btn-block" onclick="closeModal();cancelMatch()">Ja, annuleren</button>
    </div>`);
}
function cancelMatch() { DB.currentMatch = null; stopTimer(); saveData(); renderMatchView(); }

function renderTimelineEvent(ev, m, evIdx) {
  const clickable = evIdx !== undefined && DB.currentMatch;
  const clickAttr = clickable ? `onclick="openEventEditModal(${evIdx})" style="cursor:pointer"` : '';
  if (ev.type === 'goal') {
    const isOurs = ev.team === 'home';
    const isOwnGoal = ev.ownGoal;
    const scorer = isOurs ? getPlayer(ev.scorerId) : null;
    let detail = '';
    if (isOwnGoal) {
      detail = `<strong>Eigen goal</strong>`;
    } else if (isOurs && (scorer || ev.scorerNaam)) {
      // scorerNaam vangt oud-spelers op die geen speler-id meer hebben.
      detail = `<strong>${scorer ? scorer.name : ev.scorerNaam}</strong>`;
      if (ev.assistId) detail += ` <span class="sub-text">(${getPlayerName(ev.assistId)})</span>`;
    } else {
      detail = `<strong>${m.opponent}</strong>`;
    }
    const cls = isOwnGoal ? 'own-goal' : (!isOurs ? 'opponent-goal' : '');
    return `<div class="timeline-event ${cls}" ${clickAttr}>
      <span class="timeline-minute">${ev.minute != null ? ev.minute + "'" : '–'}</span>
      <span class="timeline-icon">${isOwnGoal ? '⚽' : '⚽'}</span>
      <span class="timeline-detail">${detail}</span>
      <span class="timeline-score">${ev.scoreAfter||''}</span>
    </div>`;
  }
  if (ev.type === 'card') {
    const icons = { green: '🟢', yellow: '🟡', red: '🔴' };
    const labels = { green: 'Groen (2 min)', yellow: 'Geel (5 min)', red: 'Rood' };
    return `<div class="timeline-event" ${clickAttr}>
      <span class="timeline-minute">${ev.minute != null ? ev.minute + "'" : '–'}</span>
      <span class="timeline-icon">${icons[ev.cardType]||''}</span>
      <span class="timeline-detail"><strong>${getPlayer(ev.playerId) ? getPlayerName(ev.playerId) : (ev.playerNaam || '?')}</strong> <span class="sub-text">${labels[ev.cardType]||''}</span></span>
      <span class="timeline-score"></span>
    </div>`;
  }
  if (ev.type === 'flyingkeeper') {
    return `<div class="timeline-event" ${clickAttr}>
      <span class="timeline-minute">${ev.minute != null ? ev.minute + "'" : '–'}</span>
      <span class="timeline-icon">${ppIconHTML('pp-sm')}</span>
      <span class="timeline-detail"><span class="sub-text">${ev.active ? 'Power Play: <strong>'+getPlayerName(ev.playerId)+'</strong>' : 'Power Play uit'}</span></span>
      <span class="timeline-score"></span>
    </div>`;
  }
  return '';
}

let goalState = { team:null, scorerId:null, assistId:null, ownGoal:false };

function openGoalModal() { goalState = { team:null, scorerId:null, assistId:null, ownGoal:false }; renderGoalModal(); }

function renderGoalModal() {
  const cm = DB.currentMatch;
  const squad = cm.squad.map(id => getPlayer(id)).filter(Boolean).sort((a,b) => a.number - b.number);
  let h = `<h3>&#9917; Goal Registreren</h3>
    <p style="font-size:0.82rem;color:var(--text-muted);text-align:center;margin-bottom:16px">Minuut ${getCurrentMinute()}'</p>

    <label>Wie scoort?</label>
    <div class="team-select">
      <div class="team-option ${goalState.team==='home'?'selected-home':''}" onclick="setGoalTeam('home')">
        <h4>${DB.teamName}</h4><span style="font-size:0.78rem;color:var(--text-muted)">Wij</span></div>
      <div class="team-option ${goalState.team==='away'?'selected-away':''}" onclick="setGoalTeam('away')">
        <h4>${cm.opponent}</h4><span style="font-size:0.78rem;color:var(--text-muted)">Zij</span></div>
    </div>`;

  if (goalState.team === 'home') {
    h += `<div style="margin-bottom:14px">
      <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;padding:10px 12px;border:2px solid ${goalState.ownGoal?'var(--card-red)':'var(--border)'};border-radius:var(--radius-sm);background:${goalState.ownGoal?'var(--card-red-bg)':'var(--surface)'};max-width:100%;box-sizing:border-box">
        <input type="checkbox" ${goalState.ownGoal?'checked':''} onchange="toggleOwnGoal()" style="flex-shrink:0">
        <span style="font-weight:700;color:${goalState.ownGoal?'var(--card-red)':'var(--text)'}">Eigen goal</span>
      </label></div>`;

    if (goalState.ownGoal) {
      // No player selection needed for own goals
    } else {
      h += `<label>Doelpuntenmaker</label><div style="margin-bottom:16px">`;
      squad.forEach(p => {
        h += `<div class="player-select-item ${goalState.scorerId===p.id?'selected':''}" onclick="setGoalScorer('${p.id}')">
          ${avatarHTML(p, 'avatar-sm')} <span style="font-weight:600">${p.name}</span></div>`;
      });
      h += `</div>`;

      if (goalState.scorerId) {
        h += `<label>Assist (optioneel)</label><div style="margin-bottom:16px">
          <div class="player-select-item ${goalState.assistId===null?'selected':''}" onclick="setGoalAssist(null)">
            <div class="avatar avatar-sm" style="background:var(--text-muted)">–</div>
            <span style="font-weight:600">Geen assist</span></div>`;
        squad.filter(p => p.id !== goalState.scorerId).forEach(p => {
          h += `<div class="player-select-item ${goalState.assistId===p.id?'selected':''}" onclick="setGoalAssist('${p.id}')">
            ${avatarHTML(p, 'avatar-sm')} <span style="font-weight:600">${p.name}</span></div>`;
        });
        h += `</div>`;
      }
    }
  }

  const canSave = goalState.team === 'away' || (goalState.team === 'home' && (goalState.ownGoal || goalState.scorerId));
  h += `<button class="btn btn-primary btn-block btn-lg" onclick="saveGoal()" ${canSave?'':'disabled'}>Bevestig Goal</button>
    <button class="modal-cancel" onclick="closeModal()">Annuleren</button>`;
  openModal(h);
}

function setGoalTeam(t) { goalState.team = t; goalState.scorerId = null; goalState.assistId = null; goalState.ownGoal = false; renderGoalModal(); }
function setGoalScorer(id) { goalState.scorerId = id; goalState.assistId = null; renderGoalModal(); }
function setGoalAssist(id) { goalState.assistId = id; renderGoalModal(); }
function toggleOwnGoal() { goalState.ownGoal = !goalState.ownGoal; goalState.scorerId = null; goalState.assistId = null; renderGoalModal(); }

function saveGoal() {
  const cm = DB.currentMatch;
  const minute = getCurrentMinute();
  const isOwnGoal = goalState.team === 'home' && goalState.ownGoal;

  if (goalState.team === 'away') { cm.scoreAway++; }
  else { cm.scoreHome++; }

  const ev = {
    type:'goal', minute, half:cm.half,
    team: 'home',
    ownGoal: isOwnGoal,
    scorerId: (!isOwnGoal && goalState.team==='home') ? goalState.scorerId : null,
    assistId: (!isOwnGoal && goalState.team==='home') ? goalState.assistId : null,
    scoreAfter: `${cm.scoreHome}–${cm.scoreAway}`
  };
  if (goalState.team === 'away') ev.team = 'away';
  cm.events.push(ev);

  const savedTeam = goalState.team;
  saveData(); closeModal(); renderMatchView();

  if (!isOwnGoal && goalState.team === 'home') showGoalCelebration(ev, cm);

  const evIdx = cm.events.length - 1;
  showToast(`${isOwnGoal ? 'Eigen goal!' : 'Goal!'} ${cm.scoreHome}–${cm.scoreAway}`, () => {
    cm.events.splice(evIdx, 1);
    if (savedTeam === 'away') cm.scoreAway--;
    else cm.scoreHome--;
    saveData(); renderMatchView();
  });
}

// =========================================================
function showGoalCelebration(ev, cm) {
  if (ev.ownGoal || ev.team === 'away') return;
  const scorer = getPlayer(ev.scorerId);
  if (!scorer) return;
  const el = document.createElement('div');
  el.className = 'goal-celebration';
  el.innerHTML = `
    <div class="celeb-photo">${scorer.number}</div>
    <div class="celeb-label">Goal!</div>
    <div class="celeb-name">${scorer.name}</div>
    <div class="celeb-number">#${scorer.number}</div>
    <div class="celeb-minute">${ev.minute}'</div>
    <div class="celeb-score">${cm.scoreHome} – ${cm.scoreAway}</div>`;
  document.body.appendChild(el);
  el.addEventListener('click', () => dismissCelebration(el));
  setTimeout(() => dismissCelebration(el), 2500);
}
function dismissCelebration(el) {
  if (el.classList.contains('fade-out')) return;
  el.classList.add('fade-out');
  setTimeout(() => el.remove(), 400);
}

  const cm = DB.currentMatch;
  if (!cm) return;
  const ev = cm.events[evIdx];
  ev.minute = parseInt(document.getElementById('editMinute').value) || ev.minute;

    ev.scorerId = document.getElementById('editScorer').value;
    const assist = document.getElementById('editAssist').value;
    ev.assistId = assist || null;
  } else if (ev.type === 'card') {
    ev.playerId = document.getElementById('editCardPlayer').value;
    ev.cardType = document.getElementById('editCardType').value;
  }
  saveData(); closeModal(); renderMatchView();
}
function deleteEvent(evIdx) {
  const cm = DB.currentMatch;
  if (!cm) return;
  const ev = cm.events[evIdx];
  if (ev && ev.type === 'goal') {
    if (ev.team === 'home') cm.scoreHome = Math.max(0, cm.scoreHome - 1);
    else cm.scoreAway = Math.max(0, cm.scoreAway - 1);
  }
  cm.events.splice(evIdx, 1);
  saveData(); closeModal(); renderMatchView();
}

function setCardType(t) { cardState.cardType = t; renderCardModal(); }

// Straftijd loopt op de wedstrijdklok, niet op de echte klok: een onderbreking
// telt dus niet mee. De straf wordt vastgelegd als de klokstand waarop hij
// afloopt, zodat hij een herstart overleeft zonder elke seconde op te slaan.
const PENALTY_SECONDS = { green: 2 * 60, yellow: 5 * 60 };

// Een straf start niet vanzelf: de klok gaat pas lopen bij de hervatting, dus
// je drukt zelf op play. Zolang hij loopt hangt hij aan de wedstrijdklok, dus
// een onderbreking telt niet mee en een herstart verandert niets.
function penaltyRunning(p) { return p.endsAtClock != null; }
function penaltyRemaining(p) {
  if (penaltyRunning(p)) return Math.max(0, timerSeconds - p.endsAtClock);
  return Math.max(0, p.remaining || 0);
}
function startPenalty(playerId) {
  const p = toArray(DB.currentMatch && DB.currentMatch.penalties).find(x => x.playerId === playerId);
  if (!p || penaltyRunning(p)) return;
  p.endsAtClock = timerSeconds - penaltyRemaining(p);
  p.remaining = null;
  saveData(); renderMatchView();
}
function pausePenalty(playerId) {
  const p = toArray(DB.currentMatch && DB.currentMatch.penalties).find(x => x.playerId === playerId);
  if (!p || !penaltyRunning(p)) return;
  p.remaining = penaltyRemaining(p);
  p.endsAtClock = null;
  saveData(); renderMatchView();
}

// Uitsluitingen komen uit de events zelf, niet uit een aparte lijst: zo blijft
// het kloppen als een rode kaart via de tijdlijn wordt teruggedraaid.
function excludedPlayers() {
  const cm = DB.currentMatch;
  if (!cm) return [];
  return [...new Set(toArray(cm.events)
    .filter(e => e.type === 'card' && e.cardType === 'red' && e.playerId)
    .map(e => e.playerId))];
}

function penaltyStripHTML() {
  const actief = activePenalties();
  const uitgesloten = excludedPlayers();
  if (!actief.length && !uitgesloten.length) return '';
  const minder = actief.length + uitgesloten.length;
  return `<div class="penalty-bar">
    ${uitgesloten.map(id => {
      const speler = getPlayer(id);
      return `<span class="penalty-chip red">
        <span class="penalty-card"></span>
        <span class="penalty-name">${speler ? '#' + speler.number + ' ' + speler.name : getPlayerName(id)}</span>
        <span class="penalty-time">UIT</span>
      </span>`;
    }).join('')}
    ${actief.map(p => {
      const speler = getPlayer(p.playerId);
      const loopt = penaltyRunning(p);
      return `<span class="penalty-chip ${p.type}${loopt ? ' running' : ''}">
        <span class="penalty-card"></span>
        <span class="penalty-name">${speler ? '#' + speler.number + ' ' + speler.name : getPlayerName(p.playerId)}</span>
        <span class="penalty-time">${formatTimer(penaltyRemaining(p))}</span>
        <button class="penalty-btn" onclick="${loopt ? `pausePenalty('${p.playerId}')` : `startPenalty('${p.playerId}')`}"
          title="${loopt ? 'Pauze' : 'Start straftijd'}">${loopt ? '&#10074;&#10074;' : '&#9654;'}</button>
        <button class="penalty-btn release" onclick="releasePenalty('${p.playerId}')" title="Nu vrijgeven">&#10005;</button>
      </span>`;
    }).join('')}
    <span class="penalty-note">${minder} man minder</span>
  </div>`;
}

function renderPenaltyStrip() {
  const el = document.getElementById('penaltyStrip');
  if (el) el.innerHTML = penaltyStripHTML();
}
function activePenalties() {
  const cm = DB.currentMatch;
  if (!cm) return [];
  return toArray(cm.penalties).filter(p => penaltyRemaining(p) > 0);
}
function releasePenalty(playerId) {
  const cm = DB.currentMatch;
  if (!cm) return;
  cm.penalties = toArray(cm.penalties).filter(p => p.playerId !== playerId);
  saveData(); renderMatchView();
}
// Wordt elke seconde door de klok aangeroepen; meldt wie er weer in mag.
function checkPenalties() {
  const cm = DB.currentMatch;
  if (!cm || !toArray(cm.penalties).length) return;
  const afgelopen = cm.penalties.filter(p => penaltyRunning(p) && penaltyRemaining(p) <= 0);
  if (!afgelopen.length) return;
  cm.penalties = cm.penalties.filter(p => !afgelopen.includes(p));
  saveData(); renderMatchView();
  afgelopen.forEach(p => showToast(`${getPlayerName(p.playerId)} mag er weer in`));
}

function saveCard() {
  const cm = DB.currentMatch;
  const ev = { type:'card', minute:getCurrentMinute(), half:cm.half, playerId:cardState.playerId, cardType:cardState.cardType };
  cm.events.push(ev);

  const straf = PENALTY_SECONDS[ev.cardType];
  if (straf) {
    cm.penalties = toArray(cm.penalties).filter(p => p.playerId !== ev.playerId);
    cm.penalties.push({ playerId: ev.playerId, type: ev.cardType, remaining: straf, endsAtClock: null });
  }
  saveData(); closeModal(); renderMatchView();

  const labels = { green:'Groene kaart', yellow:'Gele kaart', red:'Rode kaart' };
  const evIdx = cm.events.length - 1;
  showToast(`${labels[ev.cardType]} — ${getPlayerName(ev.playerId)}`, () => {
    cm.events.splice(evIdx, 1);
    if (straf) cm.penalties = toArray(cm.penalties).filter(p => p.playerId !== ev.playerId);
    saveData(); renderMatchView();
  });
}

function renderMatchMOTM(c) {

  const squad = cm.squad.map(id => getPlayer(id)).filter(Boolean).sort((a,b) => a.number - b.number);

  let h = `<div class="match-header">
    <div class="match-half-label">Einde Wedstrijd</div>
    <div style="margin-top:8px"><div class="match-score-row">
      <span class="match-team-name home${teamNameClass(DB.teamName)}">${DB.teamName}</span>
      <span class="match-score">${cm.scoreHome} – ${cm.scoreAway}</span>
      <span class="match-team-name away${teamNameClass(cm.opponent)}">${cm.opponent}</span>
    </div></div>
  </div>
  <div class="card motm-section">
    <h3>&#11088; Man of the Match</h3><p>Kies de beste speler van de wedstrijd</p>
    <div class="motm-grid">`;
  squad.forEach(p => {
    h += `<div class="motm-player ${cm.motm===p.id?'selected':''}" onclick="selectMOTM('${p.id}')">
      ${avatarHTML(p)} <div class="motm-name">${p.name}</div></div>`;
  });
  h += `</div><div style="display:flex;gap:8px">
    <button class="btn btn-outline btn-block" onclick="skipMOTM()">Overslaan</button>
    <button class="btn btn-primary btn-block" onclick="finishMatch()" ${!cm.motm?'disabled':''}>Opslaan</button>
  </div></div>`;

  if (cm.events.length > 0) {
    h += `<div class="card" style="margin-top:12px"><h3 style="font-size:0.88rem;margin-bottom:12px">Wedstrijdverloop</h3><div class="timeline">`;
    [...cm.events].sort((a,b) => a.minute - b.minute).forEach(ev => { h += renderTimelineEvent(ev, cm); });
    h += `</div></div>`;
  }
  c.innerHTML = h;
}

function selectMOTM(id) { DB.currentMatch.motm = id; saveData(); renderMatchView(); }
function skipMOTM() { DB.currentMatch.motm = null; finishMatch(); }
function finishMatch() {
  const cm = DB.currentMatch;
  cm.status = 'finished';
  const saved = JSON.parse(JSON.stringify(cm));
  DB.matches.push(saved);
  DB.currentMatch = null;
  stopTimer(); saveData(); renderMatchView();
  showToast('Wedstrijd opgeslagen!', () => shareMatchCard(saved.id), 'Delen');
}

  }

  if ((m.assistsNamen || []).length) {
    h += `<div class="card"><h3 style="font-size:0.88rem;margin-bottom:8px">Assists</h3>
      <p style="font-size:0.85rem;color:var(--text)">${
        m.assistsNamen.map(([naam, n]) => `${naam}${n > 1 ? ` (${n}x)` : ''}`).join(', ')
      }</p>
      <p style="font-size:0.72rem;color:var(--text-muted);margin-top:6px">
        Uit de seizoensadministratie; niet te herleiden naar een specifiek doelpunt.</p></div>`;
  }

  const taakRegels = ['vlagger', 'zaaldienst']
    .map(taak => [TAKEN[taak], taakVan(m, taak)])
    .filter(([, naam]) => naam);
  if (taakRegels.length) {
    h += `<div class="card">`;
    taakRegels.forEach(([t, naam], i) => {
      h += `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px${i ? ';margin-top:10px' : ''}">
        <span style="font-size:0.82rem;color:var(--text-muted)">${t.label}</span>
        <strong style="font-size:0.9rem;color:var(--navy)">${naam}</strong>
      </div>`;
    });
    h += `</div>`;
  }

  // Oud-spelers hebben geen speler-id meer; die staan alleen als naam.
  // Bij historische wedstrijden staat de selectie als namen, want een deel van
  // die spelers zit niet meer in de app en heeft dus geen speler-id.
  if ((m.squadNamen || []).length) {
    h += `<div class="card"><h3 style="font-size:0.88rem;margin-bottom:8px">Selectie</h3>
      <p style="font-size:0.85rem;line-height:1.6">${m.squadNamen.join(', ')}</p></div>`;
  } else if (m.squad && m.squad.length) {
    h += `<div class="card"><h3 style="font-size:0.88rem;margin-bottom:12px">Selectie</h3>`;
    m.squad.map(id => getPlayer(id)).filter(Boolean).sort((a,b) => a.number - b.number).forEach(p => {
      const roles = [];
      if (m.keeper === p.id) roles.push('Keeper');
      if (m.lineup && m.lineup.includes(p.id) && m.keeper !== p.id) roles.push('Basis');
      if (m.captain === p.id) roles.push('Aanvoerder');
      h += `<div class="player-item" onclick="closeMatchDetail();showPlayerProfile('${p.id}')" style="cursor:pointer">${avatarHTML(p, 'avatar-sm')}
        <div class="player-info"><div class="player-name">${p.name}</div>
        ${roles.length?`<div class="player-badges">${roles.map(r=>`<span class="player-badge">${r}</span>`).join('')}</div>`:''}</div></div>`;
    });
    h += `</div>`;
  }
  h += `<button class="btn btn-danger-outline btn-block" style="margin-top:24px" onclick="deleteFinishedMatch('${matchId}')">Wedstrijd verwijderen</button>`;
  h += `</div>`;
  document.getElementById('matchDetailContent').innerHTML = h;
  document.getElementById('matchDetail').classList.add('open');
  document.body.classList.add('overlay-open');
  document.getElementById('matchDetail').scrollTop = 0;
}
function closeMatchDetail() {
  document.getElementById('matchDetail').classList.remove('open');
  if (!document.getElementById('playerProfile').classList.contains('open')) document.body.classList.remove('overlay-open');
}
function deleteFinishedMatch(matchId) {
  const m = DB.matches.find(x => x.id === matchId);
  if (!m) return;
  openModal(`<h3>Wedstrijd Verwijderen</h3>
    <p style="text-align:center;margin-bottom:4px"><strong>${DB.teamName} ${m.scoreHome} – ${m.scoreAway} ${m.opponent}</strong></p>
    <p style="text-align:center;color:var(--text-muted);margin-bottom:20px">Dit kan niet ongedaan worden gemaakt.</p>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline btn-block" onclick="closeModal()">Annuleren</button>
      <button class="btn btn-danger-outline btn-block" onclick="DB.matches=DB.matches.filter(x=>x.id!=='${matchId}');saveData();closeModal();closeMatchDetail();renderPage(document.querySelector('.bottomnav .active')?.dataset.page||'pageMatch')">Verwijderen</button>
    </div>`);
}

// =========================================================
// STATS
// =========================================================
let selectedStatsSeason = 'current';

// De tabbladen volgen de data: elk seizoen dat in HISTORY zit of waar
// wedstrijden van in de DB staan krijgt er vanzelf een. Zo verschijnt het
// huidige seizoen na de jaarwissel automatisch als historisch tabblad.
function statsSeasons() {
  const uitData = toArray(DB.matches)
    .filter(m => m.status === 'finished')
    .map(m => matchSeason(m));
  const keys = [...new Set([...Object.keys(HISTORY).filter(k => k !== 'all'), ...uitData])]
    .filter(k => k && k !== DB.season)
    .sort()
    .reverse();
  return [
    { key: 'current', label: DB.season },
    ...keys.map(k => ({ key: k, label: k })),
    { key: 'all', label: 'All-time' },
  ];
}

function renderStatsPage() {
  const c = document.getElementById('statsContent');
  const seasons = statsSeasons();
  if (!seasons.some(s => s.key === selectedStatsSeason)) selectedStatsSeason = 'current';

  let h = `<div class="season-tabs">`;
  seasons.forEach(s => {
    h += `<button class="season-tab ${s.key===selectedStatsSeason?'active':''}" onclick="selectedStatsSeason='${s.key}';renderStatsPage()">${s.label}</button>`;
  });
  h += `</div>`;

  // HISTORY gaat voor waar het bestaat: die seizoenen zijn met de hand
  // ingevoerd en bevatten eindstand, poulestand en spelerstotalen die niet uit
  // de geseede wedstrijden te halen zijn. Seizoenen die je zelf in de app hebt
  // gespeeld worden uit de wedstrijden zelf berekend.
  const seizoen = selectedStatsSeason === 'current' ? DB.season : selectedStatsSeason;
  const uitEigenWedstrijden = selectedStatsSeason === 'current' ||
    (selectedStatsSeason !== 'all' && !HISTORY[selectedStatsSeason]);

  if (uitEigenWedstrijden) {
    h += renderSeasonStats(seizoen);
    c.innerHTML = h;
    setupSeasonLeaderboard(seizoen);
  } else {
    h += renderHistoricalStats(selectedStatsSeason);
    c.innerHTML = h;
    setupHistoricalLeaderboard(selectedStatsSeason);
  }
}

function renderSeasonStats(season) {
  const finished = seasonMatches(season);
  if (!finished.length) {
    return `<div class="empty-state"><div class="empty-icon">&#128202;</div>
      <h3>Nog geen statistieken</h3><p>Speel je eerste wedstrijd</p></div>`;
  }

  let totalFor=0, totalAgainst=0, wins=0, draws=0, losses=0, cleanSheets=0;
  finished.forEach(m => {
    totalFor += m.scoreHome; totalAgainst += m.scoreAway;
    if (m.scoreHome > m.scoreAway) wins++;
    else if (m.scoreHome < m.scoreAway) losses++;
    else draws++;
    if (m.scoreAway === 0) cleanSheets++;
  });

  const n = finished.length;
  let h = `<div class="stat-grid">
    <div class="stat-box"><div class="stat-value">${n}</div><div class="stat-label">Gespeeld</div></div>
    <div class="stat-box"><div class="stat-value">${wins}</div><div class="stat-label">Gewonnen</div></div>
    <div class="stat-box"><div class="stat-value">${draws}</div><div class="stat-label">Gelijk</div></div>
    <div class="stat-box"><div class="stat-value">${losses}</div><div class="stat-label">Verloren</div></div>
  </div>
  <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
    <div class="stat-box"><div class="stat-value">${totalFor}</div><div class="stat-label">Goals voor</div></div>
    <div class="stat-box"><div class="stat-value">${totalAgainst}</div><div class="stat-label">Goals tegen</div></div>
    <div class="stat-box"><div class="stat-value">${cleanSheets}</div><div class="stat-label">Clean sheets</div></div>
  </div>
  <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
    <div class="stat-box"><div class="stat-value">${(totalFor/n).toFixed(1)}</div><div class="stat-label">Gem. voor</div></div>
    <div class="stat-box"><div class="stat-value">${(totalAgainst/n).toFixed(1)}</div><div class="stat-label">Gem. tegen</div></div>
    <div class="stat-box"><div class="stat-value">${((totalFor-totalAgainst)/n).toFixed(1)}</div><div class="stat-label">Doelsaldo</div></div>
  </div>`;

  const phaseKeys = ['0-5','5-10','10-15','15-20','20-25','25-30','30-35','35-40'];
  const phases = {};
  phaseKeys.forEach(k => { phases[k] = { for:0, against:0 }; });
  finished.forEach(m => {
    (m.events || []).filter(e => e.type==='goal' && e.minute != null).forEach(e => {
      const min = e.minute;
      let phase;
      if (min <= 5) phase = '0-5';
      else if (min <= 10) phase = '5-10';
      else if (min <= 15) phase = '10-15';
      else if (min <= 20) phase = '15-20';
      else if (min <= 25) phase = '20-25';
      else if (min <= 30) phase = '25-30';
      else if (min <= 35) phase = '30-35';
      else phase = '35-40';
      if (e.team === 'home' && !e.ownGoal) phases[phase].for++;
      else if (e.team === 'away') phases[phase].against++;
      else if (e.ownGoal) phases[phase].for++;
    });
  });

  h += `<div class="card" style="margin-top:4px"><h3 style="font-size:0.88rem;margin-bottom:12px">Goals per fase</h3>
    <div style="display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 12px;font-size:0.82rem">
      <span style="font-weight:700;color:var(--text-muted)">Fase</span>
      <span style="font-weight:700;color:var(--text-muted)">Voor</span>
      <span style="font-weight:700;color:var(--text-muted)">Tegen</span>`;
  Object.entries(phases).forEach(([phase, data]) => {
    h += `<span style="font-weight:600">${phase}'</span>
      <span style="font-weight:700;color:var(--navy)">${data.for}</span>
      <span style="font-weight:700">${data.against}</span>`;
  });
  h += `</div></div>`;

  h += `<div class="section-header" style="margin-top:8px"><h2 class="section-title">Spelers</h2>
    <button class="share-btn-sm" onclick="shareStatsCard()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      Delen</button></div>
    <div class="tab-row" id="statTabs">
      <button class="tab-btn active" data-sort="goals">Goals</button>
      <button class="tab-btn" data-sort="assists">Assists</button>
      <button class="tab-btn" data-sort="motm">MotM</button>
      <button class="tab-btn" data-sort="cards">Kaarten</button>
      <button class="tab-btn" data-sort="vlagger">Vlaggen</button>
      <button class="tab-btn" data-sort="zaaldienst">Zaaldienst</button>
    </div>
    <div class="card" id="leaderboard"></div>`;

  const sorted = [...finished].sort((a,b) => new Date(b.date) - new Date(a.date));
  h += `<div class="section-header" style="margin-top:16px"><h2 class="section-title">Uitslagen</h2></div>
    <div class="card">`;
  sorted.forEach(m => {
    const d = new Date(m.date);
    const res = getMatchResult(m);
    const badge = matchTypeHTML(m.comp);
    h += `<div class="history-result" onclick="showMatchDetail('${m.id}')" style="cursor:pointer">
      <span class="hr-date">${d.getDate()} ${d.toLocaleDateString('nl-NL',{month:'short'})}</span>
      <span class="hr-opp">${m.opponent}${badge}</span>
      <span class="hr-score ${res}">${m.scoreHome} – ${m.scoreAway}</span>
    </div>`;
  });
  h += `</div>`;
  return h;
}

function setupSeasonLeaderboard(season) {
  const finished = seasonMatches(season);
  if (!finished.length) return;
  const ps = {};
  DB.players.forEach(p => { ps[p.id] = { goals:0, assists:0, greens:0, yellows:0, reds:0, motm:0, played:0, cleanSheets:0, vlagger:0, zaaldienst:0 }; });
  finished.forEach(m => {
    ['vlagger', 'zaaldienst'].forEach(taak => {
      const naam = taakVan(m, taak);
      const p = naam && DB.players.find(x => x.name === naam);
      if (p && ps[p.id]) ps[p.id][taak]++;
    });
    (m.squad||[]).forEach(pid => { if(ps[pid]) ps[pid].played++; });
    (m.events || []).forEach(ev => {
      if (ev.type==='goal' && ev.team==='home') {
        if (ev.scorerId && ps[ev.scorerId]) ps[ev.scorerId].goals++;
        if (ev.assistId && ps[ev.assistId]) ps[ev.assistId].assists++;
      }
      if (ev.type==='card' && ev.playerId && ps[ev.playerId]) {
        if (ev.cardType==='green') ps[ev.playerId].greens++;
        else if (ev.cardType==='yellow') ps[ev.playerId].yellows++;
        else ps[ev.playerId].reds++;
      }
    });
    if (m.motm && ps[m.motm]) ps[m.motm].motm++;
    if (m.scoreAway === 0 && m.keeper && ps[m.keeper]) ps[m.keeper].cleanSheets++;
  });
  renderLeaderboard(ps, 'goals');
  document.querySelectorAll('#statTabs .tab-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#statTabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderLeaderboard(ps, btn.dataset.sort);
    };
  });
}

function renderLeaderboard(ps, sortBy) {
  const el = document.getElementById('leaderboard');
  if (!el) return;
  let sortFn;
  if (sortBy==='goals') sortFn = (a,b) => b[1].goals-a[1].goals || b[1].assists-a[1].assists;
  else if (sortBy==='assists') sortFn = (a,b) => b[1].assists-a[1].assists || b[1].goals-a[1].goals;
  else if (sortBy==='motm') sortFn = (a,b) => b[1].motm-a[1].motm || b[1].goals-a[1].goals;
  else if (sortBy==='vlagger' || sortBy==='zaaldienst') sortFn = (a,b) => (b[1][sortBy]||0)-(a[1][sortBy]||0) || b[1].played-a[1].played;
  else sortFn = (a,b) => (b[1].greens+b[1].yellows+b[1].reds)-(a[1].greens+a[1].yellows+a[1].reds);

  const sorted = Object.entries(ps).filter(([id]) => getPlayer(id)).sort(sortFn);
  let h = `<div class="leaderboard-item" style="border-bottom:2px solid var(--border);padding-bottom:8px">
    <span class="lb-rank" style="font-size:0.65rem">#</span>
    <div class="avatar avatar-sm" style="visibility:hidden"></div>
    <span class="player-name" style="font-size:0.78rem;font-weight:700;color:var(--text-muted);flex:1">Naam</span>
    <div class="lb-stats" style="color:var(--text-muted);font-size:0.72rem">
      <span>G</span><span>A</span><span>MotM</span>
    </div>
  </div>`;
  sorted.forEach(([id, s], i) => {
    const p = getPlayer(id);
    if (!p) return;
    const taakKolom = sortBy === 'vlagger' || sortBy === 'zaaldienst';
    let stats = sortBy === 'vlagger' ? `<span>${vlagIcon(13)} ${s.vlagger || 0}</span>`
      : sortBy === 'zaaldienst' ? `<span>&#128203; ${s.zaaldienst || 0}</span>`
      : `<span>${s.goals}</span><span>${s.assists}</span>`;
    if (!taakKolom) {
      if (s.motm) stats += `<span>${s.motm}</span>`;
      if (s.cleanSheets) stats += `<span>🧤 ${s.cleanSheets}</span>`;
      if (s.greens) stats += `<span>&#x1F7E2; ${s.greens}</span>`;
      if (s.yellows) stats += `<span>&#x1F7E1; ${s.yellows}</span>`;
      if (s.reds) stats += `<span>&#x1F534; ${s.reds}</span>`;
    }
    h += `<div class="leaderboard-item">
      <span class="lb-rank ${i===0?'top':''}">${i+1}</span>
      ${avatarHTML(p, 'avatar-sm')}
      <span class="player-name" style="font-size:0.88rem;flex:1">${p.name}</span>
      <div class="lb-stats">${stats}</div>
    </div>`;
  });
  el.innerHTML = h;
}

function renderHistoricalStats(seasonKey) {
  const data = HISTORY[seasonKey];
  if (!data) return `<div class="empty-state"><p>Geen data beschikbaar</p></div>`;

  const label = seasonKey === 'all' ? 'All-time' : seasonKey;
  let h = '';

  if (data.team && data.team.wins !== undefined) {
    const t = data.team;
    h += `<div class="stat-grid">
      <div class="stat-box"><div class="stat-value">${t.played}</div><div class="stat-label">Gespeeld</div></div>
      <div class="stat-box"><div class="stat-value">${t.wins}</div><div class="stat-label">Gewonnen</div></div>
      <div class="stat-box"><div class="stat-value">${t.draws}</div><div class="stat-label">Gelijk</div></div>
      <div class="stat-box"><div class="stat-value">${t.losses}</div><div class="stat-label">Verloren</div></div>
    </div>
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-box"><div class="stat-value">${t.goalsFor}</div><div class="stat-label">Goals voor</div></div>
      <div class="stat-box"><div class="stat-value">${t.goalsAgainst}</div><div class="stat-label">Goals tegen</div></div>
      <div class="stat-box"><div class="stat-value">${t.position}e</div><div class="stat-label">Eindstand</div></div>
    </div>
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-box"><div class="stat-value">${(t.goalsFor/t.played).toFixed(1)}</div><div class="stat-label">Gem. voor</div></div>
      <div class="stat-box"><div class="stat-value">${(t.goalsAgainst/t.played).toFixed(1)}</div><div class="stat-label">Gem. tegen</div></div>
      <div class="stat-box"><div class="stat-value">+${t.goalsFor-t.goalsAgainst}</div><div class="stat-label">Doelsaldo</div></div>
    </div>`;
  } else {
    h += `<div class="stat-grid" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat-box"><div class="stat-value">${data.totalGoals}</div><div class="stat-label">Goals</div></div>
      <div class="stat-box"><div class="stat-value">${data.totalAssists}</div><div class="stat-label">Assists</div></div>
    </div>`;
  }

  if (data.standings) {
    h += `<div class="card" style="margin-top:4px">
      <h3 style="font-size:0.88rem;margin-bottom:12px">Stand Poule 1B</h3>
      <div class="standings-wrap"><table class="standings-table">
        <tr><th>#</th><th>Team</th><th>G</th><th>W</th><th>GL</th><th>V</th><th>DV</th><th>DT</th><th>+/-</th><th>P</th></tr>`;
    data.standings.forEach(r => {
      const hl = r.team === 'Joga Bonito' ? ' class="highlight"' : '';
      const dsClass = r.ds > 0 ? 'ds-pos' : (r.ds < 0 ? 'ds-neg' : '');
      h += `<tr${hl}>
        <td>${r.pos}</td><td>${r.team}</td><td>${r.g}</td><td>${r.w}</td><td>${r.gl}</td><td>${r.v}</td>
        <td>${r.dv}</td><td>${r.dt}</td><td class="${dsClass}">${r.ds > 0 ? '+' : ''}${r.ds}</td><td class="pts">${r.p}</td>
      </tr>`;
    });
    h += `</table></div></div>`;
  }

  h += `<div class="section-header" style="margin-top:8px"><h2 class="section-title">Spelers</h2>
    <button class="share-btn-sm" onclick="shareStatsCard()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      Delen</button></div>
    <div class="tab-row" id="historyTabs">
      <button class="tab-btn active" data-sort="goals">Goals</button>
      <button class="tab-btn" data-sort="assists">Assists</button>
      <button class="tab-btn" data-sort="ratio">G+A Ratio</button>
      ${(data.vlaggers || []).length ? '<button class="tab-btn" data-sort="vlagger">Vlaggen</button>' : ''}
      ${(data.zaaldiensten || []).length ? '<button class="tab-btn" data-sort="zaaldienst">Zaaldienst</button>' : ''}
    </div>
    <div class="card" id="historyLeaderboard"></div>`;

  if (data.results && data.results.length) {
    h += `<div class="section-header" style="margin-top:16px"><h2 class="section-title">Uitslagen</h2></div>
      <div class="card">`;
    data.results.forEach(r => {
      const d = new Date(r.date);
      const res = r.jb > r.opp_s ? 'win' : (r.jb < r.opp_s ? 'loss' : 'draw');
      const badge = r.comp === 'BK' ? `<span style="font-size:0.55rem;background:var(--navy-10);padding:1px 5px;border-radius:8px;font-weight:700;color:var(--navy);margin-left:4px">BEKER</span>` : '';
      h += `<div class="history-result">
        <span class="hr-date">${d.getDate()} ${d.toLocaleDateString('nl-NL',{month:'short'})}</span>
        <span class="hr-opp">${r.opp}${badge}</span>
        <span class="hr-ha">${r.home ? 'T' : 'U'}</span>
        <span class="hr-score ${res}">${r.jb} – ${r.opp_s}</span>
      </div>`;
    });
    h += `</div>`;
  }
  return h;
}

}

function renderTaakLijst(el, rijen, taak) {

    <div class="lb-stats" style="color:var(--text-muted);font-size:0.68rem"><span>${taak === 'vlagger' ? 'Gevlagd' : 'Zaaldienst'}</span></div>
  </div>`;
  [...rijen].sort((a, b) => b.count - a.count).forEach((v, i) => {
    const dbPlayer = DB.players.find(dp => dp.name === v.name);
    const avatar = dbPlayer ? avatarHTML(dbPlayer, 'avatar-sm') : `<div class="avatar avatar-sm">?</div>`;
    h += `<div class="leaderboard-item">
      <span class="lb-rank ${i===0?'top':''}">${i+1}</span>
      ${avatar}
      <span class="player-name">${v.name}</span>
      <div class="lb-stats"><span>${taak === 'vlagger' ? vlagIcon(13) : '&#128203;'} ${v.count}</span></div>
    </div>`;
  });
  el.innerHTML = h;
}

function renderHistoricalPlayerList(players, sortBy, data) {
  const el = document.getElementById('historyLeaderboard');
  if (!el) return;
  if (sortBy === 'vlagger') return renderTaakLijst(el, (data||{}).vlaggers || [], 'vlagger');
  if (sortBy === 'zaaldienst') return renderTaakLijst(el, (data||{}).zaaldiensten || [], 'zaaldienst');
  const sorted = [...players].sort((a, b) => {
    if (sortBy === 'goals') return b.goals - a.goals || b.assists - a.assists;
    if (sortBy === 'assists') return b.assists - a.assists || b.goals - a.goals;
    const ra = a.played ? (a.goals + a.assists) / a.played : 0;
    const rb = b.played ? (b.goals + b.assists) / b.played : 0;
    return rb - ra;
  });

  let h = `<div class="leaderboard-item" style="border-bottom:2px solid var(--border);padding-bottom:8px">
    <span class="lb-rank" style="font-size:0.65rem">#</span>
    <span class="player-name" style="font-size:0.78rem;font-weight:700;color:var(--text-muted);flex:1">Naam</span>
    <div class="lb-stats" style="color:var(--text-muted);font-size:0.68rem">
      <span>G</span><span>A</span><span>GP</span><span>G+A/w</span>
    </div>
  </div>`;
  sorted.forEach((p, i) => {
    const ratio = p.played ? ((p.goals + p.assists) / p.played).toFixed(1) : '–';
    const dbPlayer = DB.players.find(dp => dp.name === p.name);
    const avatar = dbPlayer ? avatarHTML(dbPlayer, 'avatar-sm') : `<div class="avatar avatar-sm">?</div>`;
    h += `<div class="leaderboard-item">
      <span class="lb-rank ${i===0?'top':''}">${i+1}</span>
      ${avatar}
      <span class="player-name" style="font-size:0.88rem;flex:1">${p.name}</span>
      <div class="lb-stats">
        <span>${p.goals}</span><span>${p.assists}</span>
        <span style="color:var(--text-muted)">${p.played}</span>
        <span style="color:var(--navy);font-weight:800">${ratio}</span>
      </div>
    </div>`;
  });
  el.innerHTML = h;
}

    id:'m'+DB.nextMatchId++, date:document.getElementById('schedDate').value,

function openScheduleMatchOptions(matchId) {
  const m = DB.matches.find(x => x.id === matchId);
  if (!m) return;
  openModal(`<h3>${m.opponent || 'TBD'}</h3>
    <p style="text-align:center;color:var(--text-muted);margin-bottom:16px">${formatDate(m.date)}${m.sporthal?' — '+m.sporthal:''}</p>
    <button class="btn btn-primary btn-block" style="margin-bottom:8px" onclick="closeModal();startLiveMatch('${matchId}')">&#9654; Live bijhouden</button>
    <button class="btn btn-outline btn-block" style="margin-bottom:8px" onclick="closeModal();openRetroModal('${matchId}')">&#9998; Resultaat invoeren</button>
    <button class="btn btn-danger-outline btn-block" style="margin-bottom:8px" onclick="closeModal();deleteScheduleMatch('${matchId}')">Verwijderen</button>
    <button class="modal-cancel" onclick="closeModal()">Sluiten</button>`);
}

function startLiveMatch(matchId) {
  const idx = DB.matches.findIndex(x => x.id === matchId);
  if (idx === -1) return;
  const m = DB.matches[idx];
  DB.currentMatch = {
    id: m.id, date: m.date, opponent: m.opponent, sporthal: m.sporthal,
    comp: m.comp || 'comp',
    squad: [], lineup: [], keeper: null, captain: null, flyingKeeper: false,
    events: [], scoreHome: 0, scoreAway: 0, half: 1, motm: null, status: 'setup'
  };
  DB.matches.splice(idx, 1);
  saveData();
  document.querySelectorAll('.bottomnav button').forEach(b => b.classList.remove('active'));
  document.querySelector('.bottomnav button[data-page="pageMatch"]').classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'pageMatch'));
  renderPage('pageMatch');
}

  openModal(`<h3>Wedstrijd Verwijderen</h3>

function confirmRetroGoal(editIdx) {
  const type = document.getElementById('rgType').value;
  const goal = {
    team: type === 'away' ? 'away' : 'home',
    ownGoal: type === 'own',
    scorerId: type === 'home' ? (document.getElementById('rgScorer').value || null) : null,
    assistId: type === 'home' ? (document.getElementById('rgAssist').value || null) : null
  };
  if (editIdx !== undefined) {
    retroState.goals[editIdx] = goal;
  } else {
    retroState.goals.push(goal);
  }
  renderRetroModal();
}

    <div id="rgPlayerFields" style="display:${type==='home'?'block':'none'}">

function removeRetroGoal(idx) {
  retroState.goals.splice(idx, 1);
  renderRetroModal();
}

function saveRetroMatch() {
  const rs = retroState;
  const scoreHome = parseInt(document.getElementById('retroHome').value) || 0;
  const scoreAway = parseInt(document.getElementById('retroAway').value) || 0;
  const motm = document.getElementById('retroMotm').value || null;

  const events = [];
  let runHome = 0, runAway = 0;
  rs.goals.forEach(g => {
    if (g.team === 'away') runAway++;
    else runHome++;
    events.push({
      type: 'goal', minute: null, half: null,
      team: g.team, ownGoal: g.ownGoal || false,
      scorerId: g.scorerId || null, assistId: g.assistId || null,
      scoreAfter: `${runHome}–${runAway}`
    });
  });

  if (rs.matchId) {
    const idx = DB.matches.findIndex(x => x.id === rs.matchId);
    if (idx !== -1) {
      const m = DB.matches[idx];
      m.scoreHome = scoreHome;
      m.scoreAway = scoreAway;
      m.events = events;
      m.motm = motm;
      m.status = 'finished';
      if (rs.comp) m.comp = rs.comp;
    }
  } else {
    DB.matches.push({
      id: 'm' + DB.nextMatchId++,
      date: rs.date, opponent: rs.opponent.trim(), sporthal: rs.sporthal,
      comp: rs.comp || 'comp',
      squad: [], lineup: [], keeper: null, captain: null, flyingKeeper: false,
      events, scoreHome, scoreAway, half: 2, motm, status: 'finished'
    });
  }

  retroState = null;
  saveData(); closeModal(); renderSchedulePage();
}

name: Scrape SRZA

on:
  schedule:
    - cron: '0 5 * * *' # 07:00 CET / 06:00 CET (winter)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scripts/scrape-srza.js
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/srza.json
          git diff --cached --quiet || git commit -m "chore: update srza data $(date -u +%Y-%m-%d)"
          git push

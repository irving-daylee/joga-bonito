name: Smoke test

# Draait niet meer los op een push naar main: deploy.yml roept deze workflow
# aan als poort vóór het publiceren, zodat de test niet dubbel draait.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

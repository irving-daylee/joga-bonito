name: Backup Firebase

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Elke maandag 05:00 CET
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rotate and download backup
        env:
          FIREBASE_DB_TOKEN: ${{ secrets.FIREBASE_DB_TOKEN }}
        run: |
          if [ -z "$FIREBASE_DB_TOKEN" ]; then
            echo "::warning::FIREBASE_DB_TOKEN not set, skipping backup"
            exit 0
          fi

          mkdir -p backups

          # Rotate: latest -> previous
          if [ -f backups/firebase-latest.json ]; then
            cp backups/firebase-latest.json backups/firebase-previous.json
            echo "Rotated previous backup"
          fi

          # Download current data
          curl -sf "https://futsal-joga-bonito-default-rtdb.europe-west1.firebasedatabase.app/data.json?auth=$FIREBASE_DB_TOKEN" -o backups/firebase-latest.json

          echo "Backup size: $(wc -c < backups/firebase-latest.json) bytes"

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add backups/
          git diff --cached --quiet || git commit -m "backup: firebase data $(date -u +%Y-%m-%d)"
          git push
